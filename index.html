  .gb-row { /* v67（老板）：「分一下列」—— 数量与耗粮各自成列，中间发丝竖线 */
    display: grid; grid-template-columns: 1fr 62px 74px; align-items: center; gap: 8px;
    font-size: var(--fs-sub);
    padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .gb-row .gb-n { flex: 1; color: var(--text); }
  .gb-row .gb-c { color: var(--gold-light); font-variant-numeric: tabular-nums;
    text-align: right; }
  .gb-row .gb-f { color: var(--text-dim); font-size: var(--fs-cap);
    text-align: right; border-left: 1px solid var(--line); padding-left: 8px; }
  .gb-empty { height: 132px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: var(--fs-sub); }

  /* ============ v20：布局 / 队列 / 对齐 / 浮层 ============ */

  /* 全局 hidden（JS 用 classList.toggle 控制显隐） */
  .hidden { display: none !important; }

  /* 侧栏隐藏时主区独占整宽（需求 7：只有城池视图显示左侧统计栏） */
  .main { transition: none; }
  .main.solo { grid-template-columns: 1fr; }
  .main.solo .auth-side { display: none; }

  /* 建造/募兵队列：迷你进度条 + 百分比（v24 起用于「公文 · 队列」与募兵面板） */
  .qbar {
    display: inline-block; width: 42px; height: 4px; border-radius: 2px;
    background: rgba(var(--sh-rgb),.5); overflow: hidden; vertical-align: middle;
  }
  .qbar i { display: block; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #7ee08a, #4fbf6a); transition: width .4s linear; }

  /* 资源行三列对齐（需求 10）：名称 / 存量 / 产量 各自固定列，数字右对齐 */
  .res-bar .res-line, #res-bar .res-line {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 8px;
    column-gap: 10px;
  }
  #res-bar .res-line .lbl { text-align: left; white-space: nowrap; }
  /* v65（老板）：「规划一下显示得齐整一点」——
     flex 布局下各行"金额"的右缘取决于它右边还有什么（增速 / 加号 / 宝物徽标），
     于是**金额对不齐**（实测右缘 148 vs 169）。改成 grid：
     金额独占第一格（定宽右对齐）→ 五行金额右缘必然一致。
     宝物徽标改为绝对定位，免得它一出现又把金额挤左。 */
  #res-bar .res-line .val {
    /* v67（老板）：「总数和生产速度挨太近，分一下列」——
       存量 | 增速 各自成列：列宽定死 + 列间距 8px + 增速列左侧一条发丝竖线。
       实测（1440×900）：两列之间从 6px 拉到 8px + 8px 内边距 + 1px 竖线。 */
    display: grid; grid-template-columns: 74px 72px 1.1em;
    align-items: center; justify-content: end; column-gap: 8px;
    min-width: 0; position: relative;
  }
  #res-bar .res-line .val .item-badge { position: absolute; right: -2px; top: -9px; }
  #res-bar .res-line .amt {
    font-variant-numeric: tabular-nums; text-align: right; justify-self: end;
    /* v65（老板）：「规划一下显示得齐整一点」——
       定宽 + 右对齐，各行的数字右缘对齐（小数点在视觉上成一列）。
       v67：列宽 78 → 74（与增速列一起重排，见上面 .val 的注释）。 */
    min-width: 74px;
  }
  #res-bar .res-line .amt .amt-u {
    font-style: normal; font-size: var(--fs-cap); font-weight: 700;
    color: var(--text-dim); margin-left: 1px;
  }
  #res-bar .res-line .rate-wrap {
    flex: none;
    /* v67（老板）：「分一下列」—— 增速列与存量列之间走一条发丝竖线 */
    border-left: 1px solid var(--line);
    padding-left: 8px;
  }
  /* v67：增速列自成一体 —— 左侧发丝竖线 + 内边距，宽度 62 → 72（容「+1,234.5/秒」） */
#res-bar .num-rate { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; display: inline-block; }

  /* ============================================================
   * v25（需求 12/13）：说明从"常驻一行"改为「触发式」
   *   · 悬停 → 浮层（桌面）
   *   · 点一下 → 小弹窗（平板没有 hover，光有浮层等于没给）
   * 用法：ui.help('说明文字')，直接拼在分区标题后面。
   * ============================================================ */
  .help-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
    border: 1px solid rgba(232,206,136,.42); color: var(--gold-light);
    font-size: var(--fs-cap); font-weight: 700; line-height: 1;
    cursor: help; opacity: .72; vertical-align: 1px;
  }
  .help-chip:hover { opacity: 1; border-color: var(--gold-light); background: rgba(232,206,136,.12); }
  /* v37（需求 2）：悬停显示统一交给 .tip-layer（原先这里是 CSS ::after 浮层）。
     data-tip 保留为**内容源**，由 ui.tipFor / ui.tipShow 读取。 */
  /* 说明小弹窗 */
  .help-body { font-size: var(--fs-body); line-height: 1.9; color: var(--text); white-space: pre-line; }

  /* 产量构成明细（需求 11）：悬停显示，v37 起走统一的 .tip-layer */
  .rate-wrap { cursor: help; }

  /* ============================================================
   * 底部固定导航条（v29 · 需求 3 / 4）
   * ------------------------------------------------------------
   * 「首页 / 上页 / 页码 / 下页 / 末页」这类翻页控件不再跟着内容跑：
   *   · 固定高度 46px —— 有没有分页都不改变高度，页面不会因为翻页而抖一下；
   *   · 没有分页时**留空**（只显示一行极淡的占位），位置照留；
   *   · 内容区因此永远不必为了够到翻页按钮而滚动（旧版分页条在内容末尾，
   *     一屏装不下就得先滚到底）。
   * ============================================================ */
  .bottombar {
    flex: none; height: 46px; display: flex; align-items: center; justify-content: center;
    padding: 0 12px; border-top: 1px solid var(--line-strong);
    background: linear-gradient(180deg, rgba(var(--sh-rgb),.28), rgba(var(--sh-rgb),.55));
  }
  .bottombar .pager {
    margin: 0; padding: 4px 10px; background: transparent; border: none;
  }
  .bottombar .bb-hint {
    color: var(--text-dim); font-size: var(--fs-sub); opacity: .45; letter-spacing: .06em;
  }

  /* ============ 分页条（v14.1：长列表不再无限下拉） ============ */
  .pager {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 5px; margin: 12px 0 4px; padding: 8px 10px;
    background: rgba(var(--sh-rgb), .22); border: 1px solid var(--line-strong); border-radius: 7px;
  }
  .pager .btn.sm { min-width: 32px; }
  .pager .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .pager .pg-info { color: var(--text-dim); font-size: var(--fs-sub); margin-left: 8px; }

  /* ============ 弹窗统一规范（v14.1） ============
     统一尺寸档位 + 底部关闭 + 内部滚动，避免超屏与无限下拉 */
  .modal { display: flex; flex-direction: column; }
  .modal .inner-panel { flex: 1; min-height: 0; overflow-y: auto; }
  .modal-foot {
    display: flex; justify-content: center; gap: 8px;
    padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line-strong);
  }


  /* ============ 将领属性详情（v14.1） ============ */
  /* v26（需求 2）：将领详情改「左头像 · 右五维」两栏，原先的居中标题块不再使用 */
  .gd-name { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); }
  .gd-sub { color: var(--text-dim); font-size: var(--fs-sub); margin-top: 4px; }
  .gd-lore { color: #9c9078; font-size: var(--fs-sub); margin-top: 4px; font-style: italic; }
  .gd-sec {
    color: var(--gold-light);
    margin: 12px 0 6px; padding-bottom: 4px; border-bottom: 1px dashed var(--line-strong);
  }
  .gd-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-body); margin: 5px 0; }
  .gd-bar {
    flex: 1; min-width: 90px; height: 7px; border-radius: 4px;
    background: rgba(var(--sh-rgb), .45); overflow: hidden; border: 1px solid #2a2416;
  }
  .gd-bar i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
  .gd-hint { color: var(--text-dim); font-size: var(--fs-sub); }
  .gd-warn { color: var(--red-light, #e08a7a); font-size: var(--fs-sub); }
  .gd-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .gd-chip {
    font-size: var(--fs-sub); padding: 3px 8px; border-radius: 4px;
    background: var(--slab-3); border: 1px solid var(--line-strong); color: var(--text-dim);
  }
  .gd-chip.on { color: var(--text); }
  .gd-chip.on.q3 { border-color: rgba(176, 111, 216, .6); color: #d8b0f0; }
  .gd-chip.on.q4 { border-color: rgba(224, 168, 60, .7); color: var(--gold-light); }
  /* 将领姓名可点进详情 */
  .tbl td .gen-link { color: var(--gold-light); cursor: pointer; text-decoration: underline dotted; }
  .tbl td .gen-link:hover { color: #fff3cf; }

  /* ============ 军队 / 兵种卡 ============ */
  /* v80（老板）：「页面分成步兵，骑兵两个界面，翻页」—— 两页切换（选中页走 .btn.gold） */
  .train-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .train-tabs .btn { min-width: 118px; }
  .troop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .troop-card {
    background: linear-gradient(180deg, var(--surface-2), var(--surface-3b));
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .troop-card:hover { transform: translateY(-3px); }
  .troop-card.disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
  .troop-card.selected { border-color: var(--green-ok); box-shadow: 0 0 0 2px rgba(123,201,111,.4); }
  .troop-card .ticon { font-size: 34px; line-height: 1; }
  /* v63（老板）：「在城内空地上选择建造的建筑类型时，把相应建筑的图标同步进去。
     不用写消耗的资源，悬停显示即可」——
     图标改成与棋盘同一套（位图/矢量两条路径），所以给图标一个**固定高度**，
     否则两条路径的高度不同、卡片高矮不一。费用挪进 title，卡片只剩"图标 + 名称"。 */
  .troop-card.bldg-pick .ticon {
    height: 84px; display: flex; align-items: center; justify-content: center;
  }
  /* 图标按高度定尺、宽度自适应 —— 位图长宽比不一致时不会被拉变形 */
  .troop-card.bldg-pick .ticon .ico { width: auto; height: 84px; max-width: 100%; object-fit: contain; }
  .troop-card .tname { font-size: var(--fs-body); font-weight: 700; color: var(--parchment); margin-top: 4px; }
  .troop-card .tstat { font-size: var(--fs-cap); color: var(--text-dim); margin-top: 3px; line-height: 1.5; }

  /* ============ 将领卡片（v20 · 需求 3：分次呈现）============
     旧版 .gen-card（.gavatar/.ginfo 结构，v11 遗留）已废弃并删除 ——
     它与新结构同名不同形，残留会把新卡片样式顶掉。
     v41（需求 2）：新结构（卡片墙）也已被「左清单 + 右档案」取代，见 .gen-split。 */
  /* ============================================================
     将领一览（v28 · 需求 2）：一屏 12 个栏位，**细条式**
     ------------------------------------------------------------
     旧的 .gen-grid 是 3 列卡片墙、每页 9 个：一屏装不下要看翻页，
     每张卡片竖排五行、信息密度极低。现在一条将领只占一行。
     v41 后 .gen-card 已彻底无引用（仅 .gcard-tag 仍用于名字旁的名将/美人标）——
     但列表页不再引用它，避免两套样式互相顶掉（本项目踩过这个坑）。
     ============================================================ */
  /* ---- 下方档案 ---- */
  .gdet { border: 1px solid var(--gold-dark); border-radius: 8px; padding: 12px;
    background: rgba(var(--sh-rgb),.2); }
  .gdet-head { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--sep-gold); }
  .gdet-name { font-size: var(--fs-lead); font-weight: 700; }
  .gdet-sub { margin-left: 10px; font-size: var(--fs-sub); font-weight: 400; color: var(--text-dim); }
  .gdet-ops { display: flex; gap: 6px; }
  .gdet-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
  /* v74：视口断点已撤（@media (max-width: 860px) .gdet-grid） */
  .gdet-side { display: flex; flex-direction: column; gap: 7px; }
  .gdet-row { display: flex; gap: 8px; font-size: var(--fs-sub); align-items: baseline; }
  .gdet-row .k { flex: none; width: 62px; color: var(--text-dim); }
  .gdet-row .v { flex: 1; min-width: 0; }
  .gd-expbar.sm { display: inline-block; width: 72px; height: 5px; border-radius: 3px;
    background: rgba(var(--sh-rgb),.45); border: 1px solid var(--line-strong); overflow: hidden;
    vertical-align: middle; margin-right: 6px; }
  .gd-expbar.sm i { display: block; height: 100%; background: linear-gradient(90deg, #7ee08a, #4fbf6a); }
  /* ============================================================
   * 将领界面（v41 · 需求 2）—— 左姓名清单 / 右完整档案
   * ------------------------------------------------------------
   * 老板原话：「将领左侧显示姓名清单，右侧显示详细属性和装备图（不需要再整一个
   * 装备图的弹窗），把完整档案的全部信息也整合过来，不需要再整个单独弹窗」。
   * 所以只有**一套**布局：左列清单 + 右列（档案 + 人形装备栏）。
   * 原先的 .gen-wall / .gen-card 卡片墙、以及 v11 遗留的第二族 .gen-card
   * 至此全部无人引用，一并删除（否则就是"样式还在、结构早没了"的死样式）。
   * ============================================================ */
  /* v52：`align-items: start` → `stretch` —— 让左清单能吃到"整行高度"（右栏档案通常更高），
     这样清单一列内容少时不再被写死的高度撑空。右栏自己 `align-self: start`，
     免得 `.gen-pane` 被拉伸后内部两栏也跟着变形。 */
  .gen-split { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .gen-split > .gen-pane { align-self: start; }
  /* 断点按**视口宽**定，不是按内容区宽 —— 视图区实际宽度 = 视口 − 侧栏(~300px)。
     1300px 视口 ≈ 内容区 1000px：再窄装备栏就放不下"人形 | 属性"两列，
     属性挪到人形下方（人形能吃满整栏，方槽才不挤）。 */
  /* v74：将领档案的 1300/1100/900 三档视口断点全部撤除 ——
     画布固定后，这些"窄窗重排"永不触发（留着反而是随窗口移动的隐患）。 */
  .gp-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* ============================================================
   * 左清单（v45 · 需求 1）：**整段可滚、不分页**
   * ------------------------------------------------------------
   * 老板要求：① 去掉「装 0/12」；② 只显示姓名与资质；③ 不再限制每页人数
   *          —— 这里允许滚动（分页会把"我到底有几个将"切碎）。
   * v46（需求 1）追加：资质**另起一行**。并排会因姓名长短不一让资质章左右跳动，
   * 逐行扫的时候很晃眼；两行后每行 ~47px，12 席仍一屏放得下。
   * ============================================================ */
  .gen-list {
    display: flex; flex-direction: column; gap: 4px;
    /* v52（老板：「左边空间都没排满整什么下拉」）：
       改前写死 `max-height: 68vh` + 常驻滚动开关 —— 于是**将领少的时候清单也被撑到 68vh**，
       下面一大片空席位/空白，滚动条却还挂在那儿（实测 12 席恰好 = 596px = 68vh）。
       "没排满"和"下拉"是同一个病根：**高度写死，而不是按内容走**。
       改成 `max-height: 100%`（吃满可用高度、内容少就矮）+ 只在真超出时才出现滚动。
       `scrollbar-gutter: stable` 保留 —— 否则内容增减会让清单宽度跳一下。 */
    max-height: 100%; overflow-y: auto; scrollbar-gutter: stable; padding-right: 2px;
  }
  /* v76（老板）：「12个空格每页，平分空间吧」——12 行平分清单高度（行随面板伸缩，
     高度不足时才退回滚动 + 最小行高兜底）。 */
  .gen-list > .gen-row { flex: 1 1 0; min-height: 40px; }
  .gen-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px; cursor: pointer;
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line);
    border-radius: var(--r-lg); transition: border-color .14s, background .14s;
  }
  .gen-row:hover { background: rgba(var(--hl-rgb),.07); border-color: rgba(232,206,136,.45); }
  .gen-row.sel { border-color: var(--gold); background: rgba(var(--hl-rgb),.10);
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06); }
  .gen-row.empty { border-style: dashed; background: rgba(var(--sh-rgb),.14); cursor: default; }
  .gen-row.empty:hover { background: rgba(var(--sh-rgb),.14); border-color: var(--line); }
  .grow-face { flex: none; width: 30px; height: 30px; display: flex; align-items: center;
    justify-content: center; color: var(--text-dim); font-size: var(--fs-h3); }
  .grow-face svg, .grow-face img { width: 30px; height: 30px; border-radius: var(--r-md); }
  /* 两行布局（v46 需求 1）：**姓名一行、资质一行**。
     上一版把二者并排，老板判为"太拥挤" —— 名单是逐行扫的，
     并排会让姓名长短不一时资质章左右跳动，反而更难扫。 */
  .grow-main { flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: flex-start; gap: 2px; }
  .grow-name { font-size: var(--fs-sub); font-weight: 700; display: flex; align-items: center;
    gap: 4px; white-space: nowrap; overflow: hidden; color: var(--text-strong); max-width: 100%; }
  .grow-sub { display: flex; align-items: center; gap: 4px;
    font-size: var(--fs-cap); color: var(--text-dim); }
  .grow-sub .grow-loy { font-style: normal; color: var(--warn); font-weight: 700; }
  .grow-st { flex: none; margin-left: auto; font-size: var(--fs-cap); color: var(--text-dim);
    padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-strong); }
  .grow-st.st-guard { color: var(--blue-info); border-color: rgba(74,155,224,.5); }
  .grow-st.st-busy { color: var(--green-ok); border-color: rgba(95,191,106,.5); }
  /* ---- 右侧：完整档案 ---- */
  .gen-pane { min-width: 0; display: flex; flex-direction: column; gap: 3px;
    background: rgba(var(--sh-rgb),.18); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 12px; }
  .gp-head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px;
    border-bottom: 1px solid var(--sep-gold); }
  /* ============================================================
   * 右侧档案 = 三块（v46 · 需求 2）
   * ------------------------------------------------------------
   * 上＝汇总身份行（横贯全宽）；左下＝六维 / 经验 / 状态；右＝装备栏。
   * 分栏比例：左栏全是文字（表格自己会折行），右栏要放人形 + 放大的将领抠图，
   * 所以右栏给得多一点。窄屏（<900px）退回单列，否则两边都会被挤到不能用。
   * ============================================================ */
  .gp-body { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
    gap: var(--sp-5); align-items: start; }
  .gp-col-l, .gp-col-r { min-width: 0; display: flex; flex-direction: column; }
  /* 每栏的第一个分区标题不再上留白 —— 上方的 gp-head 已经给了分隔线 */
  .gp-col-l > .gp-sec:first-child, .gp-col-r > .gp-sec:first-child { margin-top: 6px; }
  .gp-face { flex: none; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .gp-face svg, .gp-face img { width: 84px; height: 84px; border-radius: var(--r-md); }
  .gp-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .gp-name { font-size: var(--fs-h3); font-weight: 800; color: var(--gold-light);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .gp-sub { font-size: var(--fs-sub); color: var(--text-dim); }
  /* v58（老板："守将和解雇可以放头像所在内容的右边"）：竖排两枚短按钮，
     放在身份行内部右侧（不横排，否则会把经验条与数字挤窄）。 */
  .gp-ops { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
  /* v54（老板："任命守将左边点"）：操作从身份行右侧移到**下方一行、左对齐**。
     它不再在 .gp-head 里，所以这里要自己给上下间距。 */
  /* v58：操作已移回 .gp-head 内部，这条"上一行是 gp-head 时"的间距不再需要 */
  .gp-ops .btn { min-width: 92px; }
  /* v54（老板："将领经验条放在顶上…整个加号"）：经验条进身份行，
     右端一个「＋」开经验道具选择窗。 */
  .gp-exprow { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  /* v58（老板："经验条不要那么长"）：原来 flex:1 会撑满身份行右侧、像一条贯穿横线；
     改成**固定宽度**，右侧留给"经验数字 / 还差多少 / ＋"。 */
  .gp-exprow .gd-expbar { flex: none; width: 150px; }
  .gp-exprow .gd-expleft { flex: none; color: var(--text-dim); font-size: var(--fs-sub);
    font-variant-numeric: tabular-nums; }
  /* 守将身份时，六维"作用"里那截实际加成的颜色（与普通说明区分开） */
  .gd-u .gd-guard { color: var(--gold-light); }
  /* v59：出征战术弹窗 —— 每个兵种一块（上一行动作、下一行目标） */
  .tac-block { display: flex; flex-direction: column; gap: 4px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(var(--sh-rgb),.16); }
  .tac-block + .tac-block { margin-top: 7px; }
  .tac-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .tac-name { flex: none; min-width: 76px; font-size: var(--fs-sub); color: var(--parchment); }
  .tac-k { flex: none; font-size: var(--fs-cap); color: var(--text-dim); line-height: 22px; }
  .tac-row .chips { flex: 1; }
  /* 出征弹窗里"调整战术"的小链接 */
  .exp-tac-link { color: var(--gold-light); cursor: pointer; text-decoration: underline; margin-left: 6px; }
  .gp-exprow .gd-exptext { flex: none; }
  .gp-expadd { flex: none; min-width: 30px; padding: 1px 6px; line-height: 1.5; }
  .gp-sec { margin-top: 12px; padding-bottom: 4px;
    color: var(--gold-light); border-bottom: 1px solid var(--sep-gold); }
  /* v46（需求 2）：装备栏独占右栏。内部仍是「人形 | 属性与套装」并排 ——
     堆叠会让人形（380px）把整个档案顶到 870px，整页多出一条滚动条；
     并排后高度由人形单独决定（≈400px），余量充足。 */
  .gp-doll { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4);
    align-items: start; margin-top: 8px; }
  .gp-dollops { display: flex; gap: 6px; margin-top: 8px; }
  .gp-dollops .btn { flex: 1; }
  /* 仍在使用：名字旁的「名将 / 美人」小标 */
  .gcard-tag { flex: none; font-size: var(--fs-cap); font-weight: 400; padding: 0 4px; border-radius: 3px;
    border: 1px solid currentColor; }
  .gcard-tag.hero { color: var(--hero-tag); }
  .gcard-tag.beauty { color: var(--beauty-tag); }
  .gcard-tag.lord { color: var(--lord-tag); }

  /* ============ 属性条 ============ */
  .attr { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(201,162,75,.15); font-size: var(--fs-body); }
  .attr .k { color: var(--text-dim); }
  .attr .v { font-weight: 700; }
  .attr .v.good { color: var(--green-ok); }

  /* ============ 模态框 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(var(--sh-rgb),.65);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(2px);
  }
  /* v19：附属窗口**尺寸规范化** —— 固定尺寸档位（v75 起五档：+xxl），不随内容多少伸缩。
     内容少则留白、内容多则内部滚动，连续打开多个面板时视觉稳定。
     所有档位都受 vw/vh 上限约束，保证任何视口下都不会超出边界。 */
  /* v74（老板需求 2）：弹窗尺寸**改成固定像素**（不再随视口 vw/vh 缩放）——
     画布是死的，弹窗在画布里就应该是死的。
     仅保留一道**极小窗口兜底**（100vw/vh − 20px）：窗口比画布还小时不至于被裁到够不着。
     原先的"视口不足自动降档"（h≤860 的媒体查询）一并撤除。 */
  .modal {
    width: 660px; height: 620px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
    position: relative; overflow: hidden;
  }
  .modal-sm { width: 440px; height: 420px; }
  .modal-lg { width: 860px; height: 600px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }
  /* xl（打造面板等）：960×700 定死 —— 卡片实测高 170px，2 行 340 + 筛选/分页/间隙 434，
     700 高的弹窗正文约 530，两行稳装。
     v51 曾按"矮屏 min(700px, 88vh)"折衷；v74 画布固定后不再随视口缩（兜底同 md/lg）。 */
  .modal-xl { width: 960px; height: 700px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }
  /* xxl（v75 客栈招募）：980×800 —— 老板「大一点，尽量所有候选同一页」。
     单行候选（行高实测 36px）：14 位（客栈 Lv12 + 专精 2）与 16 位（县城上限）真机一页装下；
     兜底规则同其余档位。 */
  .modal-xxl { width: 980px; height: 800px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }

  /* ============ 弹窗统一格局（v19）============
     .m-head 标题栏（固定）· .m-body 内容区（滚动）· .m-foot 操作栏（固定）
     以往各弹窗自行拼装标题与关闭按钮，风格参差；现在一律走 ui.modalShell()。 */
  .modal .inner-shell { display: flex; flex-direction: column; overflow: hidden; }
  .m-head { flex: none; padding: 0 0 var(--sp-4); margin-bottom: var(--sp-4); border-bottom: 1px solid var(--line-strong); }
  .m-title { display: block; text-align: center; font-size: var(--fs-h2); font-weight: 800;
    color: var(--gold-light); letter-spacing: 1px;
    padding: var(--sp-1) 0;
    background: linear-gradient(90deg, transparent, rgba(201,162,75,.25), transparent); }
  .m-sub { display: block; text-align: center; color: var(--text-dim); font-size: var(--fs-sub);
    margin-top: 4px; }
  .m-body { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .m-foot { flex: none; display: flex; justify-content: center; align-items: center;
    gap: 8px; flex-wrap: wrap; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line-strong); }
  /* 统一的分区小标题（各弹窗共用） */
  .m-sec { color: var(--gold-light); margin: 12px 0 6px; }   /* v82：字号/字重走分区标题共享 */
  .m-sec:first-child { margin-top: 0; }
  /* 弹窗内表格统一外框（避免贴边） */
  .m-body .tbl { margin-top: 4px; }
  /* ============ 种田秘境（v73 · 老板需求 3） ============
     「背景是个人种田空间」：整页暖土渐变（金色三元组低透明 → 四主题自动适配），
     六格灵田；生长中是进度条 + 倒计时（每秒由 ui.updateProgress 刷新）。
     （v72 的 .dlg-ico 尺寸盒随「顶部图标块撤除」一起退役 —— 没有图标，就没有 1024px。） */
  .farm-space {
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(var(--gold-rgb),.10), transparent 62%),
      linear-gradient(180deg, rgba(var(--gold-rgb),.06), rgba(var(--sh-rgb),.10));
    border: 1px solid var(--line-strong); border-radius: var(--r-lg);
  }
  .farm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); margin: var(--sp-4) 0; }
  .farm-cell {
    display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; text-align: center;
    background: linear-gradient(180deg, rgba(var(--gold-rgb),.10), rgba(var(--gold-rgb),.02));
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    padding: var(--sp-4) var(--sp-3);
  }
  .farm-cell .pbar { width: 100%; }
  .farm-cell.ripe { border-color: var(--gold); box-shadow: 0 0 10px rgba(var(--gold-rgb),.30); }
  .farm-ic { font-size: 2.2em; line-height: 1.3; }
  .farm-crop { color: var(--gold-light); font-weight: 700; font-size: var(--fs-lead); }
  .farm-sub { color: var(--text-dim); font-size: var(--fs-sub); }
  .farm-seed {
    display: flex; align-items: center; gap: var(--sp-4);
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: var(--sp-4); margin-bottom: var(--sp-3);
  }
  .farm-seed .farm-ic { font-size: 1.6em; }
  .farm-seed-main { flex: 1; min-width: 0; }

  /* ============ 提示条 toast ============ */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    background: rgba(30,24,12,.95); color: var(--gold-light); border: 1px solid var(--gold-dark);
    padding: 10px 24px; border-radius: 8px; font-size: var(--fs-lead); font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 2000;
    box-shadow: 0 10px 30px rgba(var(--sh-rgb),.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 创建角色界面 ============ */
  /* v74（老板需求 2）：创建界面同走**固定像素画布**（窗口怎么推都不动）；
     内容超高时画布内部滚动（不裁、不重排）。
     v70 的 `margin: auto` 居中法保留（内容高过画布时不会裁顶）。 */
  .create-screen {
    width: var(--app-w); height: var(--app-h); margin: 0 auto;
    display: flex; justify-content: center; padding: 20px; overflow: auto;
  }
  .create-box {
    width: 680px; max-width: 100%; padding: 22px; margin: auto;
  }
  .create-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .avatar-select { text-align: center; }
  .avatar-big {
    width: 130px; height: 130px; margin: 14px auto; border: 3px solid var(--gold);
    border-radius: 10px; background: radial-gradient(circle at 50% 30%, #3a3a4a, #24242e);
    display: flex; align-items: center; justify-content: center; font-size: 84px;
    box-shadow: 0 8px 24px rgba(var(--sh-rgb),.5);
  }
  /* v70（老板需求 5）：头像改用画像（与将领同一套池子），不再用 emoji */
  .avatar-big img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; display: block; }
  .avatar-nav { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .avatar-nav .arrow { font-size: 26px; color: var(--teal-light); cursor: pointer; padding: 6px 14px; user-select: none; }
  .avatar-nav .arrow:hover { color: var(--gold-light); }
  .gender-toggle { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .gender-toggle .guse { padding: 4px 18px; border-radius: 5px; cursor: pointer; font-size: var(--fs-body); border: 1px solid var(--teal); }
  .gender-toggle .guse.active { background: var(--teal); color: #fff; }

  .create-form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; align-items: center; gap: 10px; }
  .field label { width: 70px; color: var(--gold-light); font-weight: 700; font-size: var(--fs-lead); white-space: nowrap; }
  .field input[type=text] {
    flex: 1; padding: 8px 10px; font-size: var(--fs-lead); color: var(--text);
    background: var(--slab-1); border: 1px solid var(--gold-dark); border-radius: 4px;
  }
  .field select { flex: 1; padding: 8px; background: var(--slab-1); color: var(--text); border: 1px solid var(--gold-dark); border-radius: 4px; }
  .summary-box { font-size: var(--fs-body); color: var(--text-dim); background: rgba(var(--sh-rgb),.25); border-radius: 6px; padding: 10px; line-height: 1.9; }
  .agree { display: flex; align-items: center; gap: 8px; font-size: var(--fs-body); color: var(--text-dim); }
  .agree input { accent-color: var(--teal); }
  .create-actions { text-align: center; margin-top: 8px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .create-save-note { text-align: center; font-size: var(--fs-sub); color: var(--text-dim); margin-top: 10px; }
  .create-save-note .good { color: var(--green-ok); }
  .chron-item.tag-offline { border-left-color: var(--blue-info); opacity: .9; }

  /* ============ 聊天/信息流底部 ============ */
  /* ============ 底部：左信息流 + 右功能入口（原版双栏）============ */
  .bottom-bar {
    margin: 0 12px 12px;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex; gap: 12px; align-items: stretch;
    font-size: var(--fs-sub); color: var(--text-dim);
  }
  .bb-left { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .bb-channels { display: flex; gap: 6px; }
  .bb-channels .ch {
    cursor: pointer; color: var(--text-dim); padding: 1px 7px;
    border-radius: 3px; border: 1px solid transparent; font-size: var(--fs-cap);
  }
  .bb-channels .ch.active { color: var(--gold-light); background: rgba(201,162,75,.18); border-color: rgba(201,162,75,.4); }
  .bb-log { color: var(--green-ok); font-size: var(--fs-sub); line-height: 1.5; overflow: hidden; }
  .bb-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .bb-btn {
    font-size: var(--fs-sub); font-weight: 700; color: var(--gold-light); white-space: nowrap;
    padding: 5px 10px; cursor: pointer; border-radius: 4px;
    background: linear-gradient(180deg,var(--btn-face-1),var(--btn-face-2));
    border: 1px solid var(--gold-dark);
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06);
  }
  .bb-btn:hover { filter: brightness(1.25); }
  .bottom-bar .sys { color: var(--green-ok); }

  /* ============ 公文页消息流（v16：由底部栏整合而来）============ */
  .msg-channels { display: flex; gap: 6px; margin-bottom: 6px; }
  .msg-channels .ch {
    cursor: pointer; color: var(--text-dim); padding: 2px 10px; font-size: var(--fs-sub);
    border-radius: 4px; border: 1px solid var(--line-strong); background: rgba(var(--sh-rgb),.2);
  }
  .msg-channels .ch.active { color: var(--gold-light); background: rgba(201,162,75,.16); border-color: rgba(201,162,75,.45); }
  /* v39（需求 4）：消息流去底色与边框 —— 原来是一个深色带边框的滚动框，
     在"一堆框"里最显眼。现在只是一段可滚的文本流（仍保留滚动能力与全部消息），
     高度 240 → 380：一屏看得更多，需要滚的时候也更少。 */
  /* v43（老板要求）：**去掉 max-height 滚动**，改分页 ——
     "下拉框"（滚动条）在项目里是明确要避免的交互。
     之前靠 max-height 380px + overflow 装下几百条，现在每页 15 条、
     页脚翻页，一屏看得完，也就不需要滚动条了。 */
  .msg-log {
    padding: 2px 4px 2px 0;
    background: none; border: 0; border-radius: 0;
    font-size: var(--fs-sub); line-height: 1.85;
  }
  .bb-line { color: var(--green-ok); }
  .bb-line.war { color: var(--amber); }
  .bb-line.task { color: var(--blue-info); }

  /* v24（需求 9）：屏幕下方的队列播报条（.queue-bar / .queue-item）已整体删除 ——
     队列状态改在「公文 · 队列」一节呈现，相关样式只保留上面那条 .qbar。 */

  /* 滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--slab-1); }
  ::-webkit-scrollbar-thumb { background: var(--wood-light); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

  /* v74：主布局的 900px 断点已撤（.main 1fr / .auth-side static / 各网格降列）——
     画布固定 1440 宽，这些"窄窗降列"规则不再需要，留着只会随窗口挪动内容。 */

  /* ============================================================
   * v21 统一层
   * ------------------------------------------------------------
   * 三层界面（大界面 .view-box / 弹窗 .modal / 地图 .map-wrap）
   * 共用同一套骨架与同一套文字层级：
   *   层级：--fs-h2 界面标题 · --fs-h3 分区标题 · --fs-body 正文
   *         --fs-lead 强调与按钮 · --fs-sub 次要 · --fs-cap 角标
   *   用色：金色 = 标题与强调；浅灰 = 正文与数据；暗灰 = 次要信息
   *         状态色 = 成功(绿)/危险(红)/提醒(琥珀)/信息(蓝)，仅表状态
   *   边界：发丝描边 + 背景亮度表达层级（暗色界面不用投影）
   * ============================================================ */

  /* ---- 信息条：只承载事实与数据，不再写玩法说明（需求 5）---- */
  .note {
    /* v82：行高走备注族共享（1.65） */
    font-size: var(--fs-sub);
    color: var(--text-dim);
    background: rgba(var(--sh-rgb), .20);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4);
    margin-top: var(--sp-3);
  }
  .note b { color: var(--parchment); font-weight: 700; }
  /* v82（老板「统一各级标题，文字，备注」）：
     备注族一处定义 —— 说明 / 空态 / 提示类文字统一 12px · 常规字重 · 次要色 · 行高 1.65。 */
  .note, .ui-sub, .nt-info, .op-hint, .m-sub, .gb-empty, .q-empty,
  .gd-hint, .farm-sub, .auto-note, .create-save-note, .q-det-tip, .ds-empty {
    font-size: var(--fs-sub);
    color: var(--text-dim);
    line-height: 1.65;
  }
  .ui-sub { font-size: var(--fs-sub); color: var(--text-dim); }
  .nt-info { font-size: var(--fs-sub); color: var(--text-dim); }

  /* ---- 伤兵营（校场与行军共用，v21 需求 1）---- */
  .wounded-box {
    margin-top: var(--sp-4);
    padding: var(--sp-4);
    border: 1px solid rgba(201, 162, 75, .30);
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, rgba(201, 162, 75, .10), rgba(var(--sh-rgb), .18));
  }
  .wounded-box .wb-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--sp-2);
  }
  .wounded-box .wb-t { color: var(--gold-light); }   /* v82：字号/字重/字距走分区标题共享 */
  .wounded-box .wb-n {
    font-size: var(--fs-lead); font-weight: 800; color: var(--parchment);
    font-variant-numeric: tabular-nums;
  }
  .wounded-box .attr { border-bottom: 0; padding: 2px 0; }
  .wounded-box .wb-act { margin-top: var(--sp-3); text-align: center; }

  /* ---- 页脚三套合一：.m-foot / .modal-foot / .panel-foot 同规格 ---- */
  .m-foot, .modal-foot, .panel-foot {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    gap: var(--sp-3); padding-top: var(--sp-4); margin-top: var(--sp-4);
    border-top: 1px solid var(--line);
  }

  /* ---- 设置项卡片（5 处重复的 inline 写法抽成一处）---- */
  .set-card {
    background: rgba(var(--sh-rgb), .20);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-5);
    margin-bottom: var(--sp-4);
  }

  /* ---- 卡片基线：同屏所有卡片同一几何（圆角/内边距）---- */
  /* v41（需求 2）：.gen-card 已随将领卡片墙删除；将领行改用 .gen-row 自己的一组几何 */
  .q-card, .item-row, .eq-cell, .bag-cell, .inn-card, .story-card, .xc-row {
    border-radius: var(--r-lg);
    padding: var(--sp-4);
  }
  /* 描边统一为发丝级；金色描边只保留给「可交互的兵种卡」等有语义处 */
  .q-card, .item-row, .bag-cell, .eq-cell, .inn-card, .story-card, .xc-row {
    border-color: var(--line);
  }
  /* v75（老板）：「尽量所有候选都能在同一页」——客栈候选行**紧凑几何**：
     共用基线给的 10px 内衬对"一页装下"太厚，这里就地收窄
     （同权重、写在基线之后者胜）；配 28px 头像 → 行高实测 36px。 */
  .inn-card { padding: 3px 10px; margin-bottom: 3px; }

  /* ---- 标题外观共享：三层界面的标题字重/字色/字距只有一处定义 ---- */
  .gold-heading, .m-title, .q-det-title {
    font-size: var(--fs-h2);
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(var(--sh-rgb), .6);
  }
  /* 三层界面的分区小标题同样只有一处定义；
     v82（老板「统一各级标题」）：把漏网的六处收进来 —— 任务详情 .q-det-sec /
     将领档案 .gp-sec / 时装 .fsn-t / 操作分区 .op-zone-t（原 12px 灰字）/
     史册 .ledger-sec / 简牍 .seal-h —— 全站分区标题同规格（13px / 800 / 金色 / 字距 .5px）。 */
  .q-sec-t, .q-det-sec, .bag-sec, .gd-sec, .forge-q, .m-sec, .side-title, .wb-t,
  .gp-sec, .fsn-t, .op-zone-t, .ledger-sec, .seal-h {
    font-size: var(--fs-h3);
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: .5px;
  }

  /* ---- 等级角标（v23 · 需求 2/3）：格内右上，只显示数字 ---- */
  .tile-badge {
    position: absolute; right: 4px; top: 3px;
    min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px;
    border-radius: 9px; text-align: center;
    font-size: var(--fs-cap); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--ink-on-gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow: 0 1px 3px rgba(var(--sh-rgb), .55);
  }
  .tile-badge.max { color: var(--ink-on-gold); background: linear-gradient(180deg, #a8e59a, var(--green-ok)); }
  /* 名字留在底部（等级不再挤在这一行） */
  .tile-label .lv { display: none; }

  /* ---- 官府宫殿（v23 · 需求 4）：4 格融合成一座建筑 ---- */
  .gov-palace { position: absolute; z-index: 3; cursor: pointer; transition: z-index 0s; }
  .gov-palace .tile-face { inset: 2px; border-radius: 12px; }
  .gov-palace .gov-art {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 16px; pointer-events: none; z-index: 4;
  }
  .gov-palace .gov-svg { width: 86%; height: 86%; display: block; filter: none; }
  /* v36：官府位图（AI 汉代宫殿）。2×2 格的外框是正方形，与 1024×1024 方图同比例，
     contain 既不裁也不变形；底对齐 + 接地投影，让它"落"在台基上而非浮着。 */
  .gov-palace .gov-img {
    width: 100%; height: 100%; display: block;
    object-fit: contain; object-position: center bottom;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.42));
  }
  .gov-palace:hover .tile-face { filter: brightness(1.16); border-color: rgba(232, 206, 136, .55); }
  .gov-palace:hover { z-index: 6; }
  .gov-palace.busy .tile-face { background: linear-gradient(180deg, #2b2a22, #211f18); border-color: rgba(214, 178, 105, .34); }

  /* ---- 统计页概览卡（v23 · 需求 5）---- */
  /* ============================================================
   * 竹简卷轴（v25 · 需求 14）：统计 / 公文 的美术底
   * ------------------------------------------------------------
   * 明确不用"数据座舱"式看板：那种一屏彩色卡片 + 圆角阴影，
   * 放在三国题材里是两张皮。这里改用**竹简 + 朱印**：
   *   · 竖向简纹（repeating-linear-gradient 画出片片竹简的缝）
   *   · 上下两根卷轴木轴（伪元素，带两端轴头）
   *   · 朱印作为标题标点，数值用朱笔/金笔大字
   * ============================================================ */
  /* ============================================================
   * 官府黄册（v27 · 需求 7）：统计页的信息呈现
   * ------------------------------------------------------------
   * 原先是一排 8 个「卡片 + 竖排标签 + 大字数值」，本质还是数据座舱：
   * 卡片之间有 8 处边框、8 处底色、8 处间距，眼睛没有落点，
   * 竖排标签还要转头去读。改成一册账本：
   *   · 分「甲 · 疆域 / 乙 · 军民 / 丙 · 在外」三段，每段内是
   *     「项目 …… 数值」的引线行，数值右对齐、等宽数字；
   *   · 只有墨线与朱点，没有卡片；信息密度提高，落点清晰。
   * ============================================================ */
  /* ============ 自动化（v29 · 需求 5） ============ */
  .auto-switches { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .auto-switches .btn { flex: 1 1 150px; }
  .auto-switches .btn.auto-on {
    background: linear-gradient(180deg, #3a5c3c, #26402a);
    border-color: var(--green-ok); color: var(--text-strong);
    box-shadow: 0 2px 6px rgba(var(--sh-rgb),.4), inset 0 1px 0 rgba(var(--hl-rgb),.12);
  }
  .auto-card { border: 1px solid var(--gold-dark); border-radius: 8px; padding: 12px;
    margin-bottom: 12px; background: rgba(var(--sh-rgb),.2); }
  .auto-card > .ac-title { color: var(--gold-light); font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .auto-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .auto-line > .al-k { flex: none; width: 72px; color: var(--text-dim); font-size: var(--fs-sub); }
  .auto-note { color: var(--text-dim); font-size: var(--fs-sub); margin-top: 8px; }
  .auto-state { margin-top: 8px; padding: 7px 10px; border-radius: 6px;
    background: rgba(var(--sh-rgb),.28); border: 1px solid var(--line-strong);
    font-size: var(--fs-sub); color: var(--text-dim); }

  /* v29（需求 7）：全境汇总左右分列 —— 同类同侧 */
  /* v29（需求 9）：城池名后的等级标注 [都城] / [州城] … */
  .city-tier { color: var(--gold-light); opacity: .85; font-size: var(--fs-cap); font-weight: 400; margin-left: 2px; }
  /* v79：【主城】标识（与档位标同族、金色描边更亮） */
  .city-tier.mt { color: var(--gold-light); opacity: 1; filter: brightness(1.3);
    border: 1px solid var(--gold-light); border-radius: 4px; padding: 0 4px; margin-left: 5px; font-weight: 700; }
  /* v79：神器面板（君主菜单 → 🏺 神器） */
  .art-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-top: 8px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: rgba(var(--sh-rgb), .22); }
  .art-ic { font-size: 2.2em; line-height: 1.25; }   /* 走 em：守"裸像素字号"预算 */
  .art-main { flex: 1; min-width: 0; }
  .art-nm { color: var(--gold-light); font-weight: 700; margin-bottom: 2px; }
  .art-lv { color: var(--green-ok); margin-left: 4px; }
  .art-side { color: var(--text-dim); font-size: var(--fs-cap); white-space: nowrap; }

  /* v54（老板："别一边长一边短，留空一大块"）：账册改成**单列**。
     改前是 `1fr 1fr` 两列 —— 节标题横贯全宽，于是每节的行数是奇数时
     最后一行只占左列、右列空着（甲·疆域 3 笔就正好这样），
     行数少的时候还会整体一边长一边短。单列之后每笔独占一行：
     **结构上不可能出现空格，也不可能歪**。 */
  .ledger { display: grid; grid-template-columns: 1fr; margin: 2px 0 4px; }
  .ledger-sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px;
    margin: 10px 0 2px; color: var(--gold-light); }
  .ledger-sec::before { content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cinnabar); box-shadow: 0 0 6px rgba(168,58,44,.7); flex: none; }
  .ledger-sec::after { content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line-strong), transparent); }
  .lg-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 2px;
    font-size: var(--fs-body); border-bottom: 1px dotted rgba(201,162,75,.14); }
  .lg-row .lg-k { color: var(--text-dim); flex: none; }
  .lg-row .lg-fill { flex: 1; min-width: 12px; border-bottom: 1px dotted rgba(201,162,75,.28);
    transform: translateY(-3px); }
  .lg-row .lg-v { color: var(--parchment); font-weight: 700;
    font-variant-numeric: tabular-nums; flex: none; }
  .lg-row .lg-v .lg-sub { color: var(--text-dim); font-weight: 400; font-size: var(--fs-sub); }
  .lg-row.hero .lg-v { color: var(--gold-light); }

  .scroll-page {
    position: relative; padding: 0; border-radius: 4px;
    background:
      repeating-linear-gradient(90deg,
        rgba(var(--sh-rgb),.30) 0 1px, rgba(var(--hl-rgb),.024) 1px 3px,
        rgba(var(--sh-rgb),.11) 3px 4px, rgba(var(--sh-rgb),0) 4px 15px),
      linear-gradient(180deg, #1d1c16 0%, #16161b 45%, #101116 100%);
    border: 1px solid rgba(201,162,75,.20); border-top: none; border-bottom: none;
    box-shadow: inset 0 0 60px rgba(var(--sh-rgb),.55), inset 0 1px 0 rgba(var(--hl-rgb),.03);
    margin: 16px 0;
  }
  /* 上下卷轴木轴 */
  .scroll-axis {
    position: relative; height: 18px; margin: 0 -10px;
    border-radius: 9px;
    background: linear-gradient(180deg, #6b5330, #3c2c16 55%, #241a0c);
    border: 1px solid rgba(var(--sh-rgb),.6);
    box-shadow: 0 3px 10px rgba(var(--sh-rgb),.55), inset 0 1px 0 rgba(255,225,170,.22);
  }
  .scroll-axis::before, .scroll-axis::after {
    content: ''; position: absolute; top: -3px; width: 16px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a98a4e, #4a3618 62%, #221a0b);
    border: 1px solid rgba(var(--sh-rgb),.55);
  }
  .scroll-axis::before { left: -12px; }
  .scroll-axis::after { right: -12px; }
  .scroll-body { padding: 14px 16px 16px; }

  /* 标题：朱印 + 墨书 */
  .scroll-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(201,162,75,.26); }
  .scroll-title .seal {
    flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #9d3524, #6d2114); color: var(--parchment);
    font-size: var(--fs-body); font-weight: 800; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,220,180,.35), 0 2px 6px rgba(var(--sh-rgb),.5);
  }
  .scroll-title .tx { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); letter-spacing: 2px; }
  .scroll-title .rq { margin-left: auto; font-size: var(--fs-sub); color: var(--text-dim); }

  /* 简牍：每个指标一枚窄简 —— 标签竖排、数值朱笔 */
  /* 简牍分区标题（替代 emoji 小标） */
  .seal-h {
    display: flex; align-items: center; gap: 7px; margin: 16px 0 8px;
    color: var(--gold-light);
  }
  .seal-h::before {
    content: ''; flex: none; width: 7px; height: 14px; border-radius: 1px;
    background: linear-gradient(180deg, #9d3524, #5f1c11);
    box-shadow: 0 0 0 1px rgba(255,200,170,.18);
  }
  .seal-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,162,75,.30), transparent); }
  .seal-h .cnt { font-size: var(--fs-sub); color: var(--text-dim); font-weight: 400; letter-spacing: 0; }

  /* 驿报：战报做成"文书"行 */
  /* v39（需求 4）：战报从"一条一个框"改为**列表行** ——
     底色、边框、圆角全部去掉，只留一条底部分隔线；胜负改用行首一个小圆点区分。
     整行可点（原先右侧的「查看」按钮也是一个个小框）。 */
  .doc-bar { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 2px;
    border-bottom: 1px solid var(--line); cursor: pointer; transition: background .14s; }
  .doc-bar:last-child { border-bottom: 0; }
  .doc-bar::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cinnabar); box-shadow: 0 0 6px rgba(168,58,44,.55); }
  .doc-bar.win::before { background: #4fbf6a; box-shadow: 0 0 6px rgba(79,191,106,.55); }
  .doc-bar:hover { background: rgba(var(--hl-rgb),.05); }
  .doc-bar .db-t { flex: 1; font-size: var(--fs-body); font-weight: 700; color: var(--gold-light); }
  .doc-bar .db-d { font-size: var(--fs-sub); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .doc-bar .db-go { flex: none; font-size: var(--fs-sub); color: var(--gold-light); opacity: .55; }
  .doc-bar:hover .db-go { opacity: 1; }
  /* 榜文（公告） */
  .scroll-page .notice-box {
    background: linear-gradient(180deg, rgba(232,206,136,.06), rgba(var(--sh-rgb),.26));
    border: 1px solid rgba(201,162,75,.20); border-radius: 3px; padding: 10px 12px;
  }
  .scroll-page .tbl th { background: linear-gradient(180deg, rgba(107,83,48,.55), rgba(var(--sh-rgb),.3)); }
  .scroll-page .tbl td { border-bottom: 1px dotted rgba(201,162,75,.16); }

  /* ---- 野地管理（v23 · 需求 1）---- */
  .wild-stat { background: rgba(var(--sh-rgb),.20); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: var(--sp-3) var(--sp-4); margin-top: var(--sp-3); }
  .modal-scroll { max-height: 414px; overflow-y: auto; padding-right: 4px; }

  /* ---- 点选按钮组（v22 · 需求 1：全站不用下拉框）----
     下拉框要两次点击、展开层会盖住内容、在弹窗里还与外层滚动打架；
     选项只有 4~5 个时它纯属杀鸡用牛刀。统一改为「点一下就选中」。 */
  .chips { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; }
  .chips .chip {
    display: inline-flex; align-items: baseline; gap: 4px;
    padding: 3px 10px; border-radius: 12px; cursor: pointer;
    font-size: var(--fs-sub); color: var(--text-dim); white-space: nowrap;
    background: rgba(var(--sh-rgb), .28); border: 1px solid var(--line-strong);
    transition: color .14s, border-color .14s, background .14s;
  }
  .chips .chip:hover { color: var(--gold-light); border-color: var(--sep-gold); }
  .chips .chip.on {
    color: var(--ink-on-gold); font-weight: 700;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    border-color: var(--gold-light);
  }
  .chips .chip-sub { font-size: var(--fs-cap); opacity: .6; font-weight: 400; }
  .chips .chip.on .chip-sub { opacity: .8; }
  .chips-xs .chip { padding: 1px 7px; font-size: var(--fs-cap); border-radius: 9px; }
  /* v60（需求 4）：将领页的「本城 / 全境」范围切换 —— 与标题同行，不另占一行高度 */
  .chips.gen-scope { width: auto; margin-left: var(--sp-2); vertical-align: middle; }
  .chips.gen-scope .chip { padding: 1px 9px; font-size: var(--fs-cap); }
  .chips.city-chips, .chips.res-chips, .chips.gen-chips { width: 100%; }
  /* 将领可能几十位 → 点选列表给个高度上限，超出的滚动看 */
  /* v27（需求 6）：将领选择原先是一条**只有 96px 高的滚动列表** ——
     实际效果和下拉框一模一样（要滚才能看到后面的将领），
     而且滚动条还挂在弹窗里（弹窗本来就要求不出现滚动条）。
     将领上限 = 招贤馆等级（≤10 位），改成两列网格后全部一次呈现，不需要滚动。 */
  .chips.gen-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 1px; }
  .chips.gen-chips .chip { justify-content: center; text-align: center; }
  .chips.gen-chips.inline { width: auto; max-width: 100%; }
  .mk-pick { flex-wrap: wrap; }
  /* v61（老板）：满配城的城内布局块（野外城池 / 未占据名城共用）——
     三行账册式排布，右列允许折行（14 项建筑名一行放不下）。 */
  .plan-box { background: rgba(var(--sh-rgb), .20); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 6px 10px; margin: 6px 0; }
  .plan-box .attr { margin: 2px 0; }
  .plan-box .plan-v { text-align: right; max-width: 74%; line-height: 1.5; }
  .plan-box .plan-dim { color: var(--text-dim); font-size: var(--fs-cap); }

  /* ---- 将领肖像（v22 · 需求 2）---- */
  .portrait-holder { display: inline-block; position: relative; line-height: 0; }
  .portrait-holder img, .portrait-holder svg { display: block; border-radius: 10px; }
  .portrait-svg { display: block; border-radius: 10px; }
  /* v41（需求 2）：此处原为**第三族** .gen-card（v22 遗留，.gc-face/.gc-body 结构）。
     三族同名样式叠了三版，是「同一处三种来源」的典型；将领改左右分栏后全部无人引用，
     一并删除。 */
  .gd-face { display: flex; justify-content: center; }
  .inn-avatar { font-size: 20px; width: 28px; display: flex; align-items: center; justify-content: center; }   /* v82：两条同名规则合并为一 */

  /* ---- 城池视图（v22 · 需求 3）：中央只留棋盘 ----
     城池名 / 人口驻军 / 征收 / 显示比例 / 岁贡 全部下沉到左侧栏，
     让「看的东西」占满中央、操作类控件待在侧栏。 */
  .city-pure { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; }
  .city-pure .city-iso { padding: 0; }

  /* ============================================================
   * v45（需求 2）：城池/城外界面**消除滚动条**
   * ------------------------------------------------------------
   * 实机实测：`#view-container` 竖向溢出 **11px**，于是这两个"整屏棋盘"的界面
   * 永远挂着一条滚动条（老板说的"下拉框"）。
   * 算法对不上账的原因：`ui.fitTile` 已按 16px 呼吸量收边，而 `.ui-page` 又叠了
   * 上下各 `--sp-5`(14px) 的内边距 —— 28 − 16 = 12px，正好就是溢出的那 11~12px。
   * 置 0 后棋盘正好落在可视高度内；16px 呼吸量足够，不会贴边。
   * ============================================================ */
  .ui-page.city-pure { padding: 0; }

  /* 城池下拉框（v45 需求 3）：侧栏顶部换城。
     为什么这里破例用原生 <select>：可选项（城池数）随进程不断增长，
     点选 chips 在窄侧栏里会折成好几行、把城池属性的位置挤下去；
     下拉框恒定一行，且能一次看全"我有哪些城"。 */
  .city-switch { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  /* v53：城池清单的**持久容器** —— 它只在"城池清单或当前城池变了"时才被重建，
     其余时间主循环一个字节都不碰，原生下拉列表才不会被每秒重绘冲合。
     单城时里面是空的，靠 :empty 收掉，不留空行。 */
  .city-switch-host { padding: 7px 10px 0; }
  .city-switch-host:empty { display: none; }
  .city-switch .cs-lbl { color: var(--text-dim); font-size: var(--fs-sub); flex: none; }
  .city-select {
    flex: 1; min-width: 0;
    padding: 4px 6px; border-radius: 5px; cursor: pointer;
    background: var(--slab-1); color: var(--text); border: 1px solid var(--gold-dark);
    font-size: var(--fs-sub); font-family: inherit;
    text-overflow: ellipsis;
  }
  .city-select:hover { border-color: var(--gold-light); }
  .city-select:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 0 2px rgba(232, 206, 136, .18); }
  /* v82（老板）：「不需要显示原名 新城池」——官府面板的原名标注退役，
     对应样式随之撤除（域层 origName 照记：州治判定/战报仍按它对号）。 */
  .side-body .zoom-bar { margin: 0; justify-content: flex-start; }

  /* ---- 页面容器：三种界面同一内边距节奏 ---- */
  .ui-page { padding: var(--sp-5); }
  .panel-body > .ui-page { padding: 0 !important; }

  /* ============================================================
   * 将领详情（v26 · 需求 2）：左头像 · 右五维
   * ------------------------------------------------------------
   * 头像固定 168px 在左，属性在右并排；五维表只给一个数值列，
   * "作用"是固定文案（每点……），实时数值在「当前效果」行里。
   * 经验条与经验道具行用于把商城买的练兵经验直接消耗在将领身上。
   * ============================================================ */
  .gd-hero { display: flex; gap: var(--sp-5); align-items: flex-start;
    padding-bottom: var(--sp-4); border-bottom: 1px solid var(--line-strong); }
  .gd-hero .gd-face { flex: none; width: 168px; height: 168px; }
  .gd-hero .gd-face img, .gd-hero .gd-face svg { width: 168px; height: 168px; border-radius: 10px; display: block; }
  .gd-side { flex: 1; min-width: 0; }
  .gd-tag { font-size: var(--fs-cap); border-radius: 4px; padding: 0 4px; }
  .gd-tag.hero { color: var(--hero-tag); border: 1px solid rgba(230,184,0,.5); }
  .gd-tag.beauty { color: #d88ab8; border: 1px solid rgba(216,138,184,.5); }

  /* v65（老板）：「统率这些属性名都成 2 行了，占空间」——
     根因是**表格自动分配宽度**：作用列文字长 → 抢走空间 → 第一列被压到折行。
     所以这里给第一列**固定宽 + nowrap**（名字短，一定放得下），
     作用列吃剩余宽度；`table-layout:fixed` 保证列宽不再随内容抖动。 */
  .gd-dims { margin-top: var(--sp-3); table-layout: fixed; width: 100%; }
  .gd-dims th, .gd-dims td { padding: 3px 6px; }
  .gd-dims th:first-child, .gd-dims td:first-child {
    width: 52px; white-space: nowrap; padding-left: 8px;
  }
  /* ⚠️ `table-layout: fixed` 下列宽**只由第一行的 th 决定** ——
     写在 td（.gd-v）上的 width 会被忽略（实测：td 写 62px，实际仍是均分的 253px）。
     所以这里把宽度写回 th 上，作用列自动吃剩余宽度，永不折行。 */
  .gd-dims th:nth-child(1) { width: 52px; }
  .gd-dims th:nth-child(2) { width: 62px; }
  .gd-dims .gd-v { font-weight: 800; font-size: var(--fs-lead);
    color: var(--parchment); font-variant-numeric: tabular-nums; }
  .gd-dims .gd-u { color: var(--text-dim); font-size: var(--fs-sub); line-height: 1.5; }
  /* v74（老板需求 4）：加点列的 ＋ 按钮（原来这里是"每点作用"文字列；
     作用文案已进六维名称的悬停）。 */
  .gd-dims .gd-plus-c { padding-right: 4px; }
  .gd-dims .gd-plus { padding: 0 8px; line-height: 1.5; }
  /* v74（老板需求 5）：自由属性点行（表末整行） */
  .gd-freep td { border-top: 1px dashed var(--line-strong); color: var(--text-dim);
    font-size: var(--fs-sub); padding: 5px 6px 5px 8px; }
  .gd-freep .fp-n { color: var(--gold-light); font-size: var(--fs-lead); font-weight: 800;
    margin: 0 6px; font-variant-numeric: tabular-nums; }
  .gd-freep .gd-free-hint { margin-left: 6px; opacity: .75; }
  /* v74（老板需求 3）：类型签（均衡 / 猛将…）与非空闲状态小签 */
  .gp-style { display: inline-block; margin-left: 8px; color: var(--text-dim); font-size: var(--fs-cap); }
  .gp-stag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
    font-size: var(--fs-cap); color: var(--gold-light); background: rgba(var(--gold-rgb),.14); }
  /* v74（老板需求 5）：加点弹窗行（自由点 / 道具） */
  .stat-row { display: flex; align-items: center; gap: 8px; justify-content: space-between;
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: 8px 10px; margin: 6px 0; }
  .stat-row .sr-name { font-weight: 700; color: var(--gold-light); }
  .stat-row .sr-sub { color: var(--text-dim); font-size: var(--fs-sub); flex: 1; }

  /* v74：`.gd-effect`（带兵/人口/产量/速度 四行备注）随老板需求 6 整块撤除 —— 样式同步下线。 */

  .gd-expbar { height: 10px; border-radius: 5px; background: rgba(var(--sh-rgb),.45);
    border: 1px solid var(--line); overflow: hidden; }
  .gd-expbar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #7ee08a, #4fbf6a); transition: width .3s; }
  .gd-exptext { font-size: var(--fs-sub); color: var(--text-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gd-exptext b { color: var(--gold-light); }
  /* ============ v67：存档管理面板 ============
     7 个槽位一屏放完，**不出下拉条**（老板的硬规矩）。 */
  .sv-list { border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
  .sv-row {
    display: grid; grid-template-columns: 96px 1fr auto;
    align-items: center; gap: 8px; padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }
  .sv-row:last-child { border-bottom: none; }
  .sv-row .sv-n { font-weight: 700; }
  .sv-row .sv-s { color: var(--text-dim); font-size: var(--fs-sub); }
  .sv-row .sv-b { display: flex; gap: 4px; }
  .sv-empty { opacity: .5; }
  .sv-imp { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .sv-ta {
    width: 100%; height: 72px; margin-top: 6px; box-sizing: border-box;
    background: var(--surface-3); color: var(--text); font-size: var(--fs-cap);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px; resize: vertical;
  }

  /* ============================================================
     v77（老板）
     ------------------------------------------------------------
     ① 资源区：附属野地下拉框（原「本城 · 城名」表头退役）
     ② 客栈招募：表格版式（表头 + 单行数据，含月俸列）
     ③ 君主面板：左右分栏（左城池列表 / 右信息表）
     ④ 铁匠铺：百炼强化列表
     ============================================================ */
  .wild-pick-host { margin-bottom: 3px; }
  .wild-pick-host .res-line { display: flex; align-items: center; gap: 6px; }
  .wild-select { flex: 1 1 auto; min-width: 0; max-width: 168px; }

  /* v80（老板）：「表格行宽相对固定，根据字串长度搞个适合的固定表，在换人时框架不动，
     只有将领信息变动」——table-layout: fixed 只认声明过的宽度（colgroup，见 ui.openInn）；
     列宽按各列字串长度分配：将领最宽（头像+姓名）、四维最窄（2~3 位数字）。
     列宽和贴着容器实宽（实测 942px）：不足时浏览器会按比例压列，别随手改单列。 */
  .inn-tbl { margin: 0; table-layout: fixed; }
  .inn-tbl col.c-name { width: 188px; }
  .inn-tbl col.c-lv { width: 58px; }
  .inn-tbl col.c-rank { width: 168px; }
  .inn-tbl col.c-style { width: 66px; }
  .inn-tbl col.c-attr { width: 58px; }
  .inn-tbl col.c-salary { width: 88px; }
  .inn-tbl col.c-act { width: 140px; }
  .inn-tbl th, .inn-tbl td { padding: 3px 8px; }
  .inn-tbl .inn-face-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .inn-tbl tr.off td { opacity: .55; }
  .inn-tbl .rank-badge { white-space: nowrap; }
  .inn-tbl .inn-act { display: flex; align-items: center; gap: 6px; justify-content: flex-end; white-space: nowrap; }

  .lord-split { display: grid; grid-template-columns: 5fr 6fr; gap: 12px; align-items: start; }
  .lord-city { display: flex; align-items: center; gap: 8px; padding: 5px 8px;
    border: 1px solid var(--sep-gold); border-radius: var(--r-lg); margin-bottom: 5px; }
  .lord-city.cur { border-color: var(--gold-dark); background: rgba(201, 162, 75, .10); }
  .lord-city .ls-nm { color: var(--gold-light); font-weight: 700; white-space: nowrap; }
  .lord-city .ls-meta { color: var(--text-dim); flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lord-tbl td.k { width: 86px; color: var(--text-dim); white-space: nowrap; }

  .enh-list { display: flex; flex-direction: column; }
  .enh-row { display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-bottom: 1px solid var(--sep-gold); }
  .enh-row:last-child { border-bottom: none; }
  .enh-nm { flex: 1 1 auto; min-width: 0; }
  .enh-tag { color: var(--gold-light); font-weight: 700; margin-left: 4px; }
  .enh-cost { color: var(--text-dim); font-size: var(--fs-sub); }
  /* ---------- v89.1 全屏剧本视觉化（幕景横幅 / 幕题 / 徽章 / 结算卡） ---------- */
  .sxf-wrap { --sxf-art-sz: 118px; --sxf-act-sz: 40px; --sxf-emb-sz: 52px;
    max-width: 860px; margin: 0 auto; padding: var(--sp-6) var(--sp-5) 72px;
    animation: sxfIn .38s ease-out both; }
  .sxf-hero { position: relative; overflow: hidden; border: 1px solid var(--sep-gold);
    border-radius: var(--r-xl); padding: var(--sp-5) var(--sp-6) var(--sp-4); background: var(--panel-bg); }
  .sxf-hero-art { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    font-size: var(--sxf-art-sz); line-height: 1; opacity: .10; pointer-events: none; }
  .sxf-hero-top { position: relative; display: flex; align-items: center; gap: 10px; }
  .sxf-act-ic { font-size: var(--sxf-act-sz); line-height: 1; }
  .sxf-hero-name { font-size: var(--fs-h1); font-weight: 800; color: var(--gold-light); }
  .sxf-hero-kind { color: var(--text-dim); font-size: var(--fs-cap); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 1px 8px; }
  .sxf-hero-lord { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .sxf-lord-meta { display: flex; flex-direction: column; align-items: flex-end; }
  .sxf-lord-meta b { color: var(--text-strong); }
  .sxf-lord-sub { color: var(--text-dim); font-size: var(--fs-cap); white-space: nowrap; }
  .sxf-hero-meta { position: relative; color: var(--text-dim); font-size: var(--fs-sub); margin-top: 6px; }
  .sxf-hero-foot { position: relative; display: flex; align-items: center; margin-top: var(--sp-4);
    border-top: 1px solid var(--line); padding-top: var(--sp-4); }
  .sxf-dots { letter-spacing: 5px; }
  .sxf-dot { color: var(--text-dim); }
  .sxf-dot.on { color: var(--gold); }
  .sxf-hero-foot .btn { margin-left: auto; }
  .sxf-timeline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-4);
    color: var(--text-dim); font-size: var(--fs-sub); }
  .sxf-tl-cap { color: var(--gold-light); }
  .sxf-tl-item { color: var(--text-strong); }
  .sxf-tl-l { color: var(--text-dim); margin-left: 4px; }
  .sxf-tl-sep { color: var(--text-dim); }
  .sxf-stage { margin-top: var(--sp-4); }
  .sxf-stage-tag { display: flex; align-items: baseline; gap: 10px; margin-bottom: var(--sp-3); }
  .sxf-stage-no { color: var(--gold-light); font-size: var(--fs-sub); letter-spacing: 1px; }
  .sxf-stage-tt { color: var(--text-strong); font-size: var(--fs-h3); font-weight: 700; }
  .sxf-narr { background: var(--panel-bg); border: 1px solid var(--sep-gold); border-radius: var(--r-lg);
    padding: var(--sp-5) var(--sp-6); font-size: var(--fs-lead); line-height: 1.95; color: var(--text); }
  .sxf-q { color: var(--gold-light); }
  .sxf-opts { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
  .btn.sxf-opt { display: flex; align-items: center; gap: 10px; text-align: left; padding: var(--sp-4) var(--sp-5);
    font-size: var(--fs-lead); }
  .sxf-opt-l { flex: 1 1 auto; min-width: 0; }
  .sxf-opt-l b { color: var(--gold-light); }
  .sxf-opt-d { color: var(--text-dim); font-weight: 400; margin-left: 10px; font-size: var(--fs-sub); }
  .sxf-opt-b { flex: 0 0 auto; display: inline-flex; gap: 6px; }
  .sxf-bdg { border: 1px solid; border-radius: 999px; padding: 1px 7px; font-size: var(--fs-cap);
    white-space: nowrap; line-height: 1.6; }
  .sxf-note { margin-top: var(--sp-4); color: var(--text-dim); font-size: var(--fs-cap); }
  .sxf-result { text-align: center; margin-top: var(--sp-5); }
  .sxf-emblem { width: 96px; height: 96px; margin: 0 auto; display: flex; align-items: center;
    justify-content: center; font-size: var(--sxf-emb-sz); border: 1px solid; border-radius: 50%;
    background: var(--panel-bg); box-shadow: 0 0 26px rgba(var(--gold-rgb), .18);
    animation: sxfPop .5s cubic-bezier(.2,.9,.3,1.35) both; }
  .sxf-exit-t { font-size: var(--fs-h1); font-weight: 800; margin-top: var(--sp-4); }
  .sxf-exit-s { color: var(--text-dim); font-size: var(--fs-sub); margin-top: 4px; }
  .sxf-loot { background: var(--panel-bg); border: 1px solid var(--sep-gold); border-radius: var(--r-lg);
    padding: var(--sp-4) var(--sp-6); margin-top: var(--sp-5); text-align: left; }
  .sxf-loot-hd { color: var(--text-dim); font-size: var(--fs-body); margin-bottom: 6px; }
  .sxf-loot-row { font-size: var(--fs-lead); line-height: 2; color: var(--green-ok); }
  .sxf-loot-row.bad { color: var(--red-light); }
  .sxf-loot-row::before { content: '◆ '; font-size: var(--fs-cap); }
  .sxf-cost { color: var(--text-dim); font-size: var(--fs-cap); margin-top: var(--sp-4); }
  .sxf-exit-row { margin-top: var(--sp-6); }
  @keyframes sxfIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes sxfPop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

  /* ---------- v89.2 场景化（场景画布 / 热点点选 / 时机条） ---------- */
  .sxf-scene { position: relative; margin-top: var(--sp-4); border: 1px solid var(--sep-gold);
    border-radius: var(--r-xl); overflow: hidden; background: var(--slab-1);
    box-shadow: inset 0 0 44px rgba(var(--sh-rgb), .30); animation: sxfIn .4s ease-out both; }
  .sxf-canvas { display: block; width: 100%; height: auto; }
  .sxf-scene.is-done .sxf-canvas { opacity: .84; filter: saturate(.85); }
  .sxf-spots { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .btn.sxf-opt.sxf-spot { position: absolute; transform: translate(-50%, -50%);
    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
    width: auto; padding: 0; background: none; border: none; box-shadow: none; }
  .sxf-spot-hit { width: 22px; height: 22px; border-radius: 50%;
    background: rgba(var(--gold-rgb), .92); border: 2px solid rgba(var(--hl-rgb), .85);
    box-shadow: 0 0 0 0 rgba(var(--gold-rgb), .55), 0 2px 6px rgba(var(--sh-rgb), .5);
    animation: sxfPing 1.8s ease-out infinite; }
  .btn.sxf-opt.sxf-spot:hover .sxf-spot-hit { background: var(--gold); }
  .sxf-spot-lb { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    background: rgba(var(--sh-rgb), .62); border: 1px solid var(--sep-gold);
    border-radius: 999px; padding: 2px 10px; font-size: var(--fs-cap); color: var(--parchment); }
  .sxf-spot-lb b { color: var(--gold-light); }
  .sxf-sc-tip { position: absolute; left: var(--sp-4); bottom: var(--sp-3); z-index: 2;
    font-size: var(--fs-cap); color: var(--parchment); background: rgba(var(--sh-rgb), .55);
    border-radius: 999px; padding: 2px 10px; letter-spacing: 1px; }
  .sxf-timing { margin-top: var(--sp-4); background: var(--panel-bg); border: 1px solid var(--sep-gold);
    border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); }
  .sxf-tk { position: relative; height: 26px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, rgba(var(--sh-rgb), .55), rgba(var(--sh-rgb), .30));
    border: 1px solid var(--line-strong); }
  .sxf-zone { position: absolute; top: 0; height: 100%; }
  .sxf-zone-g { left: 28%; width: 44%; background: rgba(var(--hl-rgb), .08); }
  .sxf-zone-p { left: 44%; width: 12%; background: rgba(var(--gold-rgb), .38); }
  .sxf-mark { position: absolute; top: 2px; left: 4%; width: 4px; height: 20px; border-radius: 3px;
    background: var(--gold-light); box-shadow: 0 0 8px rgba(var(--gold-rgb), .8); }
  .sxf-tm-row { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-3); }
  .sxf-tm-hint { flex: 1 1 auto; color: var(--text-dim); font-size: var(--fs-cap); }
  .sxf-opt-ic { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(var(--hl-rgb), .08); font-size: var(--fs-body); }
  @keyframes sxfPing {
    0% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), .55), 0 2px 6px rgba(var(--sh-rgb), .5); }
    70% { box-shadow: 0 0 0 14px rgba(var(--gold-rgb), 0), 0 2px 6px rgba(var(--sh-rgb), .5); }
    100% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), 0), 0 2px 6px rgba(var(--sh-rgb), .5); }
  }

</style>
</head>
<body>

<!-- 创建角色界面 -->
<div class="create-screen" id="screen-create">
  <div class="create-box wood-frame">
    <div class="inner-panel">
      <div class="gold-heading">创建城池</div>
      <div class="create-inner">
        <div>
          <div class="avatar-select">
            <div class="ui-sub" style="margin-bottom:6px;">选择头像</div>
            <div class="avatar-big" id="create-avatar">🧔</div>
            <div class="avatar-nav">
              <div class="arrow" data-action="avatar-prev">◀</div>
              <div class="arrow" data-action="avatar-next">▶</div>
            </div>
            <div class="gender-toggle">
              <div class="guse active" data-gender="male" data-action="gender-set">男</div>
              <div class="guse" data-gender="female" data-action="gender-set">女</div>
            </div>
          </div>
        </div>
        <div class="create-form">
          <div class="field"><label>君主名字</label><input type="text" id="create-name" maxlength="12" placeholder="输入你的名字"></div>
          <div class="field"><label>城池归属</label>
            <!-- v22（需求 1）：下拉框改为点选按钮组；隐藏域保留原 id，读取端不用改 -->
            <input type="hidden" id="create-region" value="random">
            <!-- v70（老板需求 5）：「城池归属应归属到州城所辖范围内，目前几个选项不太 OK」——
                 旧的「北方/中原/江南」只是三句文案（从不影响落位）；现在给出**十三州**，
                 选哪个州，出生城就落在该州州治近旁（GAME.pickStartPos，就近归属同一判据）。 -->
            <span class="chips" style="flex:1;flex-wrap:wrap;">
              <span class="chip on" data-action="chip-set" data-v="random" data-target="create-region" data-after="region">随机</span>
              <span class="chip" data-action="chip-set" data-v="司隶" data-target="create-region" data-after="region">司隶</span>
              <span class="chip" data-action="chip-set" data-v="兖州" data-target="create-region" data-after="region">兖州</span>
              <span class="chip" data-action="chip-set" data-v="豫州" data-target="create-region" data-after="region">豫州</span>
              <span class="chip" data-action="chip-set" data-v="徐州" data-target="create-region" data-after="region">徐州</span>
              <span class="chip" data-action="chip-set" data-v="青州" data-target="create-region" data-after="region">青州</span>
              <span class="chip" data-action="chip-set" data-v="冀州" data-target="create-region" data-after="region">冀州</span>
              <span class="chip" data-action="chip-set" data-v="幽州" data-target="create-region" data-after="region">幽州</span>
              <span class="chip" data-action="chip-set" data-v="并州" data-target="create-region" data-after="region">并州</span>
              <span class="chip" data-action="chip-set" data-v="凉州" data-target="create-region" data-after="region">凉州</span>
              <span class="chip" data-action="chip-set" data-v="益州" data-target="create-region" data-after="region">益州</span>
              <span class="chip" data-action="chip-set" data-v="荆州" data-target="create-region" data-after="region">荆州</span>
              <span class="chip" data-action="chip-set" data-v="扬州" data-target="create-region" data-after="region">扬州</span>
              <span class="chip" data-action="chip-set" data-v="交州" data-target="create-region" data-after="region">交州</span>
            </span>
          </div>
          <div class="summary-box" id="create-summary">
            君主数：0 &nbsp; 城池数：0 &nbsp; 拥挤度：0%<br>
            <span id="create-map-preview">（选择归属后随机生成初始城池位置）</span>
          </div>
          <div class="create-actions">
            <button class="btn gold lg hidden" id="create-continue" data-action="create-continue">继续上次的游戏</button>
            <button class="btn lg" id="create-start" data-action="create-start">开始新的征程</button>
            <!-- v67：存档管理放**首页**，因为"换台机器要导入存档"正是从首页开始的 -->
            <button class="btn" id="create-saves" data-action="open-saves">💾 存档管理</button>
          </div>
          <div class="create-save-note" id="create-save-note"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 主游戏界面 -->
<div id="screen-game" class="hidden">
  <!-- 顶部导航 -->
  <!-- v19：菜单按**类型分组**，同类型相邻、不同类型以竖线分隔
       ① 场景：城池 / 地图   ② 军事：将领 / 行军
       ③ 成长：任务 / 商城 / 爵位   ④ 记录：史册 / 公文   ⑤ 系统：设置 / 存档 / 新游戏
       原「公告」菜单已取消，内容并入「公文」 -->
  <div class="topnav" id="topnav">
    <!-- v25（需求 10）：① 每个菜单加手绘线描图标（JS 填 <i class="ti">）
         ② 任务与统计相邻  ③「爵位」不再是独立菜单，并入「君主」
         ④ 商城 / 背包由弹窗改为**整页视图**，与其他菜单一致 -->
    <div class="tab active" data-view="city"><i class="ti" data-nav="city"></i>城池</div>
    <div class="tab" data-view="ext"><i class="ti" data-nav="ext"></i>城外</div>
    <div class="tab" data-view="map"><i class="ti" data-nav="map"></i>地图</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="generals"><i class="ti" data-nav="general"></i>将领</div>
    <!-- v41（需求 3）：行军菜单**不再挂数值徽标** —— 老板指出「不要给在行军这个
         菜单名上产生数值」。顶栏徽标的语义是"有事情等你处理"（如任务可领取）；
         行军只是"部队在外面"，属状态不属待办。队列数在行军菜单里本来就有。 -->
    <div class="tab" data-view="marches"><i class="ti" data-nav="march"></i>行军</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="tasks"><i class="ti" data-nav="quest"></i>任务<span class="tab-badge hidden" id="tab-badge-task"></span></div>
    <div class="tab" data-view="stats"><i class="ti" data-nav="stats"></i>统计</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="shop"><i class="ti" data-nav="shop"></i>商城</div>
    <div class="tab" data-view="bag"><i class="ti" data-nav="bag"></i>背包</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="story"><i class="ti" data-nav="story"></i>史册</div>
    <div class="tab" data-view="reports"><i class="ti" data-nav="doc"></i>公文</div>
    <span class="nav-sep"></span>
    <!-- v29（需求 5）：①「自动」独立成菜单，就放在「设置」旁边 ——
         自动升级/研究/出征是**一类**东西（让系统替你干活），挤在设置里既不好找、
         也没空间放"将领 / 兵力 / 目标 / 等级 / 类型 / 频率"这些参数。
         ② 顶栏的「存档 / 新游戏」删掉 —— 设置面板里本来就有同一对按钮，
         顶栏再摆一份只是让右手边常年挂着两个危险按钮。 -->
    <div class="tab" data-view="auto"><i class="ti" data-nav="auto"></i>自动</div>
    <div class="tab" data-view="settings"><i class="ti" data-nav="settings"></i>设置</div>
    <!-- v26（需求 3）：天时是**全局**信息（季节/天候/年号影响所有城池），
         放在城池属性里不合逻辑；margin-left:auto 把它推到最右。 -->
    <div class="nav-sky" id="nav-sky" title="天时（季节 / 天候 / 年号）"></div>
  </div>

  <div class="main">
    <!-- 左侧：君主栏 + 城池属性栏 + 资源栏（原版三段式信息区） -->
    <div class="auth-side">
      <div class="lord-card">
        <!-- ① 君主栏 -->
        <!-- v25（需求 9）：头像换成程序化立绘（不再是 emoji）；「城池 N 城」这类统计从这一栏删掉。
             v81（老板）：「官职这行放玩家名称，现在的名称位置去掉」—— 游戏里没有官职体系，
             该行退役、君主名并入信息表首行；旧的头像旁名称列一并撤除。 -->
        <div class="lord-head">
          <div class="lord-portrait" id="lord-avatar"></div>
          <div class="lord-meta">
            <div class="row mrow-name"><span class="name" id="lord-name">—</span></div>
            <div class="row"><span>声望</span><span id="lord-rep">0</span></div>
            <div class="row"><span>爵位</span><span id="lord-rank">0</span></div>
          </div>
        </div>
        <!-- v20（需求 6）：背包已移至顶栏；「任务」与顶栏重复，一并移除 -->
        <div class="side-btnrow">
          <div class="sbtn" data-action="open-lord">君主</div>
        </div>

        <!-- ② 城池属性栏 -->
        <div class="side-block">
          <div class="side-title">
            <span>城池属性</span>
            <!-- v77（老板）：「城池属性右边的 3 个按钮以及相应的计算链就不要了
                 （建筑信息，资源生产，附属野地）」——三个入口整条退役。
                 附属野地改从**资源区的下拉框**进（见 #wild-pick-host）。 -->
            <span class="side-quick"></span>
          </div>
          <!-- v53：城池清单**单独成一个静态节点**，不再拼进 #city-attrs 的 html ——
               主循环每秒重绘城池属性，若把这个下拉框一起换掉，展开的列表会立刻合上
               （老板："点出来列表马上收回去了"）。它只在城池清单/当前城池变化时才重建。 -->
          <div class="city-switch-host" id="city-switch-host"></div>
          <div class="side-body" id="city-attrs"></div>
        </div>

        <!-- v27（需求 1）：原「城池操作」板块已删除 ——
             征收在官府、显示比例在设置、岁贡在名城官府，这一栏只剩"切换城池"；
             而切城已经并进「城池属性」顶部（多城时才出现），
             单独占一个带标题的板块既浪费纵向空间、又让侧栏出现滚动条。 -->

        <!-- ③ 资源栏（每项带 + 快捷道具） -->
        <div class="side-block">
          <div class="side-title"><span>资源</span><span class="side-quick" id="res-prod-hint"></span></div>
          <!-- v77（老板）：「资源这里的备注：本城 新城池改成附属野地 下拉框」——
               独立静态节点（同 #city-switch-host 的做法）：主循环每秒重绘资源栏，
               若把下拉框拼进 #res-bar，展开的列表会每秒被合上。 -->
          <div class="wild-pick-host" id="wild-pick-host"></div>
          <div class="side-body" id="res-bar"></div>
          <!-- v16：资源下方固定驻军栏 -->
          <div class="garrison-bar" id="garrison-bar"></div>
        </div>
      </div>
    </div>

    <!-- 中央 -->
    <div class="central">
      <!-- v26（需求 5）：城内 / 城外 已提升为顶栏菜单（城池=城内），
           中央不再需要子页签那一行 —— 它正是把棋盘往下挤的那 30px。 -->
      <div class="view-box" id="view-container"></div>
    </div>
  </div>

  <!-- v29（需求 3/4）：底部固定导航条 —— 所有「首页/上页/页码/下页/末页」
       统一在这里渲染（见 ui.pagerHTML / ui.paintBottom）。
       它挂在 .main 之外，所以不会被内容滚动带着走；高度固定，翻页时页面不抖。 -->
  <div class="bottombar" id="bottom-bar"></div>

  <!-- v16：底部消息栏与功能按钮已移除：
       消息 → 整合进「公文」菜单；商城/公告 → 移入顶栏；排行 → 取消；设置 → 顶栏已有 -->
</div>

<div class="toast" id="toast"></div>
<!-- v37（需求 2）：悬停浮层挂载点。放在 body 末尾 + position:fixed + z-index 9000 ——
     它是全站最高的一层，且不受任何容器 overflow/transform 影响（父级 transform
     会把它变成局部层叠上下文并裁切，这正是旧浮层被压住/被裁的原因）。 -->
<div id="tip-layer" class="tip-layer" aria-hidden="true"></div>
<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/questdata.js"></script>
<script src="js/systems.js"></script>
<script src="js/domain.js"></script>
<script src="js/map.js"></script>
<script src="js/battle.js"></script>
<!-- v27（需求 5）：回合制文字战场。放在 battle.js 之后 —— simulate 由它接管 -->
<script src="js/tactic.js"></script>
<script src="js/icons.js"></script>
<!-- v32（需求「采用网图」）：game-icons 开源图标素材层。必须在 icons.js 之后 ——
     icons.js 内的取图函数用 typeof GICONS 延迟绑定，渲染时才真正查表。 -->
<script src="js/gicons.js"></script>
<!-- v35：AI 位图素材登记表（汉代风，最高优先级）。同样在 icons.js 之后 ——
     取图函数用 typeof BITMAPS 延迟绑定；未登记的 id 自动回退矢量层。 -->
<script src="js/bitmaps.js"></script>
<script src="js/portraits.js"></script>
<script src="js/story.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
