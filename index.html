<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热血三国·单机版</title>
<style>
  :root {
    /* ============================================================
     * 配色（v16 改进）
     * 原为「深绿棕」底色（#14161c / #1c1f27），黄绿偏色重、对比刺眼，久看费眼。
     * 改为**深墨蓝灰**基调：降饱和、去黄绿偏色，文字改中性浅灰，对比更柔和。
     * 金色作为唯一的暖色点缀保留。
     * ============================================================ */
    --bg-dark: #1e222b;
    --panel-bg: #272c37;
    --wood: #574530;
    --wood-light: #7d6450;
    --wood-dark: #3a3028;
    --gold: #cfa856;
    /* v41（需求 4）：公文新战报提醒 —— 图标闪黄的底色与同色系深字 */
    --alert-gold: #ffd84d; --alert-ink: #3a2c06;
    --gold-light: #edd08a;
    --gold-dark: #8a6a2c;
    --parchment: #efe6cf;
    --parchment-dark: #d9caa8;
    --teal: #2f6b5a;
    --teal-light: #3e8571;
    --red: #8a2b1f;
    --red-light: #b04a35;
    --text: #eae7e0;
    --text-dim: #a8a7af;
    --text-dark: #2a2416;
    --green-ok: #7bc96f;
    --blue-info: #6fb7e0;

    /* ============================================================
     * 排版令牌（v21）——**全界面唯一字号来源**
     * 历史问题：全站出现 22 种字号（9.5/10/10.5/11/11.5/12/12.5/13/
     * 13.5/14/14.5/15/16/17/18/19/20/22/26/34/40/84），同级别界面
     * 各写各的，同一层级的标题在「大界面 18px / 弹窗 16px / 地图 18px」
     * 三处都不一样，看起来像三个人拼的。
     *
     * 现在收敛成 5 级，任何文本只允许引用下列变量：
     *   L1 --fs-h1    界面主标题（地图名、君主名、首页）
     *   L2 --fs-h2    界面标题（大界面 / 弹窗 / 地图 **同一规格**）
     *   L3 --fs-h3    分区标题（用字重 + 金色区分层级，不靠字号堆叠）
     *   L3 --fs-body  正文、表格、列表
     *   L3 --fs-lead  按钮、需要强调的正文
     *   L4 --fs-sub   次要信息（标签、单位、时间）
     *   L5 --fs-cap   微标注（角标、计数、脚注）
     * 图标/装饰字形（emoji 头像、"+"/"★" 等符号）不属排版层级，
     * 仍按图形尺寸直接写 px，不受此表约束。
     *
     * v82（老板「统一各级标题，文字，备注的字体格式，大小，粗细」）：
     *   · 字重只留**三档**：400 正文 / 700 强调（按钮·数值·名字）/ 800 标题；
     *   · 分区标题族与备注族各只有**一处共享定义**（见文末两段共享规则）；
     *   · 字体族全局一处（body 的 PingFang SC 族），等宽例外仅 .bt-strip 一处。
     * ============================================================ */
    --fs-h1: 20px;
    --fs-h2: 16px;
    --fs-h3: 13px;
    --fs-body: 13px;
    --fs-lead: 14px;
    --fs-sub: 12px;
    --fs-cap: 11px;

    /* 间距阶梯（同一层级的留白必须取自同一档） */
    --sp-1: 4px;  --sp-2: 6px;  --sp-3: 8px;
    --sp-4: 10px; --sp-5: 14px; --sp-6: 18px;

    /* 圆角阶梯 */
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px;

    /* 层级分隔线：暗色界面用发丝级半透明白，不用不透明深灰 */
    --line: rgba(var(--hl-rgb),.09);

    /* ---- 语义色（v21）：散落的近似色收敛为命名变量，**色值不变** ----
       用色规则：金色系=标题与强调 · 米白=名称与关键数值 · 中性灰=次要信息
                 绿=正向/成功 · 红=危险/损失 · 琥珀=提醒 · 蓝=信息
                 品质色(q1~q4)与资质色(rank-*)是**辨识用色板**，保持区分度 */
    --text-strong: #f4ebd4;
    --ink-on-gold: #2a2318;
    --warn: #e6a400;
    --amber: #e0a83c;
    --hero-tag: #e6b800;
    --beauty-tag: #e08ab0;   /* v29：美人标（原写死在 .gcard-tag.beauty 里） */
    --lord-tag: #e0b23c;     /* v70：君主标（玩家角色本人） */
    --beauty: #e58aa8;
    --q1: #b9b4a8; --q2: #6fbf7a; --q3: #5aa0d8; --q4: #d8a83c;
    --rank-fan: #9c9c8c; --rank-liang: #5fbf6a; --rank-ying: #4a9be0; --rank-ming: #b06fd8;
    /* 任务分类标签色板（8 类集中一处） */
    /* 黄册朱印 / 文字战场（v27）：两处新出现的颜色，同样走命名变量 */
    --cinnabar: #a83a2c; --strip-troop: #d8b04e; --strip-gap: #3c4148;
    --tag-growth: #d8b04e; --tag-military: #c9705a; --tag-war: #b8412f;
    --tag-build: #7fa85a; --tag-govern: #d8c46a; --tag-forge: #c9a06a;


    --line-strong: rgba(var(--hl-rgb),.15);
    --sep-gold: rgba(var(--gold-rgb),.28);

    /* ============================================================
     * 主题层（v39 · 需求 1）—— 换肤的唯一开关
     * ------------------------------------------------------------
     * 下面这组是**结构性颜色**：页底 / 面板 / 卡片 / 内槽 / 木钮 / 叠层。
     * 换主题只覆盖它们，业务 CSS、页面结构与 JS 一律不动。
     * 三个基色三元组（--sh-rgb / --hl-rgb / --gold-rgb）用来让
     * 「半透明黑阴影」与「半透明白描边」在浅色主题下整体换向 ——
     * alpha 全部保持原样，只换基色，因此不必逐条重写阴影。
     * ============================================================ */
    --sh-rgb: 0,0,0;              /* 阴影/暗面基色 */
    --hl-rgb: 255,255,255;        /* 高光/描边基色 */
    --gold-rgb: 201,162,75;       /* 金色线条基色（浅底上要加深） */
    --bg-2: #232833;              /* 页底渐变中段 */
    --bg-3: #1a1e26;              /* 页底渐变末段 / 底部固定条 */
    --surface-2: #343b49;         /* 卡片/格子顶（原 #262931） */
    --surface-3: #292f3a;         /* 卡片/格子底（原 #1c1f26） */
    --surface-2b: #3c4250;        /* 次级卡顶（原 #31343d） */
    --surface-2c: #353b47;        /* 次级卡中（原 #2a2e37） */
    --surface-3b: #262b34;        /* 网格底（原 #1e2129） */
    --slab-1: #22262f;            /* 输入框/内槽/滚动条轨（原 #1a1c22） */
    --slab-2: #2f333e;            /* 内槽亮档 */
    --slab-3: #31353f;            /* 深卡（原 #23262e） */
    --btn-face-1: #4a4a3c;        /* 木钮顶（原 #3a3a2c） */
    --btn-face-2: #33363f;        /* 木钮底（原 #252832） */
    --btn-hi-1: #5c5c4a;          /* 木钮悬停顶（原 #4c4c3a） */
    --btn-hi-2: #414450;          /* 木钮悬停底（原 #33332a） */
    --scrim: rgba(0,0,0,.62);     /* 弹窗遮罩 */

    /* ---- 地面与野地色（v39 · 需求 2/3）----
       地块不再逐格画渐变与花纹，改铺**纯色**；颜色随主题走：
       深色主题配偏暗的草绿（亮草绿在暗底上过于跳），
       浅色主题配浅草绿。野地四色就是老板点名的
       「农田偏黄 / 伐木偏青绿 / 采石偏灰 / 铁矿偏棕黑」。 */
    --ground: #8b9a78;            /* 城内地面（一整片） */
    --ground-busy: #a09580;       /* 施工工地（土色） */
    --ground-gov: #a59b80;        /* 官署格 */
    --ground-sel: #9caa86;        /* 选中格 */
    --res-farm: #c2b45e;          /* 农田 · 麦黄 */
    --res-forest: #6b8a5c;        /* 林地 · 青绿 */
    --res-quarry: #a8a495;        /* 采石 · 石灰 */
    --res-mine: #8a7052;          /* 矿场 · 棕黑 */
  }

  /* ============================================================
   * 主题四套（v39 · 需求 1）
   * ------------------------------------------------------------
   * 默认（:root）= 墨玉。下面三套按需覆盖。
   * 选型依据「护眼、适宜长时间玩耍」：
   *   · 素绢 / 青竹是**浅色系**，底色都不取纯白 —— 纯白反光强、
   *     长看刺眼；改用米黄与青灰，并把正文降到中深褐，压低对比；
   *   · 金/绿/蓝/品质色四组在浅底上全部加深，否则原值会「亮得发飘」；
   *   · 阴影基色改褐灰、描边基色改深褐，避免白线在浅底上隐形。
   * ============================================================ */
  /* ---- 素绢：暖米黄浅色（长玩首选）---- */
  html[data-theme="silk"] {
    --bg-dark: #e6e2d8; --bg-2: #ded9cd; --bg-3: #d3cec4;
    --panel-bg: #f4f1e9;
    --surface-2: #fbfaf6; --surface-3: #efece4;
    --surface-2b: #f8f6ef; --surface-2c: #f0ede5; --surface-3b: #e8e4da;
    --slab-1: #e6e2d8; --slab-2: #ddd8cb; --slab-3: #e9e5db;
    --btn-face-1: #d6c8a6; --btn-face-2: #c2b18c;
    --btn-hi-1: #e2d5b4; --btn-hi-2: #cdbc98;
    --wood: #ab8760; --wood-light: #c9a47c; --wood-dark: #7d6144;
    --gold: #8a6516; --gold-light: #a1751a; --gold-dark: #6b4e10;
    --text: #3b3325; --text-dim: #6b6353; --text-strong: #2b2418;
    --green-ok: #3f8a3a; --blue-info: #2a6d9a; --warn: #a87400; --amber: #9a7018;
    --red: #9a2f20; --red-light: #8a2b1f;
    --parchment: #fbf7ec; --parchment-dark: #e6dcc4;
    --q1: #8a857a; --q2: #3f7f48; --q3: #2f6f9a; --q4: #9a7018;
    --rank-fan: #7a7a6c; --rank-liang: #3f8a45; --rank-ying: #2f6f9a; --rank-ming: #7a4a9a;
    --cinnabar: #9a3428; --hero-tag: #a87400; --beauty-tag: #a04468; --beauty: #a04468;
    --tag-growth: #9a7018; --tag-military: #a04a32; --tag-war: #9a3428;
    --tag-build: #4f7a38; --tag-govern: #8a7418; --tag-forge: #95683a;
    --strip-troop: #b08a2c; --strip-gap: #cdc4ae;
    --sh-rgb: 96,79,50; --hl-rgb: 92,76,46; --gold-rgb: 138,101,22;
    --scrim: rgba(78,64,40,.42);
    --line: rgba(var(--hl-rgb),.16); --line-strong: rgba(var(--hl-rgb),.28);
    --sep-gold: rgba(var(--gold-rgb),.30);
    --ground: #c6cbb3; --ground-busy: #cdc3ae; --ground-gov: #cbc5b2; --ground-sel: #c8cfb8;
    --res-farm: #ded08a; --res-forest: #9dba9c; --res-quarry: #c9c9c0; --res-mine: #b0a396;
  }
  /* ---- 青竹：浅青灰绿（低对比、偏冷）---- */
  html[data-theme="bamboo"] {
    --bg-dark: #dde4e2; --bg-2: #d5dedb; --bg-3: #cad4d1;
    --panel-bg: #eaf0ee;
    --surface-2: #f6faf9; --surface-3: #e7efed;
    --surface-2b: #f0f6f5; --surface-2c: #e8f0ee; --surface-3b: #dfe8e6;
    --slab-1: #dde5e3; --slab-2: #d3dcd9; --slab-3: #e1eae8;
    --btn-face-1: #c2cfba; --btn-face-2: #adbba6;
    --btn-hi-1: #cfdac7; --btn-hi-2: #b9c6b2;
    --wood: #8e7a5a; --wood-light: #ab9673; --wood-dark: #6b5b40;
    --gold: #7d6a1c; --gold-light: #947c1e; --gold-dark: #5f5010;
    --text: #2c3830; --text-dim: #55605c; --text-strong: #1f2a22;
    --green-ok: #357a3a; --blue-info: #26688f; --warn: #966c00; --amber: #8a6818;
    --red: #8f2c1e; --red-light: #7d271b;
    --parchment: #f7fbf6; --parchment-dark: #dde7dc;
    --q1: #7d857f; --q2: #3a7a45; --q3: #2c6b95; --q4: #8f6a18;
    --rank-fan: #71807a; --rank-liang: #3a8442; --rank-ying: #2c6b95; --rank-ming: #6f469a;
    --cinnabar: #8f3226; --hero-tag: #966c00; --beauty-tag: #96436a; --beauty: #96436a;
    --tag-growth: #8f6a18; --tag-military: #96472f; --tag-war: #8f3226;
    --tag-build: #467334; --tag-govern: #7d6c14; --tag-forge: #8a6238;
    --strip-troop: #9c7d2a; --strip-gap: #c2cdc0;
    --sh-rgb: 74,92,76; --hl-rgb: 62,84,66; --gold-rgb: 125,106,28;
    --scrim: rgba(58,74,60,.42);
    --line: rgba(var(--hl-rgb),.18); --line-strong: rgba(var(--hl-rgb),.30);
    --sep-gold: rgba(var(--gold-rgb),.32);
    --ground: #c2ccbc; --ground-busy: #c9c4ad; --ground-gov: #c7c2ab; --ground-sel: #c6d0bf;
    --res-farm: #d6cd8e; --res-forest: #93b295; --res-quarry: #c4c8c0; --res-mine: #a9a094;
  }
  /* ---- 夜阑：近黑（夜间 / 暗房）---- */
  html[data-theme="night"] {
    --bg-dark: #101319; --bg-2: #14181f; --bg-3: #0c0f14;
    --panel-bg: #171b22;
    --surface-2: #1f242c; --surface-3: #1a1e25;
    --surface-2b: #23272f; --surface-2c: #1f232b; --surface-3b: #14171c;
    --slab-1: #13161b; --slab-2: #1b1e25; --slab-3: #1b1e25;
    --btn-face-1: #26261c; --btn-face-2: #1c1f26;
    --btn-hi-1: #33332a; --btn-hi-2: #262931;
    --wood: #3a2e22; --wood-light: #553f2c; --wood-dark: #241d18;
    --gold: #c09640; --gold-light: #d8b878; --gold-dark: #7a5c24;
    --text: #d8d5cd; --text-dim: #8f8e96; --text-strong: #e8dcbe;
    --sh-rgb: 0,0,0; --hl-rgb: 200,205,220; --gold-rgb: 192,150,64;
    --scrim: rgba(0,0,0,.72);
    --line: rgba(var(--hl-rgb),.07); --line-strong: rgba(var(--hl-rgb),.12);
    --sep-gold: rgba(var(--gold-rgb),.24);
    --ground: #5c6b52; --ground-busy: #6a6352; --ground-gov: #68614f; --ground-sel: #68765c;
    --res-farm: #9c934e; --res-forest: #50694f; --res-quarry: #8a8a82; --res-mine: #5a4a3a;
  }
  /* 浅色主题：柔化重投影 —— 深底上的 .5 黑影落到浅底会显得脏 */
  html[data-theme="silk"] .wood-frame,
  html[data-theme="bamboo"] .wood-frame,
  html[data-theme="silk"] .inner-panel,
  html[data-theme="bamboo"] .inner-panel,
  html[data-theme="silk"] .set-card,
  html[data-theme="bamboo"] .set-card,
  html[data-theme="silk"] #modal-root > *,
  html[data-theme="bamboo"] #modal-root > * {
    box-shadow: 0 4px 14px rgba(var(--sh-rgb),.20);
  }

  /* v39-A2 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  /* v74（老板需求 2）：「规定大界面像素，推动浏览器边框时，界面内容不要随之移动。
     作为一个整体界面」——大界面即**固定像素画布**：
       · 画布尺寸 = --app-w × --app-h（改尺寸只改这两个数，其余派生布局自动跟着走）；
       · 窗口更大 → 画布水平居中、垂直靠上（留边，不拉伸）；
       · 窗口更小 → 页面滚动，画布内部一格不重排（v27/v43 的视口断点已全部撤除）。
     原 `min-height: 100vh` 与 `overflow-x: hidden` 一并撤除 ——
     前者让 body 高度随窗口走；后者会把窄窗口下的画布右半边**裁掉**（够不着）。 */
  html { --app-w: 1440px; --app-h: 900px; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "SimSun", serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,162,75,.10), transparent 55%),
      linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    color: var(--text);
  }

  .hidden { display: none !important; }

  /* ============ 通用面板 ============ */
  .wood-frame {
    background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 10px 26px rgba(var(--sh-rgb),.5), inset 0 2px 3px rgba(var(--hl-rgb),.15);
  }
  .inner-panel {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: 7px;
    padding: 12px;
    box-shadow: inset 0 0 30px rgba(var(--sh-rgb),.45);
  }

  /* ============ 界面标题（v21 统一）============
     大界面 .gold-heading · 弹窗 .m-title · 地图 .map-title
     三处**同一规格**：16px / 800 / 金色 / 字距 1px。
     以前分别是 18px(字距4px) / 16px / 18px，同级别标题三种长相。 */
  .gold-heading {
    /* v82：字号/字重/字距/影由文末「标题外观共享」统一供给（同层级一处定义） */
    text-align: center;
    color: var(--gold-light);
    padding: var(--sp-1) 0 var(--sp-4);
    background:
      linear-gradient(90deg, transparent, var(--sep-gold), transparent);
  }

  /* v82（老板）：「城市名称居中，字体稍大即可」—— 官府面板的城名行
     （档位括注 / 「本城」标签 / 原名标注全撤，只留居中放大的城名）。 */
  .city-title { text-align: center; font-size: var(--fs-h2); font-weight: 800;
    color: var(--gold-light); letter-spacing: 1px; padding: 2px 0 4px; }
  .city-sub { display: flex; justify-content: center; align-items: center; gap: 8px;
    padding-bottom: 8px; }

  /* ============ 按钮 ============ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: var(--fs-lead);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, var(--teal-light), var(--teal));
    border: 1px solid #1c4539;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 #15332a, inset 0 1px 0 rgba(var(--hl-rgb),.25);
    transition: transform .1s, box-shadow .1s, filter .15s;
    text-shadow: 0 1px 2px rgba(var(--sh-rgb),.4);
    user-select: none;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #15332a; }
  .btn.red { background: linear-gradient(180deg, var(--red-light), var(--red)); border-color: #5c1a10; box-shadow: 0 3px 0 #4a150c, inset 0 1px 0 rgba(var(--hl-rgb),.25); }
  .btn.red:active { box-shadow: 0 1px 0 #4a150c; }
  .btn.gold { background: linear-gradient(180deg, var(--gold-light), var(--gold)); border-color: var(--gold-dark); color: var(--ink-on-gold); box-shadow: 0 3px 0 var(--gold-dark), inset 0 1px 0 rgba(var(--hl-rgb),.5); text-shadow: none; }
  .btn.gold:active { box-shadow: 0 1px 0 var(--gold-dark); }
  .btn.dim { background: linear-gradient(180deg, #5a5648, #454236); border-color: #2f2c23; color: var(--text-dim); cursor: not-allowed; }
  .btn.dim:hover { filter: none; }
  .btn.sm { padding: 5px 10px; font-size: var(--fs-sub); border-radius: 5px; }
  .btn.lg { padding: 12px 26px; font-size: var(--fs-h2); }

  /* ============ 顶部标签栏 ============ */
  .topnav {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    /* v43：菜单栏配色改为**跟随主题** —— 原来这里写死 #24272f→#1b1e25（墨蓝），
       换到素绢/青竹/夜阑主题时菜单栏还是深色，和整体脱节。 */
    background: linear-gradient(180deg, var(--surface-3), var(--bg-dark));
    border-bottom: 2px solid var(--gold-dark);
    flex-wrap: wrap;
  }
  .topnav .tab {
    padding: 6px 10px;
    font-size: var(--fs-body);
    font-weight: 700;
    color: var(--text-dim);
    /* v43：标签底色与描边同样改走主题变量（原为写死的暗黄褐 #333328→#23231a + #11110a）。
       取 --surface-2b（比 topnav 底更亮一档）保持"凸起标签"的立体感。 */
    background: linear-gradient(180deg, var(--surface-2b), var(--surface-3));
    border: 1px solid var(--slab-1);
    border-radius: 5px 5px 0 0;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06);
    position: relative;
    top: 2px;
    transition: color .15s;
  }
  .topnav .tab:hover { color: var(--gold-light); }
  /* v25（需求 10）：菜单图标（线描，跟随文字颜色） */
  /* v27（需求 7）：菜单图标调小 —— 15px 配上 13px 正文，图标反而比字更抢眼。
     降到 12px、透明度略降，只在 hover/选中的时候提亮，图标回到"陪衬"的位置。 */
  .topnav .tab .ti { display: inline-flex; align-items: center; margin-right: 4px; }
  .topnav .tab .nav-ico { width: 12px; height: 12px; display: block; opacity: .62; }
  .topnav .tab:hover .nav-ico, .topnav .tab.active .nav-ico { opacity: 1; }
  /* 菜单分组竖线（v19）：同类型相邻、不同类型分隔 */
  .topnav .nav-sep {
    width: 1px; height: 20px; margin: 0 6px; flex: none;
    background: linear-gradient(180deg, rgba(var(--sh-rgb),0), var(--gold-dark), rgba(var(--sh-rgb),0));
    opacity: .85;
  }

  /* 改建候选列表（v19 需求 8） */
  .xc-list { display: flex; flex-direction: column; gap: 8px; }
  .xc-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: rgba(var(--sh-rgb),.24); border: 1px solid var(--line); border-radius: 8px; }
  .xc-row .xc-ico { width: 38px; height: 38px; flex: none; }
  /* v37（需求 3）：同 .ia-art 的毛病 —— 只写 svg，位图匹配不到（装的是
     forItem/forExt 的图标，两者都会走位图）。统一改 .ico。 */
  .xc-row .xc-ico .ico { width: 38px; height: 38px; }
  .xc-row .xc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .xc-row .xc-info b { font-size: var(--fs-body); color: var(--parchment); }
  .xc-row .xc-prod { font-size: var(--fs-sub); color: var(--green-ok); }
  .xc-row .xc-cost { font-size: var(--fs-sub); color: var(--text-dim); }

  /* 公文页公告盒（v19：原公告牌内容并入公文） */
  .notice-box { border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px;
    background: rgba(var(--sh-rgb),.22); }
  .notice-box .nt-row { padding: 5px 0; border-bottom: 1px dashed rgba(201,162,75,.18); font-size: var(--fs-body); }
  .notice-box .nt-row:last-child { border-bottom: 0; }
  .notice-box .nt-row b { color: var(--parchment); }
  .notice-box .nt-amt { float: right; color: var(--gold-light); font-variant-numeric: tabular-nums; }
  /* v26（需求 3）：顶栏天时（不受菜单 hover/active 影响，只读） */
  .nav-sky {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 5px; white-space: nowrap;
    font-size: var(--fs-sub); font-weight: 700; letter-spacing: 1px;
    color: var(--gold-light); cursor: default;
    background: linear-gradient(180deg, rgba(201,162,75,.14), rgba(var(--sh-rgb),.2));
    border: 1px solid var(--line-strong);
  }
  .nav-sky .ns-k { color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  .topnav .tab.active {
    color: var(--gold-light);
    background: linear-gradient(180deg, var(--btn-face-1), var(--btn-face-2));
    border-color: var(--gold-dark);
    border-bottom-color: transparent;
    top: 2px;
    text-shadow: 0 0 8px rgba(201,162,75,.4);
  }
  .topnav .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--red);
    color: #fff;
    font-size: var(--fs-cap);
    padding: 1px 5px;
    border-radius: 8px;
    font-weight: 700;
  }

  /* ============ 主布局 ============
     真正的规则在下方「布局：基准 1180×820」一段（v27 收口到一处）。
     这里原先还有一份 `.main { grid-template-columns: 300px 1fr; align-items: start; }`，
     它与新规则叠在一起，于是新规则没写的「对齐方式：起首」一直生效 ——
     两栏因此不会一起拉伸，侧栏依然比中央短/长。已删除，只留一处定义。 */

  /* ============ 布局：基准 1180×820，随视口自适应（v27 · 需求 8/9）============
     改前有两处硬伤：
       ① 页面宽度被写死在 1024 —— 屏幕再大也只有 1024 宽，两侧白白留白；
       ② 中央视图写死 530px 高、侧栏却允许到 606px ——
          **侧栏被允许比中央高 76px**，"左侧统计栏比右边城池页面长"因此成为必然（需求 8）。
     现在：
       · 页面撑满视口，主区用 flex 吃掉剩余高度，两栏**同高**（同一行、一起拉伸）；
       · 中央滚动、侧栏也滚动，但侧栏内容已按 820 高度精简过，正常不出滚动条；
       · 棋盘尺寸由 JS 按实测容器计算（见 ui.fitBoard）。
     v43（老板要求「整体界面的像素值固定，不要因为浏览器边框变动」）：
       · 侧栏宽度原来写的是 clamp(272px, 24vw, 320px) —— **随视口宽度浮动**，
         窗口一改侧栏就变、中央区与棋盘跟着重算（这就是"像素值不固定"的根源）。
         改为**固定 283px**，与 JS 的 ui.SIDE_W 严格对齐（283 正是 1180 宽下的原取值）。
       · 两个可滚容器加 scrollbar-gutter: stable，滚动条出现/消失不再改变可用宽度。 */
  html, body { height: 100%; }
  /* v74：游戏画布 = 固定像素（见 --app-w / --app-h 注释）；水平居中、垂直靠上 */
  #screen-game { width: var(--app-w); height: var(--app-h); margin: 0 auto;
    display: flex; flex-direction: column; }
  .topnav { flex: none; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr;
    align-items: stretch;   /* 两栏一起拉伸到整行高 —— 这就是"侧栏与中央同高" */
    grid-template-columns: 283px 1fr; padding: 8px 10px; gap: 8px; }
  .central { display: flex; flex-direction: column; min-height: 0; }
  /* v43（老板要求）：**界面像素尺寸不因滚动条而变动**。
     这两个容器自身可滚，内容一长就冒出滚动条、可用宽度少十几像素，
     棋盘（按实测容器算尺寸）与两栏宽度跟着重排 —— 切个页面布局就跳一下。
     scrollbar-gutter: stable 让滚动条轨道**常驻预留**，有没有滚动条宽度都一样。 */
  html { scrollbar-gutter: stable; }
  .view-box { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
  .auth-side { min-height: 0; overflow-y: auto; scrollbar-gutter: stable;
    /* v76（老板）：「城池的左侧统计框没有到底」——左栏改 flex 列，
       最后一段（资源+驻军）拉伸到栏底：消灭底部留白、与右侧棋盘区底线一致；
       内容超长时照旧整体滚动。 */
    display: flex; flex-direction: column; }
  /* ⚠️ 左栏的"框"是那口**大卡**（.lord-card 里装着 君主头 + 城池属性段 + 资源段）——
     铺满链必须从 lord-card 起（作者第一版挂在 .auth-side > .side-block 上，
     选择器压根匹配不到，真机一量才发现驻军框纹丝不动）。 */
  .auth-side .lord-card { flex: 1 1 auto; display: flex; flex-direction: column; }
  .auth-side .lord-card > .side-block:last-child { flex: 1 1 auto; display: flex; flex-direction: column; }
  .auth-side .lord-card > .side-block:last-child .garrison-bar { flex: 1 1 auto; display: flex; flex-direction: column; }

  /* ============ 左侧：君主卡 ============ */
  .lord-card {
    background:
      linear-gradient(180deg, rgba(var(--sh-rgb),.3), rgba(var(--sh-rgb),.1)),
      var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    overflow: hidden;
  }
  .lord-head {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: linear-gradient(90deg, rgba(201,162,75,.22), transparent);
    border-bottom: 1px solid var(--sep-gold);
  }
  .lord-avatar {
    width: 64px; height: 64px;
    border: 2px solid var(--gold);
    border-radius: 6px;
    background: #2b2b20;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    flex-shrink: 0;
  }
  /* v81（老板）：信息表改 flex 伸缩 —— 原先 width:100% 与头像同抢宽度（名称列被挤成
     21px 竖条、头像压到 45px）；头像不吃收缩、信息表占满余量，名称并入首行。 */
  .lord-meta { flex: 1 1 0; min-width: 0; font-size: var(--fs-body); line-height: 1.7; }
  .lord-meta .name { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); }
  .lord-portrait {
    flex: 0 0 auto;
    width: 68px; height: 68px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--gold-dark); background: #0b0e12;
    box-shadow: inset 0 0 0 1px rgba(var(--sh-rgb),.6), 0 2px 8px rgba(var(--sh-rgb),.45);
  }
  .lord-portrait svg { display: block; width: 100%; height: 100%; }
  .lord-meta .row { display: flex; justify-content: space-between; }
  .lord-meta .row span:first-child { color: var(--text-dim); }
  /* 名称行（信息表首行）：金色标题；行高收紧，与其余行齐平 */
  .lord-meta .row.mrow-name { line-height: 1.4; }
  .lord-meta .row.mrow-name span:first-child { color: var(--gold-light); }

  /* ============ 侧栏三段式（君主/城池属性/资源）============ */
  .side-btnrow {
    display: flex; gap: 4px; padding: 6px 8px;
    background: rgba(var(--sh-rgb),.25); border-bottom: 1px solid var(--sep-gold);
  }
  .side-btnrow .sbtn {
    flex: 1; text-align: center; font-size: var(--fs-sub); font-weight: 700;
    color: var(--gold-light); padding: 5px 0; letter-spacing: 1px;
    background: linear-gradient(180deg,var(--btn-face-1),var(--btn-face-2));
    border: 1px solid var(--gold-dark); border-radius: 4px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06);
  }
  .side-btnrow .sbtn:hover { filter: brightness(1.25); }
  .side-block { border-bottom: 1px solid var(--sep-gold); }
  .side-title {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    color: var(--gold-light);
    background: linear-gradient(90deg, rgba(201,162,75,.18), transparent);
  }
  .side-quick { display: flex; gap: 6px; align-items: center; font-weight: 400; color: var(--text-dim); }
  .side-quick i { font-style: normal; cursor: pointer; opacity: .85; font-size: var(--fs-body); }
  .side-quick i:hover { opacity: 1; transform: scale(1.15); }
  /* v27（需求 1）：190px 会顶到滚动条（多城时还要塞一行切城芯片）；
     放宽到 232px，正常内容放得下 —— 侧栏整体高度由视口决定，不会再溢出。
     overflow 保留为兜底，不主动出现滚动条。 */
  .side-body { padding: 8px 10px; max-height: 232px; overflow-y: auto; }

  /* 资源行 "+" 快捷道具按钮 */
  .plus-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; margin-left: 5px; line-height: 1;
    background: linear-gradient(180deg,#e8c878,#9a7430); color: var(--ink-on-gold);
    border-radius: 3px; font-size: var(--fs-body); font-weight: 800; cursor: pointer;
    box-shadow: 0 1px 2px rgba(var(--sh-rgb),.4);
  }
  .plus-btn:hover { filter: brightness(1.15); }

  /* ============ 统计条目 ============ */
  .res-line { display: flex; align-items: center; justify-content: space-between; padding: 5px 4px; border-bottom: 1px dashed rgba(201,162,75,.2); font-size: var(--fs-lead); }
  .res-line .lbl { color: var(--text-dim); }
  .res-line .val { font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  /* 资源存量：整数千分位 + 小数（暗色小字）—— 让每秒的微小增长肉眼可见 */
  .res-line .val .num-frac { font-size: var(--fs-cap); font-weight: 400; color: var(--text-dim); letter-spacing: .3px; }
  /* 增速：按「/秒」显示，与画面刷新节奏一致 */
  .res-line .val .num-rate { font-size: var(--fs-cap); font-weight: 700; color: var(--green-ok); }
  .res-line .val .num-rate.zero { color: var(--text-dim); opacity: .55; }
  .res-line .val .item-badge { color: var(--gold-light); font-size: var(--fs-cap); font-weight: 700; }
  .res-line .val .cap { color: var(--text-dim); font-size: var(--fs-cap); font-weight: 400; }

  /* ============ 史册面板 ============ */
  .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .story-card {
    background: linear-gradient(180deg, rgba(var(--sh-rgb),.28), rgba(var(--sh-rgb),.12));
    border: 1px solid var(--gold-dark);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .sky-big { font-size: var(--fs-h1); font-weight: 800; color: var(--gold-light); text-align: center; letter-spacing: 1px; margin: 6px 0 4px; }
  .sky-sub { font-size: var(--fs-sub); color: var(--text-dim); text-align: center; line-height: 1.7; }
  .sky-boon { font-size: var(--fs-sub); color: var(--green-ok); text-align: center; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--sep-gold); }
  .goal-line { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-lead); margin: 6px 0; }
  .goal-line .good { color: var(--green-ok); font-weight: 700; }
  .prog { height: 9px; background: rgba(var(--sh-rgb),.45); border: 1px solid var(--gold-dark); border-radius: 5px; overflow: hidden; }
  .prog > i { display: block; height: 100%; background: linear-gradient(90deg, #9a7430, var(--gold-light)); transition: width .5s linear; }
  .hint { font-size: var(--fs-sub); color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .chron-list { max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .chron-item { display: flex; gap: 9px; padding: 7px 8px; border-left: 3px solid #6b5a2c; background: rgba(var(--sh-rgb),.16); border-radius: 0 5px 5px 0; margin-bottom: 5px; }
  .chron-item .chron-era { flex: 0 0 62px; font-size: var(--fs-sub); color: var(--gold); opacity: .9; }
  .chron-item .chron-txt { font-size: var(--fs-sub); line-height: 1.65; color: var(--text); }
  .chron-item.tag-milestone { border-left-color: var(--gold-light); }
  .chron-item.tag-era { border-left-color: var(--rank-ming); background: rgba(156,106,214,.10); }
  .chron-item.tag-encounter { border-left-color: var(--blue-info); background: rgba(63,169,201,.10); }
  .chron-item.tag-annual { border-left-color: #4a5a3a; opacity: .82; }
  /* ============ 客栈 / 市集 / 仓储 / 招贤馆 ============ */
  /* v75（老板）：候选改**单行紧凑**版式（「尽量单个将领一行显示」）。
     列表不再自带滚动 —— 整页滚动只留 .m-body 一处，避免旧版"列表 + 面板"双滚动条。 */
  .inn-list { padding-right: 4px; }
  .inn-card { display: flex; align-items: center; gap: 10px;
    background: rgba(var(--sh-rgb),.2); border: 1px solid var(--gold-dark); border-radius: 7px; }
  .inn-card.off { opacity: .55; }
  .inn-name { font-size: var(--fs-lead); font-weight: 700; color: var(--gold-light); white-space: nowrap; flex: none; }
  .inn-lv { color: var(--text-dim); font-size: var(--fs-cap); font-weight: 400; }
  .inn-attrs { font-size: var(--fs-sub); color: var(--text-dim); letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .inn-attrs b { color: var(--text); font-weight: 700; }
  .inn-act { display: flex; align-items: center; gap: 10px; flex: none; margin-left: auto; }
  .inn-cost { font-size: var(--fs-sub); color: var(--gold); white-space: nowrap; }
  .inn-cost.short { color: var(--red-light); }
  .tag-hero { font-size: var(--fs-cap); padding: 1px 5px; border-radius: 3px; background: var(--sep-gold); color: var(--gold-light); }
  /* v75（老板）：「美人灯标识去掉」—— .tag-beauty 整条退役（界面不再产出该标）。 */
  .note-warn { font-size: var(--fs-sub); color: var(--warn); background: rgba(230,164,0,.1); border: 1px solid rgba(230,164,0,.35);
    border-radius: 6px; padding: 7px 10px; margin-bottom: 8px; text-align: center; line-height: 1.6; }
  .mk-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 8px 0; }
  .mk-row select, .mk-row input { padding: 6px 8px; background: var(--slab-1); color: var(--text); border: 1px solid var(--gold-dark); border-radius: 4px; font-size: var(--fs-body); }
  .mk-row input { width: 120px; text-align: center; }
  .mk-arrow { color: var(--gold-light); font-weight: 700; }
  .mk-hint { font-size: var(--fs-sub); color: var(--text-dim); }
  .store-row { display: flex; align-items: center; padding: 7px 2px; border-bottom: 1px dashed rgba(201,162,75,.2); font-size: var(--fs-body); }
  .store-row .lbl { flex: 0 0 76px; color: var(--text-dim); }
  .store-row .val { flex: 0 0 auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .store-row .cap { color: var(--text-dim); font-size: var(--fs-cap); font-weight: 400; }
  /* ============ v12：子标签 / 任务卡 / 背包网格 / 会话日志 ============ */
  .panel-body { max-height: 558px; overflow-y: auto; margin: 0 -4px; }
  .panel-foot { text-align: center; margin-top: 14px; }
  .bag-cell.dim { opacity: .45; }
  .subtabs.hidden { display: none; }
  .topnav .tab .tab-badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px;
    margin-left: 5px; border-radius: 8px; background: #b8412f; color: #fff; font-size: var(--fs-cap); font-weight: 700;
    vertical-align: 1px; text-align: center; }
  .topnav .tab .tab-badge.hidden { display: none; }
  /* ============================================================
   * v41（需求 4）：公文有新战报 → 菜单**图标底色闪黄**，1.5 秒一轮
   * ------------------------------------------------------------
   * 做法：图标本身是 `stroke="currentColor"`，所以把底色的"亮"和
   * 图标的"暗"一起动 —— 只闪底色的话，暗色主题里浅色图标压在黄底上
   * 会糊成一团，反而看不清。
   * 只挂在图标上（不加 padding），避免菜单文字左右跳动。
   * ============================================================ */
  .topnav .tab.fresh .ti {
    border-radius: 5px;
    animation: docBlink 1.5s ease-in-out infinite;
  }
  @keyframes docBlink {
    0%, 42%   { background: var(--alert-gold); color: var(--alert-ink); box-shadow: 0 0 9px 2px rgba(255,216,77,.75); }
    58%, 100% { background: transparent; color: var(--text-dim); box-shadow: none; }
  }
  /* 降低动效的用户（系统偏好）保留静态黄底，不带闪烁 */
  @media (prefers-reduced-motion: reduce) {
    .topnav .tab.fresh .ti { animation: none; background: var(--alert-gold); color: var(--alert-ink); }
  }
  .subtabs { display: flex; gap: 4px; margin: 0 12px 6px; }
  .subtabs .sub { padding: 5px 18px; font-size: var(--fs-body); font-weight: 700; letter-spacing: 2px; cursor: pointer;
    color: var(--text-dim); background: rgba(var(--sh-rgb),.22); border: 1px solid var(--gold-dark); border-radius: 6px; }
  .subtabs .sub.active { color: var(--ink-on-gold); background: linear-gradient(180deg, var(--gold-light), var(--gold)); border-color: var(--gold-light); }

  /* 任务卡 */
  .q-sec { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; padding-bottom: 5px;
    border-bottom: 1px solid var(--sep-gold); }
  .q-sec-t { color: var(--gold-light); }   /* v82：字号/字重/字距走分区标题共享 */
  .q-sec-n { font-size: var(--fs-sub); color: var(--text-dim); }
  .q-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  /* ---- 任务清单（v25 · 需求 11）：只给名称与状态，详情进弹窗 ---- */
  .q-list { display: flex; flex-direction: column; gap: 5px; }
  .q-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line); border-radius: 7px;
    border-left: 3px solid rgba(var(--hl-rgb),.10); transition: background .12s, border-color .12s;
  }
  .q-row:hover { background: rgba(232,206,136,.07); border-color: rgba(232,206,136,.45); }
  .q-row.ready { border-left-color: var(--green-ok); }
  .q-row-n { font-size: var(--fs-lead); font-weight: 700; color: var(--gold-light); }
  .q-row-p { margin-left: auto; font-size: var(--fs-sub); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .q-row-p b { color: var(--green-ok); }
  /* v69（老板「右侧直接添加领取按钮」）：可领取行 —— 按钮推到最右，一步领取 */
  .q-sec-ready .q-sec-t { color: var(--green-ok); }
  .q-row-act { margin-left: auto; display: inline-flex; align-items: center; }
  /* 任务详情：固定版式 */
  .q-det-hero { display: flex; align-items: center; gap: 8px; padding-bottom: 10px;
    border-bottom: 1px solid var(--sep-gold); margin-bottom: 4px; }
  .q-det-title { color: var(--gold-light); }   /* v82：字号/字重走文末「标题外观共享」 */
  .q-det-sec { color: var(--gold-light); margin: 12px 0 5px; }   /* v82：字号/字重/字距走分区标题共享 */
  .q-det-sec::before { content: '◆'; font-size: var(--fs-cap); color: var(--gold); margin-right: 5px; }
  .q-det-txt { font-size: var(--fs-body); line-height: 1.85; color: var(--text); }
  .q-det-txt.good { color: var(--green-ok); font-weight: 700; }
  .q-det-prog { color: var(--text-dim); font-size: var(--fs-sub); }
  .q-det-tip { font-size: var(--fs-sub); color: var(--text-dim); margin-top: 6px; }
  /* v74：视口断点已撤（@media (max-width: 900px) .q-grid）——画布固定，不做窄窗重排 */
  .q-card { background: rgba(var(--sh-rgb),.24); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s; }
  .q-card.q-ready { border-color: rgba(232,206,136,.7); box-shadow: 0 0 12px rgba(232,206,136,.15); }
  .q-card.q-done { opacity: .55; }
  .q-head { display: flex; align-items: center; gap: 7px; }
  .q-title { font-size: var(--fs-lead); font-weight: 800; color: var(--gold-light); }
  .q-tag { font-size: var(--fs-cap); font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
  .q-tag.t-growth { color: var(--tag-growth); }
  .q-tag.t-military { color: var(--tag-military); }
  .q-tag.t-war { color: var(--tag-war); }
  .q-tag.t-build { color: var(--tag-build); }
  .q-tag.t-tech { color: var(--q3); }
  .q-tag.t-govern { color: var(--tag-govern); }
  .q-tag.t-talent { color: var(--rank-ming); }
  .q-tag.t-forge { color: var(--tag-forge); }
  .q-state { margin-left: auto; font-size: var(--fs-sub); font-weight: 700; color: var(--text-dim); }
  .q-card.q-ready .q-state { color: var(--green-ok); }
  .q-desc { font-size: var(--fs-sub); color: var(--text-dim); margin: 6px 0 0; line-height: 1.6; }
  .q-bar { height: 5px; margin: 8px 0 5px; background: rgba(var(--sh-rgb),.5); border-radius: 3px; overflow: hidden; }
  .q-bar i { display: block; height: 100%; background: linear-gradient(90deg, #6f8f3e, #c9d96a); border-radius: 3px;
    transition: width .4s ease; }
  .q-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .q-reward { font-size: var(--fs-sub); color: var(--gold-light); }
  .q-foot .btn { margin-left: auto; }
  .q-empty { text-align: center; color: var(--text-dim); font-size: var(--fs-sub); padding: 18px; }
  .q-done-box { background: rgba(var(--sh-rgb),.2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    max-height: 320px; overflow-y: auto; }
  .q-log-row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: var(--fs-sub);
    border-bottom: 1px dashed rgba(201,162,75,.16); }
  .q-log-t { color: var(--text); font-weight: 700; }
  .q-log-r { margin-left: auto; color: var(--gold-light); font-size: var(--fs-sub); }
  .q-log-r.dim { color: var(--text-dim); }

  /* 背包：每行 5 格 */
  /* v39（需求 6）：5 列 → 4 列。老板要"跟商城同步搞成 4 行"，
     一页 16 格正好 4 列 × 4 行（见 ui.BAG_PER_PAGE），格子也随加宽。
     v51：**固定 4 列**（同商城，见上面的说明）；原 1150 那档降级已删。 */
  .bag-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .bag-cell { position: relative; background: linear-gradient(180deg, var(--surface-2), var(--surface-3)); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; transition: transform .14s, border-color .14s, box-shadow .14s; }
  .bag-cell:hover { transform: translateY(-3px); border-color: rgba(232,206,136,.7);
    box-shadow: 0 8px 18px rgba(var(--sh-rgb),.5), 0 0 12px rgba(232,206,136,.2); }
  .bag-cell .bag-ico { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .bag-cell .bag-name { font-size: var(--fs-cap); font-weight: 700; color: var(--text-strong); text-align: center; line-height: 1.25; }
  .bag-cell .bag-cnt { position: absolute; right: 4px; top: 3px; font-size: var(--fs-cap); font-weight: 800; color: var(--gold-light);
    text-shadow: 0 1px 2px #000; }
  .bag-cell .bag-q { position: absolute; left: 4px; top: 3px; font-size: var(--fs-cap); font-weight: 800; }
  .bag-cell.q1 .bag-q { color: var(--q1); } .bag-cell.q2 .bag-q { color: var(--q2); }
  .bag-cell.q3 .bag-q { color: var(--q3); } .bag-cell.q4 .bag-q { color: var(--q4); }
  /* ============================================================
   * 悬停浮层（v37 · 需求 2）：**全站唯一一层**
   * ------------------------------------------------------------
   * 改前三套各写各的，都只在自己那一小块里绝对定位：
   *   · .bag-cell .bag-tip           居中于格子 → 边格越出面板；向上弹 → 首行越出可视区
   *   · .rate-wrap[data-tip]::after   CSS content
   *   · .help-chip[data-tip]::after   CSS content
   * 三套同病：**z-index 60**（会被更高的层压住）、**位置写死**（越界没人管）。
   * 改后：内容源留在原地但不再自己显示，显示统一交给 body 上的 .tip-layer
   * （position:fixed + z-index 9000），位置由 JS 算并四面夹进视口。
   * 一层、一套定位规则、一个层级 —— 不再有"某处浮层被压住/飞出屏幕"。
   * ============================================================ */
  /* ⚠ `tip-src` 是**所有内容源的通用标记**（ui.tipFor 就是按它取内容的）——
     少了这条，凡是带 tip-src 但没有单独类名的浮层（如人形装备栏的 .eq-slot-tip）
     会**直接把浮层正文渲染在卡片里**，把卡片撑高、布局全乱。 */
  .tip-src { display: none; }
  .bag-tip, .tcard-tip { display: none; }
  .tip-layer {
    position: fixed; left: 0; top: 0; z-index: 9000;
    min-width: 150px; max-width: 300px; padding: 8px 10px; border-radius: 7px;
    background: #12110c; border: 1px solid var(--gold-dark);
    box-shadow: 0 12px 28px rgba(var(--sh-rgb),.75);
    opacity: 0; visibility: hidden; transition: opacity .12s;
    pointer-events: none; text-align: left; white-space: pre-line;
  }
  .tip-layer.on { opacity: 1; visibility: visible; }
  .tip-layer .tip-t { font-size: var(--fs-sub); font-weight: 800; color: var(--gold-light); margin-bottom: 4px; }
  .tip-layer .tip-l { font-size: var(--fs-sub); color: var(--text-dim); line-height: 1.65; }
  .tip-layer .tip-a { font-size: var(--fs-sub); color: var(--green-ok); margin-top: 4px; line-height: 1.6; }
  .bag-sec { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--sep-gold); color: var(--gold-light); }
  .bag-sec .n { font-size: var(--fs-sub); font-weight: 400; color: var(--text-dim); }
  .mat-tag { display: inline-block; font-size: var(--fs-cap); padding: 1px 6px; border-radius: 4px;
    background: rgba(201,162,75,.14); color: var(--gold-light); border: 1px solid rgba(201,162,75,.35); margin-right: 3px; }
  .mat-tag.short { background: rgba(184,65,47,.18); color: var(--red-light); border-color: rgba(184,65,47,.5); }

  /* ============================================================
   * 地块（v20 重制：**正方形网格**）
   * ------------------------------------------------------------
   * 历史包袱：v16 用 2:1 菱形、v18 改用剪切平行四边形，两代都在
   * 「把建筑立牌挂到倾斜地块上」这条路上打转 —— 图标比格子高、
   * 靠 translateY 对齐，必然出现遮挡与错位。
   *
   * v20 直接放弃倾斜投影：地块就是**正方形**，元素盒与地块重合。
   *   格心 = 元素盒的 50%/50%，建筑图标居中即正对格心，几何上不可能错位。
   *   相邻格 x/y 各差 TILE_W/TILE_H，一行不对行内另一行，天然密铺且不重叠。
   *
   * 视觉依据（awesome-design-md / Linear 规范）：
   *   · 暗色界面**不要用投影表达层级** —— 改用背景亮度分层
   *   · 描边一律发丝级半透明白 rgba(var(--hl-rgb),.06~.10)，不用不透明深灰
   *   · 凹陷感用 inset 阴影（规范里的 Inset 层级）
   * ============================================================ */
  .city-iso { display: flex; justify-content: center; align-items: flex-start;
    padding: 6px 0 16px; overflow: auto; max-width: 100%; }
  .iso-board { position: relative; flex: none; }
  /* 显示比例控件 */
  .zoom-bar { display: flex; align-items: center; justify-content: center; gap: 5px;
    flex-wrap: wrap; margin: 2px 0 8px; }
  .zoom-bar .zb-label { color: var(--text-dim); font-size: var(--fs-sub); margin-right: 4px; }
  .zoom-bar .btn.sm { min-width: 50px; }

  /* ---- 地块：正方形 ---- */
  .iso-tile {
    position: absolute;
    cursor: pointer;
    z-index: 2;
    transition: z-index 0s;
  }
  /* ============================================================
   * 地块（v39 · 需求 3）
   * ------------------------------------------------------------
   * 老板原话：「目前色块颜色还带花纹，太费眼睛了，能不能把底部色块去掉的？」
   *
   * 旧实现每格都是一块独立小图：草绿渐变 + 一层 48° 草叶斜纹 + 描边 + 内凹。
   * 32 格并排 = 32 块带花纹的小色块，视觉噪声全在这里。
   *
   * 现在：
   *   · 底色改**纯色**（不能用渐变 —— 渐变按格计算，相邻格之间会出现
   *     色阶接缝，铺成一片地之后那圈缝比花纹还扎眼）；
   *   · 去掉 border / box-shadow / 圆角，相邻格同色自然连成**一整片地面**；
   *   · 空地不再填色，只在悬停时浮出一格极淡的提示；
   *   · 悬停只提亮、不描边（描边正是刚去掉的东西）。
   * ============================================================ */
  .tile-face {
    position: absolute; inset: 0;
    background: var(--ground);
    transition: background .14s, filter .14s;
  }
  /* 空地：不填色 —— 悬停才浮出一格淡色，提示"这里能点" */
  .iso-tile.empty .tile-face { background: transparent; }
  .iso-tile.empty:hover .tile-face { background: rgba(var(--hl-rgb),.07); }
  /* 施工中：土色工地（"正在动"的地方，要显眼） */
  .iso-tile.busy .tile-face { background: var(--ground-busy); }
  /* 官署格：台基色（4 格合并的宫殿台基由 .gov-palace 单独画） */
  .iso-tile.gov .tile-face { background: var(--ground-gov); }
  /* ---- 城外资源地（v39 · 需求 2）：老板点名的四种色系 ---- */
  .iso-tile.res-farm   .tile-face { background: var(--res-farm); }
  .iso-tile.res-forest .tile-face { background: var(--res-forest); }
  .iso-tile.res-quarry .tile-face { background: var(--res-quarry); }
  .iso-tile.res-mine   .tile-face { background: var(--res-mine); }
  /* 悬停：只提亮一格，不描边 */
  .iso-tile:hover .tile-face { filter: brightness(1.10); }
  .iso-tile:hover { z-index: 5; }
  /* 选中：用内描边（不占布局、也不给普通格加边框） */
  .iso-tile.sel .tile-face { box-shadow: inset 0 0 0 2px var(--gold-light); }
  /* ============================================================
   * v41（需求 1）→ v42（需求 1）：地块之间留**一道细缝**
   * ------------------------------------------------------------
   * 只缩 `.tile-face`（视觉层），不动 `.iso-tile` 的几何 ——
   * 拾取按格坐标算、不读 DOM，所以留缝不影响点选。
   * v42 两处调整：
   *   ① 缝从 2px 收到 **1px**（老板：不要离太宽，区分即可）；
   *   ② 从「只城外」改成**城内城外一视同仁** —— v41 时担心城内被切碎，
   *      1px 实测下来只相当于一圈极淡的格线，反而让 48 格看得清边界。
   * ============================================================ */
  .iso-board .tile-face { inset: 1px; border-radius: 2px; }

  /* ---- 建筑本体：**居中**在格内（不再上浮、不再投影） ---- */
  .tile-art {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 4;
    /* v25（需求 6）：原先留 15px 给标签、图标只占 58% —— 看着"小得可怜"。
       现在图标占满整格（标签条是绝对定位的浮层，本就压在图标下沿，
       不必为它预留布局空间），图标只比地块小一点点。 */
    padding: 3px 3px 8px;
    /* v39：建筑"长高"的落点 —— 实际缩放加在图标上（见 ser-* 规则），
       容器只做过渡，标签与进度条不受缩放影响。 */
    transition: transform .18s ease-out;
  }
  .tile-art .ico {
    width: 100%; height: 100%; display: block;
    filter: none;                      /* 暗色界面禁用投影 */
  }
  /* v35：位图图标（AI 生成透明 PNG）—— 保持比例不拉伸。
     位图自身即透明轮廓，因此不套承台（plate）也不套光晕（lightPass），
     直接以图标轮廓摆在地块上（老板明确要求）。 */
  img.ico-img { object-fit: contain; }

  /* ============================================================
   * 城内建筑按「系列」分色（v39 · 需求 2/3；v45 改为**素材固有色**）
   * ------------------------------------------------------------
   * ⚠️ 血泪教训（别再回退到 CSS 染色）：
   *   v39~v43 用 `hue-rotate + saturate` 给统一的暖金位图染色，老板连续三轮
   *   反馈"还是阴间"。逐族实机取样后拿到铁证 —— 七族渲染饱和度只有 10~21、
   *   色相全挤在 29~171° 的灰绿带里，等于一片灰绿。根因是**CSS 滤镜的数学性质**：
   *     · hue-rotate 是线性矩阵近似，对低饱和暖金位图误差极大（标称 180° 实测 147°）；
   *     · saturate() 是保亮度矩阵，输入越接近灰、输出越不变 —— 正好把彩图洗成灰。
   *   结论：**染色不能放在 CSS**。
   *
   * 现在的做法（v45）：色相/饱和度在**像素级 HSL** 里精确写入素材本身
   *   （脚本 `.workbuddy/tmp/recolor_buildings.py`；原图备份 `assets/icons/ui/_gold_backup/`）
   *     H → 直接置为系列目标色相（精确，无矩阵误差）
   *     S → 按比例放大到目标均值（保留"白墙低饱和 / 彩绘高饱和"的相对结构）
   *     L → **原样保留**，材质的明暗层次一点不丢
   *   CSS 只负责落地投影，一个字都不再染色。
   *   七族目标色：军事铁青 208° · 文教竹青 152° · 驿传赭黄 28° · 工商朱红 2°
   *              仓廪绛褐 340° · 民居麦黄 70° · 官署暖金 42°
   * `ser-<系列>` 类保留为**语义标记**（数据侧唯一来源 DATA.SERIES，供调试与
   * 后续按系列扩展），当前不再驱动颜色。
   * ============================================================ */
  .iso-tile.built .tile-art img.ico-img { filter: drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  /* 建筑"长高"：等级 → 缩放系数（`.tile-art` 上有 transition 承接动画）。
     ⚠️ 这条规则曾被一次"整段替换"误删 —— 因为它在注释块与 ser-* 规则**之间**，
     替换时的起止标记跨过了它。改这段 CSS 时务必确认它还在（smoke 有断言守着）。 */
  .iso-tile.built .tile-art img.ico-img,
  .iso-tile.built .tile-art svg.ico {
    transform: scale(var(--lvs, 1));
    transform-origin: 50% 86%;             /* 底部固定：向上"长高"而非整体放大 */
    transition: transform .18s ease-out;
  }
  /* ---- 城外资源：图标与地块同色系呼应（需求 2 点名的田黄/林青绿/石灰/矿棕黑）----
     v45：**只保留提亮**，去掉 `hue-rotate` / `saturate` —— 与城内建筑同一教训：
     矩阵式滤镜在低饱和图上不可靠（上一版采石场 `saturate(.16)` 直接被洗成纯灰，
     老板判定"阴间"）。资源图标本身就带正确固有色，CSS 只需把过暗的提亮即可。 */
  .iso-tile.res-farm   .tile-art img.ico-img { filter: brightness(1.16) drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  .iso-tile.res-forest .tile-art img.ico-img { filter: brightness(1.22) drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  .iso-tile.res-quarry .tile-art img.ico-img { filter: brightness(1.20) contrast(1.05) drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  .iso-tile.res-mine   .tile-art img.ico-img { filter: brightness(1.24) drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  .tile-art img.ico-img { filter: drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  /* 建筑脚下的暖光池：让图标"落在"格子上，而不是贴上去（需求 7 的美术层） */
  .iso-tile.built .tile-art::before,
  .iso-tile.busy .tile-art::before {
    content: ''; position: absolute; left: 16%; right: 16%; bottom: 14%; height: 26%;
    border-radius: 50%;
    background: radial-gradient(50% 46% at 50% 62%, rgba(24,40,6,.30), rgba(24,40,6,0) 72%);
    pointer-events: none;
  }
  .iso-tile.empty .tile-art { padding-bottom: 0; }
  .iso-tile.empty .tile-art .ico { opacity: .38; width: 34%; height: 34%; }
  /* 格内标签：名字 + 等级**同一行**（需求 1） */
  .tile-label {
    position: absolute; left: 5px; right: 5px; bottom: 4px;
    display: flex; align-items: baseline; justify-content: center; gap: 4px;
    padding: 1px 0; border-radius: 5px;
    background: rgba(30,20,6,.52);
    font-size: var(--fs-cap); font-weight: 700; line-height: 1.5;
    white-space: nowrap; overflow: hidden;
  }
  .tile-label .nm { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .tile-label .lv {
    flex: none; font-size: var(--fs-cap); font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--gold-light);
  }
  .tile-label .lv.max { color: var(--green-ok); }
  .iso-tile.empty .tile-label { display: none; }
  /* 施工中：图标 + 居中进度 */
  .tile-scaf { font-size: 26px; color: var(--gold-light); line-height: 1; }
  .tile-pct {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: var(--fs-lead); font-weight: 700; color: var(--green-ok);
    text-shadow: 0 1px 3px rgba(var(--sh-rgb),.85);
  }
  .tile-pbar {
    position: absolute; left: 12%; right: 12%; bottom: 22px; height: 4px;
    border-radius: 2px; background: rgba(var(--sh-rgb),.55); overflow: hidden;
  }
  .tile-pbar i { display: block; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #7ee08a, #4fbf6a); transition: width .4s linear; }
  .tile-add { font-size: 22px; color: rgba(48,76,14,.66); line-height: 1; }

  /* ---- 城墙（v25 · 需求 1）：围着棋盘一圈的**环**，与地块留出空隙 ----
     墙上画的是城墙该有的东西（墙身 / 雉堞 / 压顶 / 四角角楼），
     不再有任何文字标签 —— 需要操作时点这圈墙。 */
  .iso-wall { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
  .iso-wall .wtower { transition: filter .15s; }
  /* 点击热区：四条带只覆盖墙环，绝不侵入棋盘（不会抢地块的点击） */
  .wall-hit { position: absolute; cursor: pointer; z-index: 6; border-radius: 3px; transition: background .15s; }
  .wall-hit:hover { background: rgba(232,206,136,.10); }
  /* 悬停墙体时给整圈墙一点提亮反馈（角楼是墙的"提手"） */
  .iso-board:has(.wall-hit:hover) .iso-wall { filter: brightness(1.14); }

  /* ============ 商城（v18：分类 + 固定网格 + 分页）============ */
  .shop-cats { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  .shop-cats .shop-cat {
    cursor: pointer; font-size: var(--fs-sub); color: var(--text-dim);
    padding: 3px 10px; border-radius: 12px; border: 1px solid var(--line-strong);
    background: rgba(var(--sh-rgb),.22); white-space: nowrap;
  }
  .shop-cats .shop-cat i { font-style: normal; opacity: .55; margin-left: 3px; font-size: var(--fs-cap); }
  .shop-cats .shop-cat:hover { color: var(--text); border-color: var(--gold-dark); }
  .shop-cats .shop-cat.on { color: var(--gold-light); background: rgba(201,162,75,.16); border-color: var(--gold); }
  /* ============================================================
   * 物品行（v29 · 需求 14）：左贴图 · 右介绍 · 下方 数量 + 操作
   * ------------------------------------------------------------
   * 改前商城是"竖卡 + 一颗按钮"：一件物品要横着读三行小字；
   * 背包更只有一枚小格子，说明全靠悬停浮层（平板没有 hover 就抓瞎）。
   * 现在文字直接铺在右边、数量与操作固定在下沿，扫一眼就能做决定。
   * ============================================================ */
  /* v39（需求 5）：老板要「统一整成 4 列」，原先两列右侧空一大片。
     4 列是"整行不截断"的选择：一页 16 个正好 4 行（见 ui.SHOP_PER_PAGE）。
     v51：**固定 4 列**（老板：「商城和背包的宝物物品整 4 列」）。
     原先有 1500 / 1150 / 760 三档降级断点 —— 老板的屏在 1366~1440，
     正好落进 ≤1500 那一档，所以他看到的其实是 **3 列**。
     降级看似"自适应"，实际是**同一份列表在不同窗口下长得不一样**，
     跟本项目「界面像素尺寸必须固定」的约定也冲突。列数写死，窗口小就格子窄。 */
  .shop-rows { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .item-row {
    display: grid; grid-template-columns: 64px minmax(0, 1fr);
    grid-template-rows: auto auto; gap: 4px 9px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-lg);
    background: linear-gradient(180deg, rgba(var(--sh-rgb),.26), rgba(var(--sh-rgb),.14));
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.05);
  }
  .item-row:hover { border-color: rgba(232,206,136,.4); }
  .item-row .ir-art { grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; }
  .item-row .ir-info { min-width: 0; }
  .item-row .ir-name { font-size: var(--fs-lead); font-weight: 700; color: var(--text-strong);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item-row .ir-tag { font-size: var(--fs-cap); font-weight: 400; color: var(--gold-light);
    border: 1px solid var(--gold-dark); border-radius: 3px; padding: 0 5px; }
  .item-row .ir-tag.set { color: var(--q3); border-color: var(--q3); }
  .item-row .ir-meta { font-size: var(--fs-cap); color: var(--text-dim); margin-top: 3px; line-height: 1.5; }
  .item-row .ir-meta b { color: var(--gold-light); }
  .item-row .ir-desc { font-size: var(--fs-sub); margin-top: 4px; line-height: 1.5; color: var(--text-dim); }
  .item-row .ir-foot { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
  .item-row .ir-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
  .item-row .ir-right { display: flex; gap: 6px; }
  .item-row .ir-total { color: var(--gold-light); font-weight: 700; font-size: var(--fs-sub);
    font-variant-numeric: tabular-nums; }
  .item-row .ir-desc .lack, .item-row .lack { color: var(--red-light); }

  /* 数量输入框（带加减号） */
  .qty-input { display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--gold-dark); border-radius: 5px; overflow: hidden; background: var(--slab-1); }
  .qty-input .qi-btn {
    background: linear-gradient(180deg, var(--btn-face-1), var(--btn-face-2)); color: var(--gold-light);
    border: none; cursor: pointer; font-size: var(--fs-body); font-weight: 700;
    width: 26px; height: 28px; line-height: 1;
  }
  .qty-input .qi-btn:hover { background: linear-gradient(180deg, var(--btn-hi-1), var(--btn-hi-2)); }
  .qty-input .qi-btn.max { width: auto; padding: 0 8px; font-size: var(--fs-cap); }
  .qty-input input {
    width: 66px; height: 28px; border: none; border-left: 1px solid var(--line-strong);
    border-right: 1px solid var(--line-strong);
    background: var(--bg-3); color: var(--text); text-align: center;
    font-size: var(--fs-sub); font-variant-numeric: tabular-nums;
  }
  .qty-input input:focus { outline: 1px solid var(--gold); }

  /* 物品贴图承台：品阶底纹 + 内高光 + 品阶珠 */
  .ia { position: relative; display: block; width: 68px; height: 68px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: linear-gradient(180deg, var(--surface-2c), #1a1d24);
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.08), 0 3px 8px rgba(var(--sh-rgb),.45);
    overflow: hidden; }
  /* v82：同名两条规则合并（描边 + 底色各归一处） */
  .ia.q1 { border-color: var(--q1); background: linear-gradient(180deg, rgba(154,154,140,.16), #1a1d24); }
  .ia.q2 { border-color: var(--q2); background: linear-gradient(180deg, rgba(90,160,110,.20), #1a1d24); }
  .ia.q3 { border-color: var(--q3); background: linear-gradient(180deg, rgba(74,140,200,.22), #1a1d24); }
  .ia.q4 { border-color: var(--q4); background: linear-gradient(180deg, rgba(190,140,60,.26), #1a1d24); }
  .ia .ia-art { position: absolute; inset: 6px; display: flex; align-items: center; justify-content: center; }
  /* v37 修复（需求 3）：这里原先写的是 `svg` —— 全站其它 5 个图标容器
     （.tile-art/.bag-ico/.eq-ico/.ticon/.rico）都写 `.ico`，只有这一处写标签名。
     位图接管后 <img> 匹配不到规则 → 回退到**固有尺寸 1024px**，
     被 .ia 的 overflow:hidden 裁到只剩中心一小块 —— 商城/宝物行的图标"大小不匹配"。
     教训：图标容器一律用 `.ico` 类选择器，永远不要写标签名。 */
  .ia .ia-art .ico { width: 100%; height: 100%; }
  .ia .ia-gem { position: absolute; right: 4px; bottom: 4px; display: flex; gap: 2px; }
  .ia .ia-gem i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 3px rgba(var(--sh-rgb),.8); }


  /* ============ 出征三方式（v13） ============ */
  .exp-info { text-align: center; font-size: var(--fs-body); color: var(--text-dim); margin-bottom: 10px; }
  .exp-info b { color: var(--gold-light); font-size: var(--fs-lead); }
  .exp-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .exp-mode { background: linear-gradient(180deg, var(--surface-2), var(--surface-3)); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 6px; text-align: center; cursor: pointer; transition: transform .14s, border-color .14s, box-shadow .14s;
    display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .exp-mode:hover { transform: translateY(-2px); border-color: rgba(232,206,136,.6); }
  .exp-mode.on { border-color: var(--gold); box-shadow: 0 0 12px rgba(232,206,136,.3);
    background: linear-gradient(180deg, #3d3826, #26231a); }
  .exp-mode .em-ico { font-size: 20px; line-height: 1.1; }
  .exp-mode .em-name { font-size: var(--fs-body); font-weight: 800; color: var(--gold-light); letter-spacing: 1px; }
  .exp-mode .em-cost { font-size: var(--fs-cap); color: var(--text-dim); }
  /* v63：不可用的出征方式（野外城池的「掠夺」每日每处限一次）——
     变灰、不再抬手、说明写在 em-cost 一行里。 */
  .exp-mode.locked { opacity: .45; cursor: not-allowed; }
  .exp-mode.locked:hover { transform: none; border-color: var(--line); }
  .exp-mode.locked .em-cost { color: var(--red-light); }
  .exp-body { max-height: 360px; overflow-y: auto; padding-right: 4px; }

  /* ============================================================
   * 将领人形装备栏（v38 · 需求 2）
   * ------------------------------------------------------------
   * 改前是 4 列 12 格平铺卡片 —— 能换装但看不出"哪件穿在哪"。
   * 改后：左边一个人形，12 个部位按身体位置贴上去；右边属性与套装进度。
   * 槽位落点由 ui.DOLL_POS 给（JS 里一张表），CSS 只负责"怎么画那一格"。
   * ============================================================ */
  /* v60（需求 1）：`.eq-sum` 已删 —— 那行「统2751.5 勇2690.5…」是**带装总数**，
     与左栏「状态」区的总体/攻击/防御重复；老板要求"装备提供的属性分行显示"，
     所以留下的是 .eq-grow（见下）。 */
  .eq-doll-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: var(--sp-5); align-items: start; }
  /* 人形框尺寸：300×380。
     高度不是随便定的 —— 右栏 = 人形框 + 属性 + 套装 + 按钮，这里是唯一能压的项；
     400px 会把档案顶到 840px、整页溢出 16px（多出一条页面滚动条）。
     min-width 是**方槽不重叠的硬下限**：5 行 × 54px = 270px 高，
     而框高 = 宽 × 19/15，所以宽度低于 230px 时行间距会被压到负数（实测 1024 视口下
     框只有 167×212 → 19 对方槽重叠）。宁可让人形框顶出格子，也不能让方槽叠一起。
     ⚠️ 高度变则 DOLL_POS 的百分比全部要重排（详见 js/ui.js 里那张表）。 */
  .doll { position: relative; width: 100%; max-width: 300px; min-width: 230px;
    margin: 0 auto; aspect-ratio: 15 / 19;
    /* v46（需求 3）：人形框有了自己的底 —— 放大的将领抠图要有个"画框"才不像浮在空中。
       层级：抠图（1）→ 人体剪影（2）→ 12 个方形槽位（3）。 */
    background: radial-gradient(ellipse at 50% 26%, rgba(var(--hl-rgb),.06), transparent 70%), rgba(var(--sh-rgb),.24);
    border: 1px solid var(--line); border-radius: var(--r-xl); }
  /* v46（需求 3）：大号将领抠图，**浅色**显示（低透明 + 下缘渐隐，不许用滤镜染色） */
  .doll-portrait { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 1;
    display: flex; align-items: flex-start; justify-content: center; pointer-events: none; }
  .doll-portrait img, .doll-portrait svg { width: 100%; height: auto; display: block;
    opacity: .32; border-radius: 0; }
  /* 下缘渐隐 —— 半身像直接切断会像"贴上去的"，渐隐后才像底纹 */
  .doll-portrait { -webkit-mask-image: linear-gradient(180deg, #000 46%, rgba(0,0,0,.35) 72%, transparent 96%);
    mask-image: linear-gradient(180deg, #000 46%, rgba(0,0,0,.35) 72%, transparent 96%); }
  .doll-fig-svg { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 46%; height: 100%; z-index: 2; opacity: .62; }
  .doll-side { min-width: 0; }
  /* ---- 槽位基础样式（v13 起沿用，v38 漏过一次，务必保留）----
     `.eq-ico .ico { width/height:100% }` 尤其关键：少了它，位图会按**固有尺寸
     1024px** 渲染并把槽位撑到上千像素高（v38 实测 1090px）。 */
  .eq-cell { position: relative; background: linear-gradient(180deg, var(--surface-2), var(--surface-3)); border: 1px solid var(--line);
    border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; transition: transform .14s, border-color .14s; }
  .eq-cell:hover { transform: translateY(-2px); border-color: rgba(232,206,136,.7); }
  .eq-cell.empty { opacity: .7; }
  .eq-cell.q2 { border-color: rgba(95,191,106,.45); }
  .eq-cell.q3 { border-color: rgba(90,160,216,.5); }
  .eq-cell.q4 { border-color: rgba(216,168,60,.6); box-shadow: 0 0 10px rgba(216,168,60,.18); }
  .eq-ico { display: flex; align-items: center; justify-content: center; }
  .eq-ico .ico { width: 100%; height: 100%; }
  .eq-name { font-weight: 700; color: var(--text-strong); text-align: center; line-height: 1.2; }
  .eq-name.none { color: var(--text-dim); font-weight: 400; }
  .eq-slotname { color: var(--text-dim); }
  /* v46（需求 3）：槽位改**正方形**（60px 宽 → 54×54），比原来小一圈。
     边长是算出来的：2×(边框 1 + 内边距 2) + 部位名 11 + 间隙 1 + 图标 22 + 间隙 1 + 装备名 11.6 ≈ 50.6，
     取 54 留 3px 余量。改这串里任何一个数（字号 / 图标 / 内边距）都要回来核对总高 ——
     槽位装不下会**静默变形**（flex 项被压缩到 0 高，不是报错，是看不见）。
     注意选择器必须写成 `.doll-slot.eq-cell`：后面有一条共享卡片几何
     `.q-card, .item-row, .eq-cell, … { padding: var(--sp-4) 即 10px; border-radius: var(--r-lg) }`，
     它与 `.doll-slot` **同权重 (0,1,0) 且更靠后** —— 只写 `.doll-slot` 时 padding 会被盖成 10px，
     槽内三行只剩 32px 可用（实测 clientH 52 / scrollH 57，装备名被压成 0 高）。
     `.eq-inv` 角标同理：全站只有一条 `right/bottom` 规则却从来没有 `position: absolute`，
     于是它一直当作普通流内元素占掉一整行（实测给 chest 多撑出 18px）。 */
  .doll-slot.eq-cell { padding: 2px; border-radius: var(--r-md); }
  .doll-slot { position: absolute; width: 54px; height: 54px; margin-left: -27px;
    min-height: 0; gap: 1px; z-index: 3; }
  /* ⚠ 这里**不能**加 overflow: hidden —— 背包存货角标（.eq-inv，right/bottom −3px）
     本来就设计成压在边框外，裁了就看不出"这件还有几件可换"。 */
  .doll-slot .eq-ico { width: 22px; height: 22px; margin-top: 0; }
  .doll-slot .eq-slotname { position: static; font-size: var(--fs-cap); line-height: 1; letter-spacing: 0; }
  /* 字号一律走令牌（七档），不写裸像素 —— 槽位窄，用最小档 + 省略号 */
  .doll-slot .eq-name { font-size: var(--fs-cap); line-height: 1.05; max-width: 100%; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .doll-slot.empty { background: rgba(20,22,28,.55); border-style: dashed; border-color: rgba(232,206,136,.30); }
  .doll-slot.empty .eq-ico { opacity: .34; }
  .doll-slot:hover { z-index: 3; }
  /* v46 修正：这里以前只有 right/bottom，**没有 position: absolute** ——
     角标于是当普通元素参与流内布局，每多一件背包存货就多占 18px 把槽位撑破。
     实测：给 chest 撑到 scrollH 75（clientH 52）。 */
  .doll-slot .eq-inv { position: absolute; right: -3px; bottom: -3px; line-height: 1.5;
    font-size: var(--fs-cap); padding: 0 3px; border-radius: 6px;
    background: rgba(201,162,75,.22); border: 1px solid rgba(201,162,75,.45); opacity: 1; }
  .eq-gain { text-align: center; font-size: var(--fs-cap); color: var(--text-dim); margin-bottom: 8px; }
  .eq-gain i { font-style: normal; color: var(--green-ok); margin: 0 3px; }
  .eq-gain .none { opacity: .7; }
  /* v60（需求 2）：装备提供的属性**逐行**显示（统帅 +775.5 / 勇武 +752.5 …）
     —— 老板原话「右侧把装备提供的属性分行显示即可」。
     数值一律右对齐，好一眼比出"哪一项是这件装备给的大头"。 */
  .eq-grows { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .eq-grow { display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-cap); padding: 1px 6px; border-radius: 4px; background: var(--slab-1); }
  .eq-grow .k { color: var(--text-dim); }
  .eq-grow .v { color: var(--green-ok); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 套装进度 */
  .doll-set { border-top: 1px solid var(--sep-gold); padding-top: 8px; }
  .ds-empty { font-size: var(--fs-sub); color: var(--text-dim); }
  .ds-empty b { color: var(--gold-light); }
  .ds-block { margin-bottom: 9px; }
  .ds-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 3px; }
  .ds-name { font-size: var(--fs-body); font-weight: 800; color: var(--hero-tag); }
  .ds-n { font-size: var(--fs-cap); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .ds-next { font-size: var(--fs-cap); color: var(--amber); margin-left: auto; }
  .ds-next.done { color: var(--green-ok); }
  .ds-tiers { display: flex; flex-direction: column; gap: 2px; }
  .ds-tiers i { font-style: normal; font-size: var(--fs-cap); color: var(--text-dim); line-height: 1.55; opacity: .62; }
  .ds-tiers i b { color: inherit; font-weight: 700; margin-right: 5px; }
  .ds-tiers i.on { color: var(--green-ok); opacity: 1; }
  /* v52：`.ds-list` / `.ds-chip` 随「其余套装」那段备注一起删（老板不要它）。
     删渲染必须带走样式，否则就是"样式还在、结构早没了"的死样式。 */
  /* v74：视口断点已撤（@media (max-width: 820px) .eq-doll-wrap） */

  /* ---- 打造界面筛选条（v38 · 需求 3/4）---- */
  /* v51：铁匠铺打造列表**独立列数（3 列）**，不再复用 `.shop-rows`。
     理由：那是"整页视图"的 4 列（内容宽 1000+，每格 317~375px）；
     打造面板是**弹窗**（内容宽 ~922px），4 列会把每格压到 198px，
     卡片的部位/造价/材料三行全部折行 → 卡片反被撑到 265px 高，越挤越高。
     3 列 → 每格约 300px，接近商城整页的舒适宽度，卡片更矮，一屏反而放得下更多。 */
  .forge-rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .forge-filter { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: 4px; }
  .forge-filter .ff-k { font-size: var(--fs-cap); color: var(--text-dim); letter-spacing: 1px; }
  .forge-filter .shop-cats { margin: 0; }
  .forge-set-note { margin-top: 12px; padding: 9px 11px; border-radius: var(--r-lg);
    background: rgba(var(--sh-rgb),.24); border: 1px solid var(--line); }
  .fsn-t { color: var(--gold-light); margin-bottom: 6px; }   /* v82：字号/字重走分区标题共享 */
  .fsn-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .fsn-name { font-size: var(--fs-sub); font-weight: 700; color: var(--hero-tag); min-width: 62px; }
  .fsn-n { font-size: var(--fs-cap); color: var(--text-dim); }
  .fsn-tiers { font-size: var(--fs-cap); color: var(--text-dim); line-height: 1.6; }
  .fsn-tiers i { font-style: normal; margin-right: 9px; }
  .fsn-tiers i::before { content: '·'; margin-right: 4px; color: var(--gold-dark); }

  /* ============ 背包（v13 分类 / 排序 / 拆解） ============ */
  .bag-sortbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 10px; margin-bottom: 8px; background: rgba(var(--sh-rgb),.24);
    border: 1px solid var(--gold-dark); border-radius: 7px; }
  .bag-sortbar .lb { font-size: var(--fs-sub); color: var(--text-dim); margin-right: 2px; }
  .bag-sortbar .chip { font-size: var(--fs-sub); padding: 3px 11px; border-radius: 11px; cursor: pointer;
    color: var(--text-dim); background: rgba(var(--sh-rgb),.3); border: 1px solid var(--sep-gold);
    transition: all .14s; }
  .bag-sortbar .chip:hover { color: var(--gold-light); border-color: rgba(232,206,136,.6); }
  .bag-sortbar .chip.on { color: var(--ink-on-gold); background: linear-gradient(180deg, #e8ce88, #c9a24b);
    border-color: var(--gold-light); font-weight: 700; }
  .bag-sortbar .bag-total { margin-left: auto; font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700; }
  /* v29（需求 4）：背包内容交给 .view-box 统一滚动 ——
     旧版在这里又套了一层 52vh 的内部滚动条，翻页条还被推到内容最末尾，
     于是"背包得先滚到底才能翻页"。现在翻页条已移到屏幕下方固定条，
     内容区只需要一层滚动，也就不会再出现双滚动条。 */
  .bag-body { padding-right: 4px; }
  /* v39（需求 6）：图标 44 → 68px，与商城的 64px 靠拢；格子加宽后撑得住 */
  .bag-cell .bag-ico { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
  .bag-cell .bag-ico .ico { width: 100%; height: 100%; }
  .bag-cell .bag-worn { position: absolute; left: 4px; bottom: 3px; min-width: 15px; height: 15px; line-height: 15px;
    text-align: center; border-radius: 8px; background: rgba(95,191,106,.85); color: var(--ink-on-gold);
    font-size: var(--fs-cap); font-weight: 800; padding: 0 3px; }
  .pick-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 6px 0 4px; }
  .pick-row .btn.sm { font-size: var(--fs-sub); padding: 5px 10px; }

  /* 会话日志（保留至本次退出，可滚动） */
  .bb-log { flex: 1; min-width: 0; max-height: 76px; overflow-y: auto; font-size: var(--fs-sub); line-height: 1.75;
    padding-right: 6px; scrollbar-width: thin; }
  .bb-log .bb-line { white-space: pre-wrap; word-break: break-all; }
  .bb-log .bb-line.war { color: var(--red-light); }
  .bb-log .bb-line.task { color: var(--tag-govern); }
  .bb-log::-webkit-scrollbar { width: 7px; }
  .bb-log::-webkit-scrollbar-thumb { background: rgba(201,162,75,.35); border-radius: 4px; }
  .bb-log::-webkit-scrollbar-track { background: rgba(var(--sh-rgb),.25); }

  /* ============ 将领资质徽章 / 打造 ============ */
  .rank-badge { display: inline-block; font-size: var(--fs-cap); font-weight: 700; padding: 1px 6px; border-radius: 4px;
    border: 1px solid currentColor; opacity: .95; letter-spacing: .3px; white-space: nowrap; }
  .rank-badge.r-fan    { color: var(--rank-fan); background: rgba(156,156,140,.12); }
  .rank-badge.r-liang  { color: var(--rank-liang); background: rgba(95,191,106,.13); }
  .rank-badge.r-ying   { color: var(--rank-ying); background: rgba(74,155,224,.14); }
  .rank-badge.r-ming   { color: var(--rank-ming); background: rgba(176,111,216,.15); box-shadow: 0 0 8px rgba(176,111,216,.25); }
  .rank-badge.r-tian   { color: var(--amber); background: rgba(224,168,60,.16); box-shadow: 0 0 10px rgba(224,168,60,.35);
    animation: rankPulse 2.4s ease-in-out infinite; }
  @keyframes rankPulse { 0%,100% { box-shadow: 0 0 8px rgba(224,168,60,.25); } 50% { box-shadow: 0 0 16px rgba(224,168,60,.6); } }
  /* v75（老板）：「地下的各资质四维，成长和概率也不显示」——
     资质一览（.rk-box / .rk-row）随 rankTable 一并退役。 */
  .forge-q { font-size: var(--fs-h3); font-weight: 700; color: var(--gold-light); margin: 10px 0 5px; padding-bottom: 3px;
    border-bottom: 1px dashed var(--sep-gold); }
  /* 野地资源合计 */
  .wild-total { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-top: 10px; padding: 8px 10px; background: rgba(var(--sh-rgb),.22); border: 1px solid var(--gold-dark); border-radius: 6px; }
  .wild-res { font-size: var(--fs-body); color: var(--text-dim); }
  .wild-res b { color: var(--green-ok); font-weight: 700; }
  /* v74：视口断点已撤（@media (max-width: 900px) .story-grid） */

  /* ============ 中央视图 ============ */
  .view-box {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    /* v19：高度由上方「固定界面尺寸」规则统一给出（含小屏降档）。
       此处**不得**再设 min-height —— 否则小屏降档到 436px 会被 560px 顶回去，
       「固定尺寸」失效、整页又开始忽长忽短。 */
    min-height: 0;
    position: relative;
    box-shadow: inset 0 0 40px rgba(var(--sh-rgb),.5);
  }

  /* ============ 城内建设 grid ============ */
  .city-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    padding: 20px;
  }
  /* v20：旧 .build-cell 方块样式已删除（该标记自 v16 起不再渲染） */
  /* 资源小图标（侧栏/资源行） */
  .rico { display: inline-block; width: 17px; height: 17px; vertical-align: -3px; margin-right: 2px; }
  .rico .ico { width: 17px; height: 17px; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  /* 兵种卡图标 */
  /* v37（需求 1）：成本行移到悬停后，图标从 52px 放大到 84px */
  .troop-card .ticon .ico { width: 100%; height: 100%; max-width: 84px; max-height: 84px; }
  .build-cell .pbar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #7bc96f, #e8c878);
    transition: width .5s linear;
  }

  /* ============ 地图 canvas 容器 ============ */
  /* ---- 地图（v24 · 需求 2/3）：版面只留棋盘，导航与坐标收进右下角浮标 ---- */
  /* v26（需求 4）：观察框改 12×8，画布变矮，浮标让位也随之收窄 */
  /* v76（老板）：导航迁入底部条后，这里不再需要为右下浮标让位（78px 撤） */
  .map-wrap { position: relative; padding: var(--sp-5); }
  /* v76（老板）：「把地图的导航栏（上下左右，坐标之类）放到这个导航范围内」——
     地图导航迁入**底部固定导航条**（.bottombar，由 ui.mapHTML 登记、paintBottom 落画），
     改为静态排布、融入条内（条高 46px，v44 的"一行"布局原样保留）。
     历史：v24 收进右下浮标 → v45 浮标内水平居中 → v76 移入底部条。 */
  .map-dock {
    display: flex; align-items: center; gap: 8px; padding: 2px 4px;
    max-width: 100%;
  }
  .map-pad { display: grid; grid-template-columns: repeat(4, 28px); grid-template-rows: 26px; gap: 3px; }
  .map-btn { background: linear-gradient(180deg,var(--btn-face-1),var(--btn-face-2)); color: var(--gold-light); border: 1px solid var(--gold-dark);
    border-radius: 6px; cursor: pointer; font-size: var(--fs-body); font-weight: 700; line-height: 1;
    box-shadow: 0 2px 4px rgba(var(--sh-rgb),.4), inset 0 1px 0 rgba(var(--hl-rgb),.1); }
  .map-btn:hover { background: linear-gradient(180deg,var(--btn-hi-1),var(--btn-hi-2)); }
  .map-btn:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(var(--sh-rgb),.5); }
  /* v44：四个方向键改**单行**（◀ ▲ ▼ ▶），不再摆成十字占两行 */
  .map-btn.left { grid-column: 1; }
  .map-btn.up { grid-column: 2; }
  .map-btn.down { grid-column: 3; }
  .map-btn.right { grid-column: 4; }
  .mk-sep { width: 1px; height: 20px; background: var(--line-strong); flex: none; }
  #map-gx, #map-gy { width: 58px; padding: 4px 6px; background: var(--slab-1); color: var(--text);
    border: 1px solid var(--gold-dark); border-radius: 4px; text-align: center;
    font-size: var(--fs-sub); font-variant-numeric: tabular-nums; }
  .mk-lbl { color: var(--text-dim); font-size: var(--fs-sub); }
  .map-info { font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 点选坐标用信息蓝，和"视野区间"（金）区分开 */
  .map-info.mk-pick { color: var(--blue-info); }
  #mapCanvas { display: block; margin: 0 auto; max-width: 100%; border: 3px solid var(--gold-dark); border-radius: 8px;
    background: #84a050; box-shadow: 0 6px 18px rgba(var(--sh-rgb),.5), inset 0 0 0 1px rgba(var(--sh-rgb),.45); }
  /* ============ v85（老板）：底部缩略地图 + 天下大势面板 ============ */
  /* 为条尾缩略图提供定位上下文（单独成条，不动原 .bottombar 块的 46px 高度） */
  .bottombar { position: relative; padding-right: 56px; }
  .bb-mini {
    position: absolute; right: 10px; top: 3px; width: 40px; height: 40px; padding: 0;
    background: #10160c; border: 1px solid var(--gold-dark); border-radius: 6px;
    cursor: pointer; overflow: hidden; line-height: 0;
    box-shadow: 0 2px 6px rgba(var(--sh-rgb), .45);
  }
  .bb-mini:hover { border-color: var(--gold-light); }
  .bb-mini canvas { width: 38px; height: 38px; display: block; }
  /* 天下大势：方形缩略图（内部 1000×1000 高清背衬，显示 ≤500px） */
  .mini-wrap { display: flex; justify-content: center; margin: 8px 0 4px; }
  .mini-wrap canvas {
    width: min(500px, 68vw); height: auto; aspect-ratio: 1 / 1;
    border: 2px solid var(--gold-dark); border-radius: 6px; background: #10160c;
  }
  .mini-legend {
    text-align: center; font-size: var(--fs-sub); color: var(--text-dim);
    margin: 6px 0 2px; letter-spacing: .04em;
  }
  .mini-legend { --lg-state: #f0d060; --lg-jun: #cfcfc0; --lg-cap: #ff5a40;
                 --lg-zhou: #ffd76a; --lg-jun-c: #f2ead0; --lg-me: #ffe9a0; }
  .mini-legend b { font-weight: 700; }
  .mini-legend .lg-state { color: var(--lg-state); }
  .mini-legend .lg-jun { color: var(--lg-jun); }
  .mini-legend .lg-cap { color: var(--lg-cap); }
  .mini-legend .lg-zhou { color: var(--lg-zhou); }
  .mini-legend .lg-jun-c { color: var(--lg-jun-c); }
  .mini-legend .lg-me { color: var(--lg-me); }

  /* v27（需求 6）：数字输入框的原生上下箭头也去掉 —— 它同样是个"小下拉"，
     在暗色界面里尤其突兀；数量增减交给面板上的「最大」「+/-」按钮，
     或直接键盘输入。 */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  /* ============================================================
   * 战斗场景（v27 · 需求 5）：文字战场条带
   * ------------------------------------------------------------
   * 一行就是一个回合：左端是我军、右端是敌军，中间的点是两军之间的
   * 间距。字体用等宽字（monospace）—— 条带的对齐全靠它，
   * 换成正文字体后每行长短会错开，战场就不成"网格"了。
   * ============================================================ */
  .bt-scene { background: rgba(var(--sh-rgb),.34); border: 1px solid var(--line-strong);
    border-radius: 7px; padding: 8px 10px; margin: 4px 0 2px; overflow-x: auto; }
  .bt-scene .bt-head { display: flex; justify-content: space-between; align-items: center;
    font-size: var(--fs-cap); color: var(--text-dim); letter-spacing: 1px;
    padding-bottom: 5px; margin-bottom: 6px; border-bottom: 1px dashed rgba(201,162,75,.22); }
  .bt-scene .bt-head .bt-scale { color: var(--gold-light); }
  .bt-row { display: flex; align-items: center; gap: 8px; line-height: 1.55; }
  .bt-row .bt-r { flex: none; width: 20px; text-align: right; color: var(--text-dim);
    font-size: var(--fs-cap); font-variant-numeric: tabular-nums; }
  .bt-row .bt-strip { flex: none; font-family: ui-monospace, Consolas, 'Courier New', monospace;
    font-size: var(--fs-cap); letter-spacing: 0; white-space: nowrap; }
  .bt-row .bt-strip i { color: var(--strip-troop); font-style: normal; text-shadow: 0 0 5px rgba(216,176,78,.45); }
  .bt-row .bt-strip u { color: var(--strip-gap); text-decoration: none; }
  .bt-row .bt-n { flex: none; color: var(--parchment); font-size: var(--fs-cap);
    font-variant-numeric: tabular-nums; }
  .bt-row .bt-g { flex: none; color: var(--text-dim); font-size: var(--fs-cap);
    font-variant-numeric: tabular-nums; }
  .bt-gap { color: var(--text-dim); font-size: var(--fs-cap); padding-left: 28px; }
  .bt-log { max-height: 168px; overflow-y: auto; }
  .bt-log .bt-line { font-size: var(--fs-sub); color: var(--text-dim); line-height: 1.75;
    padding: 2px 0; border-bottom: 1px dotted rgba(201,162,75,.12); }

  /* ============ 表格 ============ */
  .tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
  .tbl th {
    background: linear-gradient(180deg, var(--surface-2b), var(--btn-face-2));
    color: var(--gold-light); padding: 8px; font-weight: 700; letter-spacing: 1px;
    border: 1px solid var(--line); text-align: left;
  }
  .tbl td { padding: 8px; border: 1px solid var(--line); background: rgba(var(--sh-rgb),.15); vertical-align: middle; }
  .tbl tr:nth-child(even) td { background: rgba(var(--sh-rgb),.05); }
  .tbl .ctr { text-align: center; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ============ 操作分区（v16） ============
     正向操作与「拆毁/取消」类操作分区展示，避免误点与误操作 */
  .op-zone { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line-strong);
    border-radius: 8px; background: rgba(var(--hl-rgb),.02); }
  .op-zone-t { margin-bottom: 8px; }   /* v82：字色/字号/字距走分区标题共享（原 12px 灰字） */
  .op-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .op-zone.danger { border-color: rgba(176,74,53,.5); background: rgba(176,74,53,.07); }
  .op-zone.danger .op-zone-t { color: var(--red-light); }
  .op-hint { color: var(--text-dim); font-size: var(--fs-sub); }
  /* v76（老板）：「升级，拆除，移动/交换放在同一行上，并进行你的设计小巧思」——
     三键同排、等宽；每键下方一行小字说明后果（费用 / 降级去向 / 用途）。
     （v28 的"拆毁左、移动右分居两端"随 v76 的三键同排一并退役 —— 老板点名要同行。） */
  .bldg-acts { display: flex; gap: 8px; margin-top: 10px; }
  .bldg-acts .bldg-act { flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
    gap: 1px; padding: 7px 4px; line-height: 1.15; }
  .bldg-acts .bldg-act .ba-sub { font-size: var(--fs-cap); font-weight: 400; opacity: .72; }
  /* v68（弹窗统一）：与 m-foot 同规格（实线）—— 改前是 dashed，四套页脚里唯一的例外。
     三格摆位保留 v28 的设计：危险（左）· 关闭（中，天然误点缓冲）· 管理（右）。 */
  /* v73（老板）：「取消升级和关闭按钮要固定在底部，对不同建筑来说位置都要固定」——
      **吸底**：正文再长，底栏也钉在弹窗下沿（sticky），六处建筑弹窗同一位置。
      几何校准（真机实测）：左右负边距 = .inner-panel 的 padding(12px) → 出血到面板边缘；
      `bottom: -12px` + 底部垫 22px → 钉在**面板下沿**（实测底沿差 13px → 1px，三档滚动全对齐）。 */
  /* v76（老板）：「建筑界面的关闭按钮在弹窗界面的最底部」—— 操作三键上移后，
     底栏只剩「关闭」一枚，居中摆放（原 space-between 三格摆位随三键同排退役）。 */
  .bldg-foot { display: flex; justify-content: center; align-items: center; gap: 8px;
    position: sticky; bottom: -12px; z-index: 3;
    margin: 12px -12px -12px; padding: 8px 12px 22px;
    border-top: 1px solid var(--line-strong);
    background: var(--panel-bg);
    box-shadow: 0 -6px 12px rgba(var(--sh-rgb),.28); }
  .bldg-foot .btn.sm { font-size: var(--fs-cap); padding: 3px 9px; }
  /* v76（老板）：「建筑界面的关闭按钮在弹窗界面的最底部」——
     内容短时关闭浮在中间（实测离弹窗底 284px），这里把带 .bldg-foot 的面板
     改纵向 flex，关闭用 margin-top:auto 吃空档、钉死在面板最下沿；
     内容超长时 sticky（v73）照旧接管。 */
  .modal .inner-panel:has(> .bldg-foot) { display: flex; flex-direction: column; }
  .modal .inner-panel:has(> .bldg-foot) > .bldg-foot { margin-top: auto; }
  /* v80（老板）：「升级，拆除（拆1级），移动/交换固定放在底部，关闭的上方」——
     三键与关闭合成一块**吸底操作区**（.bldg-bottom）：几何沿用 v73 校准值
     （出血到面板边缘 + 钉面板下沿），内容短时 margin-top:auto 贴底、长时 sticky 接管。 */
  .bldg-bottom { position: sticky; bottom: -12px; z-index: 3;
    margin: 12px -12px -12px; padding: 8px 12px 22px;
    border-top: 1px solid var(--line-strong);
    background: var(--panel-bg);
    box-shadow: 0 -6px 12px rgba(var(--sh-rgb),.28); }
  .bldg-bottom .bldg-acts { margin-top: 0; }
  .bldg-bottom .bldg-foot { position: static; margin: 8px 0 0; padding: 0;
    border-top: 0; background: transparent; box-shadow: none; }
  .modal .inner-panel:has(> .bldg-bottom) { display: flex; flex-direction: column; }
  .modal .inner-panel:has(> .bldg-bottom) > .bldg-bottom { margin-top: auto; }
  .op-done { color: var(--text-dim); font-size: var(--fs-sub); }
  /* v68（弹窗统一）：升级行专用 —— 费用靠左、按钮靠右（同一行对齐） */
  .op-row-between { justify-content: space-between; }
  .op-kv { color: var(--text-dim); font-size: var(--fs-sub); }
  .op-kv b { color: var(--text-strong); font-weight: 700; }
  /* 弹窗内进度条（沿用格子的 .pbar 结构） */
  .modal .pbar { height: 6px; border-radius: 3px; background: rgba(var(--sh-rgb),.6); overflow: hidden; }
  .modal .pbar i { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #7ee08a, #4fbf6a); transition: width .4s linear; }

  /* ============ 侧栏驻军栏（v16）============
     固定高度、固定位置；折叠状态默认展开 */
  .garrison-bar { margin: 8px 10px 10px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: rgba(var(--sh-rgb),.24); overflow: hidden; }
  .gb-head { display: flex; align-items: center; gap: 6px; padding: 6px 9px; cursor: pointer;
    font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700; }
  .gb-head .gb-arrow { margin-left: auto; color: var(--text-dim); }
  /* v76（老板）：「左侧统计框没有到底」——驻军列表从固定 132px 改**撑满剩余高度**
     （左栏"铺满到底"的主力；兵多时列表内部照旧滚动）。 */
  .gb-list { flex: 1 1 auto; min-height: 132px; overflow-y: auto; padding: 0 9px 8px; }
