  .city-tier { color: var(--gold-light); opacity: .85; font-size: var(--fs-cap); font-weight: 400; margin-left: var(--sp-0); }
  /* v79：【主城】标识（与档位标同族、金色描边更亮） */
  .city-tier.mt { color: var(--gold-light); opacity: 1; filter: brightness(1.3);
    border: 1px solid var(--gold-light); border-radius: var(--r-sm); padding: 0 var(--sp-1); margin-left: var(--sp-1); font-weight: 700; }
  /* v79：神器面板（君主菜单 → 🏺 神器） */
  .art-row { display: flex; gap: var(--sp-4); align-items: flex-start; padding: var(--sp-4) var(--sp-mid); margin-top: var(--sp-3);
    border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: rgba(var(--sh-rgb), .22); }
  .art-ic { font-size: var(--isz-em-lg); line-height: var(--lh-tight); }   /* 走 em：守"裸像素字号"预算 */
  .art-main { flex: 1; min-width: 0; }
  .art-nm { color: var(--gold-light); font-weight: 700; margin-bottom: var(--sp-0); }
  .art-lv { color: var(--green-ok); margin-left: var(--sp-1); }
  .art-side { color: var(--text-dim); font-size: var(--fs-cap); white-space: nowrap; }

  /* v89.7（老板「头像可更换」）：头像更换面板 —— 5×4 一屏 20 张，点选即换。
     尺寸按默认弹窗（660×620）反推：格子 88px、网格总高约 382px，正文余量约 50px，
     不出下拉条（老板硬规矩：弹窗内不许有下拉条）。 */
  .av-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-4);
    max-width: 480px; margin: var(--sp-4) auto var(--sp-0); }
  .av-cell { aspect-ratio: 1 / 1; border: 2px solid var(--line-strong); border-radius: var(--r-lg);
    overflow: hidden; cursor: pointer; background: var(--avcell-bg); }
  .av-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av-cell:hover { border-color: var(--teal-light); }
  .av-cell.cur { border-color: var(--gold); box-shadow: 0 0 10px rgba(var(--gold-rgb),.45); }
  /* 君主面板「头像」行的现脸缩略图（与顶栏同源） */
  .lord-av-mini { width: 32px; height: 32px; border: 1px solid var(--gold); border-radius: var(--r-md);
    object-fit: cover; vertical-align: middle; margin-right: var(--sp-2); }
  /* 顶栏头像成为更换入口（data-action 挂外层 —— syncHeader 每秒只换内部立绘） */
  .lord-portrait[data-action] { cursor: pointer; }
  .lord-portrait[data-action]:hover { border-color: var(--gold-light); box-shadow: 0 0 10px rgba(var(--gold-rgb),.45); }

  /* v89.105（基调统一）：统计页（黄册）v89.104 整页退役 —— 这里原先的
     .ledger / .ledger-sec / .lg-row 一族（约 16 行）随之成为**永不匹配的死样式**，
     一并清除。下面 .scroll-page 一族**保留**：简牍/长页阅读器仍在用。

  .scroll-page {
    position: relative; padding: 0; border-radius: var(--r-sm);
    background:
      repeating-linear-gradient(90deg,
        rgba(var(--sh-rgb),.30) 0 1px, rgba(var(--hl-rgb),.024) 1px 3px,
        rgba(var(--sh-rgb),.11) 3px 4px, rgba(var(--sh-rgb),0) 4px 15px),
      linear-gradient(180deg, #1d1c16 0%, #16161b 45%, #101116 100%);
    border: 1px solid rgba(var(--gold-rgb),.20); border-top: none; border-bottom: none;
    box-shadow: inset 0 0 60px rgba(var(--sh-rgb),.55), inset 0 1px 0 rgba(var(--hl-rgb),.03);
    margin: var(--sp-5) 0;
  }
  /* 上下卷轴木轴 */
  .scroll-axis {
    position: relative; height: 18px; margin: 0 -10px;
    border-radius: var(--r-lg);
    background: var(--grad-scroll-axis);
    border: 1px solid rgba(var(--sh-rgb),.6);
    box-shadow: 0 3px 10px rgba(var(--sh-rgb),.55), inset 0 1px 0 rgba(255,225,170,.22);
  }
  .scroll-axis::before, .scroll-axis::after {
    content: ''; position: absolute; top: -3px; width: 16px; height: 22px; border-radius: 50%;
    background: var(--grad-scroll-knob);
    border: 1px solid rgba(var(--sh-rgb),.55);
  }
  .scroll-axis::before { left: -12px; }
  .scroll-axis::after { right: -12px; }
  .scroll-body { padding: var(--sp-5) var(--sp-5) var(--sp-5); }

  /* 标题：朱印 + 墨书 */
  .scroll-title { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-mid);
    padding-bottom: var(--sp-4); border-bottom: 1px solid rgba(var(--gold-rgb),.26); }
  .scroll-title .seal {
    flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: var(--grad-seal); color: var(--parchment);
    font-size: var(--fs-body); font-weight: 800; border-radius: var(--r-sm);
    box-shadow: inset 0 0 0 1px rgba(255,220,180,.35), 0 2px 6px rgba(var(--sh-rgb),.5);
  }
  .scroll-title .tx { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); letter-spacing: 2px; }
  .scroll-title .rq { margin-left: auto; font-size: var(--fs-sub); color: var(--text-dim); }

  /* 简牍：每个指标一枚窄简 —— 标签竖排、数值朱笔 */
  /* 简牍分区标题（替代 emoji 小标） */
  .seal-h {
    display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-5) 0 var(--sp-3);
    color: var(--gold-light);
  }
  .seal-h::before {
    content: ''; flex: none; width: 7px; height: 14px; border-radius: var(--r-xs);
    background: var(--grad-seal-flat);
    box-shadow: 0 0 0 1px rgba(var(--seal-hi-rgb),.18);
  }
  .seal-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--gold-rgb),.30), transparent); }
  .seal-h .cnt { font-size: var(--fs-sub); color: var(--text-dim); font-weight: 400; letter-spacing: 0; }

  /* 驿报：战报做成"文书"行 */
  /* v39（需求 4）：战报从"一条一个框"改为**列表行** ——
     底色、边框、圆角全部去掉，只留一条底部分隔线；胜负改用行首一个小圆点区分。
     整行可点（原先右侧的「查看」按钮也是一个个小框）。 */
  .doc-bar { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-0);
    border-bottom: 1px solid var(--line); cursor: pointer; transition: background .14s; }
  .doc-bar:last-child { border-bottom: 0; }
  .doc-bar::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cinnabar); box-shadow: 0 0 6px rgba(var(--cinnabar-rgb),.55); }
  .doc-bar.win::before { background: #4fbf6a; box-shadow: 0 0 6px rgba(var(--win-rgb),.55); }
  .doc-bar:hover { background: rgba(var(--hl-rgb),.05); }
  .doc-bar .db-t { flex: 1; font-size: var(--fs-body); font-weight: 700; color: var(--gold-light); }
  .doc-bar .db-d { font-size: var(--fs-sub); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .doc-bar .db-go { flex: none; font-size: var(--fs-sub); color: var(--gold-light); opacity: .55; }
  .doc-bar:hover .db-go { opacity: 1; }
  /* v89.89（D4）：战报收藏星标 */
  .doc-bar .db-fav { flex: none; font-size: var(--fs-sub); color: var(--text-dim);
    opacity: .7; cursor: pointer; transition: opacity .12s; }
  .doc-bar .db-fav:hover { opacity: 1; }
  .doc-bar .db-fav.on { opacity: 1; }
  /* v89.89（A4）：材料产地跳转图标 */
  .mat-go { cursor: pointer; opacity: .55; margin-left: var(--sp-1); }
  .mat-go:hover { opacity: 1; }
  /* v89.89（C4）：故事集（已读回看 + 收集进度） */
  .sg-row { display: flex; align-items: baseline; gap: var(--sp-3); padding: var(--sp-1) 0; flex-wrap: wrap; }
  .sg-k { flex: none; width: 44px; color: var(--gold-light); font-size: var(--fs-sub); font-weight: 700; }
  .sg-items { flex: 1; display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); }
  .sg-item { color: var(--gold-light); font-size: var(--fs-body); cursor: pointer; }
  .sg-item:hover { text-decoration: underline; }
  .sg-item i { font-style: normal; font-size: var(--fs-sub); color: var(--text-dim); margin-left: var(--sp-0); }
  .sg-item.dim { color: var(--text-dim); cursor: default; opacity: .55; }
  .sg-item.dim:hover { text-decoration: none; }
  .sg-n { flex: none; font-size: var(--fs-sub); color: var(--text-dim); }
  /* v89.89（E3）：募兵面板人口三段条 */
  .pop-3 { display: inline-flex; align-items: center; gap: var(--sp-3); }
  .pop-3 .p3-k { color: var(--text-dim); font-size: var(--fs-sub); }
  .pop-3 .p3-seg { font-size: var(--fs-sub); color: var(--text-dim); }
  .pop-3 .p3-seg b { color: var(--text); font-variant-numeric: tabular-nums; }
  .pop-3 .p3-seg.ok b { color: var(--green-ok); }
  .pop-3 .p3-bar { width: 88px; height: 6px; border-radius: var(--r-sm); background: rgba(var(--sh-rgb),.5);
    border: 1px solid var(--line-strong); overflow: hidden; }
  .pop-3 .p3-bar i { display: block; height: 100%; background: var(--green-ok); }
  .pop-3 .p3-note { font-size: var(--fs-sub); color: var(--text-dim); }
  /* 榜文（公告） */
  .scroll-page .notice-box {
    background: linear-gradient(180deg, rgba(var(--gold-soft-rgb),.06), rgba(var(--sh-rgb),.26));
    border: 1px solid rgba(var(--gold-rgb),.20); border-radius: var(--r-sm); padding: var(--sp-4) var(--sp-mid);
  }
  .scroll-page .tbl th { background: linear-gradient(180deg, rgba(107,83,48,.55), rgba(var(--sh-rgb),.3)); }
  .scroll-page .tbl td { border-bottom: 1px dotted rgba(var(--gold-rgb),.16); }

  /* ---- 野地管理（v23 · 需求 1）---- */
  .wild-stat { background: rgba(var(--sh-rgb),.20); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: var(--sp-3) var(--sp-4); margin-top: var(--sp-3); }
  /* v89.112：原 414px 中间高度 → 撤（"弹窗里再开小窗滚"是老板点名的病）。 */
  .modal-scroll { max-height: none; overflow-y: auto; padding-right: var(--sp-1); }

  /* ---- 点选按钮组（v22 · 需求 1：全站不用下拉框）----
     下拉框要两次点击、展开层会盖住内容、在弹窗里还与外层滚动打架；
     选项只有 4~5 个时它纯属杀鸡用牛刀。统一改为「点一下就选中」。 */
  .chips { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; }
  .chips .chip {
    display: inline-flex; align-items: baseline; gap: var(--sp-1);
    padding: var(--sp-1) var(--sp-4); border-radius: var(--r-xl); cursor: pointer;
    font-size: var(--fs-sub); color: var(--text-dim); white-space: nowrap;
    background: rgba(var(--sh-rgb), .28); border: 1px solid var(--line-strong);
    transition: color .14s, border-color .14s, background .14s;
  }
  .chips .chip:hover { color: var(--gold-light); border-color: var(--sep-gold); }
  .chips .chip.on {
    color: var(--ink-on-gold); font-weight: 700;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    border-color: var(--gold-light);
  }
  .chips .chip-sub { font-size: var(--fs-cap); opacity: .6; font-weight: 400; }
  .chips .chip.on .chip-sub { opacity: .8; }
  .chips-xs .chip { padding: var(--sp-hair) var(--sp-2); font-size: var(--fs-cap); border-radius: var(--r-lg); }
  /* v60（需求 4）：将领页的「本城 / 全境」范围切换 —— 与标题同行，不另占一行高度 */
  .chips.gen-scope { width: auto; margin-left: var(--sp-2); vertical-align: middle; }
  .chips.gen-scope .chip { padding: var(--sp-hair) var(--sp-3); font-size: var(--fs-cap); }
  .chips.city-chips, .chips.res-chips, .chips.gen-chips { width: 100%; }
  /* 将领可能几十位 → 点选列表给个高度上限，超出的滚动看 */
  /* v27（需求 6）：将领选择原先是一条**只有 96px 高的滚动列表** ——
     实际效果和下拉框一模一样（要滚才能看到后面的将领），
     而且滚动条还挂在弹窗里（弹窗本来就要求不出现滚动条）。
     将领上限 = 招贤馆等级（≤10 位），改成两列网格后全部一次呈现，不需要滚动。 */
  .chips.gen-chips { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1); padding: var(--sp-hair); }
  /* v89.112：**宽版 4 列** —— 装备/宝物面板的选择器。
     166 位将领 × 2 列 = 83 行 = 2356px 的高墙（"小小弹窗一屏全是人名"）。
     4 列 + 分页（每页 24，见 ui.genChips 的 per/modal 参数）后 6 行 ≈ 170px。 */
  .chips.gen-chips.wide { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .chips.gen-chips.wide .chip { padding: 2px var(--sp-2); }   /* v89.112c：行高再收 4px */
  /* v89.112c：**只有弹窗内**才做这几处收紧 —— 视图里的行距保持原样 */
  .modal .res-line { padding: 1px var(--sp-1); }
  .modal .seal-h { margin: var(--sp-3) 0 var(--sp-2); }
  .modal .troop-card { padding: var(--sp-2); }
  .chips.gen-chips .chip { justify-content: center; text-align: center; }
  .chips.gen-chips.inline { width: auto; max-width: 100%; }
  .mk-pick { flex-wrap: wrap; }
  /* v61（老板）：满配城的城内布局块（野外城池 / 未占据名城共用）——
     三行账册式排布，右列允许折行（14 项建筑名一行放不下）。 */
  .plan-box { background: rgba(var(--sh-rgb), .20); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-4); margin: var(--sp-2) 0; }
  .plan-box .attr { margin: var(--sp-0) 0; }
  .plan-box .plan-v { text-align: right; max-width: 74%; line-height: var(--lh-body); }
  .plan-box .plan-dim { color: var(--text-dim); font-size: var(--fs-cap); }

  /* ---- 将领肖像（v22 · 需求 2）---- */
  .portrait-holder { display: inline-block; position: relative; line-height: 0; }
  .portrait-holder img, .portrait-holder svg { display: block; border-radius: var(--r-xl); }
  .portrait-svg { display: block; border-radius: var(--r-xl); }
  /* v41（需求 2）：此处原为**第三族** .gen-card（v22 遗留，.gc-face/.gc-body 结构）。
     三族同名样式叠了三版，是「同一处三种来源」的典型；将领改左右分栏后全部无人引用，
     一并删除。 */
  .gd-face { display: flex; justify-content: center; }
  .inn-avatar { font-size: var(--isz-xs); width: 28px; display: flex; align-items: center; justify-content: center; }   /* v82：两条同名规则合并为一 */

  /* ---- 城池视图（v22 · 需求 3）：中央只留棋盘 ----
     城池名 / 人口驻军 / 征收 / 显示比例 / 岁贡 全部下沉到左侧栏，
     让「看的东西」占满中央、操作类控件待在侧栏。 */
  .city-pure { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; }
  .city-pure .city-iso { padding: 0; }

  /* ============================================================
   * v45（需求 2）：城池/城外界面**消除滚动条**
   * ------------------------------------------------------------
   * 实机实测：`#view-container` 竖向溢出 **11px**，于是这两个"整屏棋盘"的界面
   * 永远挂着一条滚动条（老板说的"下拉框"）。
   * 算法对不上账的原因：`ui.fitTile` 已按 16px 呼吸量收边，而 `.ui-page` 又叠了
   * 上下各 `--sp-5`(14px) 的内边距 —— 28 − 16 = 12px，正好就是溢出的那 11~12px。
   * 置 0 后棋盘正好落在可视高度内；16px 呼吸量足够，不会贴边。
   * ============================================================ */
  .ui-page.city-pure { padding: 0; }

  /* 城池下拉框（v45 需求 3）：侧栏顶部换城。
     为什么这里破例用原生 <select>：可选项（城池数）随进程不断增长，
     点选 chips 在窄侧栏里会折成好几行、把城池属性的位置挤下去；
     下拉框恒定一行，且能一次看全"我有哪些城"。 */
  .city-switch { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-1); }
  /* v53：城池清单的**持久容器** —— 它只在"城池清单或当前城池变了"时才被重建，
     其余时间主循环一个字节都不碰，原生下拉列表才不会被每秒重绘冲合。
     单城时里面是空的，靠 :empty 收掉，不留空行。 */
  .city-switch-host { padding: var(--sp-2) var(--sp-4) 0; }
  .city-switch-host:empty { display: none; }
  .city-switch .cs-lbl { color: var(--text-dim); font-size: var(--fs-sub); flex: none; }
  .city-select {
    flex: 1; min-width: 0;
    padding: var(--sp-1) var(--sp-2); border-radius: var(--r-md); cursor: pointer;
    background: var(--slab-1); color: var(--text); border: 1px solid var(--gold-dark);
    font-size: var(--fs-sub); font-family: inherit;
    text-overflow: ellipsis;
  }
  .city-select:hover { border-color: var(--gold-light); }
  .city-select:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 0 2px rgba(var(--gold-soft-rgb), .18); }
  /* v82（老板）：「不需要显示原名 新城池」——官府面板的原名标注退役，
     对应样式随之撤除（域层 origName 照记：州治判定/战报仍按它对号）。 */
  .side-body .zoom-bar { margin: 0; justify-content: flex-start; }

  /* ---- 页面容器：三种界面同一内边距节奏 ---- */
  .ui-page { padding: var(--sp-5); }
  .panel-body > .ui-page { padding: 0 !important; }

  /* ============================================================
   * 将领详情（v26 · 需求 2）：左头像 · 右五维
   * ------------------------------------------------------------
   * 头像固定 168px 在左，属性在右并排；五维表只给一个数值列，
   * "作用"是固定文案（每点……），实时数值在「当前效果」行里。
   * 经验条与经验道具行用于把商城买的练兵经验直接消耗在将领身上。
   * ============================================================ */
  .gd-hero { display: flex; gap: var(--sp-5); align-items: flex-start;
    padding-bottom: var(--sp-4); border-bottom: 1px solid var(--line-strong); }
  .gd-hero .gd-face { flex: none; width: 168px; height: 168px; }
  .gd-hero .gd-face img, .gd-hero .gd-face svg { width: 168px; height: 168px; border-radius: var(--r-xl); display: block; }
  .gd-side { flex: 1; min-width: 0; }
  .gd-tag { font-size: var(--fs-cap); border-radius: var(--r-sm); padding: 0 var(--sp-1); }
  .gd-tag.hero { color: var(--hero-tag); border: 1px solid rgba(var(--hero-tag-rgb),.5); }
  .gd-tag.beauty { color: var(--beauty-tag); border: 1px solid rgba(var(--beauty-tag-rgb),.5); }

  /* v65（老板）：「统率这些属性名都成 2 行了，占空间」——
     根因是**表格自动分配宽度**：作用列文字长 → 抢走空间 → 第一列被压到折行。
     所以这里给第一列**固定宽 + nowrap**（名字短，一定放得下），
     作用列吃剩余宽度；`table-layout:fixed` 保证列宽不再随内容抖动。 */
  .gd-dims { margin-top: var(--sp-3); table-layout: fixed; width: 100%; }
  .gd-dims th, .gd-dims td { padding: var(--sp-1) var(--sp-2); }
  .gd-dims th:first-child, .gd-dims td:first-child {
    width: 52px; white-space: nowrap; padding-left: var(--sp-3);
  }
  /* ⚠️ `table-layout: fixed` 下列宽**只由第一行的 th 决定** ——
     写在 td（.gd-v）上的 width 会被忽略（实测：td 写 62px，实际仍是均分的 253px）。
     所以这里把宽度写回 th 上，作用列自动吃剩余宽度，永不折行。 */
  .gd-dims th:nth-child(1) { width: 52px; }
  .gd-dims th:nth-child(2) { width: 62px; }
  .gd-dims .gd-v { font-weight: 800; font-size: var(--fs-lead);
    color: var(--parchment); font-variant-numeric: tabular-nums; }
  .gd-dims .gd-u { color: var(--text-dim); font-size: var(--fs-sub); line-height: var(--lh-body); }
  /* v74（老板需求 4）：加点列的 ＋ 按钮（原来这里是"每点作用"文字列；
     作用文案已进六维名称的悬停）。 */
  .gd-dims .gd-plus-c { padding-right: var(--sp-1); }
  .gd-dims .gd-plus { padding: 0 var(--sp-3); line-height: var(--lh-body); }
  /* v89.131：体力/精力行的「＋」（道具入口）—— 与六维表里的 gd-plus 同款
     （行内贴右；.gd-line 是 flex，margin-left:auto 把它推到行尾）。 */
  .gd-line .gd-plus { margin-left: auto; padding: 0 var(--sp-3); line-height: var(--lh-body); flex: none; }
  /* v74（老板需求 5）：自由属性点行（表末整行） */
  .gd-freep td { border-top: 1px dashed var(--line-strong); color: var(--text-dim);
    font-size: var(--fs-sub); padding: var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-3); }
  .gd-freep .fp-n { color: var(--gold-light); font-size: var(--fs-lead); font-weight: 800;
    margin: 0 var(--sp-2); font-variant-numeric: tabular-nums; }
  .gd-freep .gd-free-hint { margin-left: var(--sp-2); opacity: .75; }
  /* v74（老板需求 3）：类型签（均衡 / 猛将…）与非空闲状态小签 */
  .gp-style { display: inline-block; margin-left: var(--sp-3); color: var(--text-dim); font-size: var(--fs-cap); }
  .gp-stag { display: inline-block; margin-left: var(--sp-2); padding: 0 var(--sp-2); border-radius: var(--r-sm);
    font-size: var(--fs-cap); color: var(--gold-light); background: rgba(var(--gold-rgb),.14); }
  /* v74（老板需求 5）：加点弹窗行（自由点 / 道具） */
  .stat-row { display: flex; align-items: center; gap: var(--sp-3); justify-content: space-between;
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin: var(--sp-2) 0; }
  .stat-row .sr-name { font-weight: 700; color: var(--gold-light); }
  .stat-row .sr-sub { color: var(--text-dim); font-size: var(--fs-sub); flex: 1; }

  /* v74：`.gd-effect`（带兵/人口/产量/速度 四行备注）随老板需求 6 整块撤除 —— 样式同步下线。 */

  .gd-expbar { height: 10px; border-radius: var(--r-md); background: rgba(var(--sh-rgb),.45);
    border: 1px solid var(--line); overflow: hidden; }
  .gd-expbar i { display: block; height: 100%; border-radius: var(--r-sm);
    background: var(--grad-progress); transition: width .3s; }
  .gd-exptext { font-size: var(--fs-sub); color: var(--text-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gd-exptext b { color: var(--gold-light); }
  /* ============ v67：存档管理面板 ============
     7 个槽位一屏放完，**不出下拉条**（老板的硬规矩）。 */
  .sv-list { border: 1px solid var(--line); border-radius: var(--r-md); margin-top: var(--sp-3); }
  .sv-row {
    display: grid; grid-template-columns: 96px 1fr auto;
    align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3);
    border-bottom: 1px solid var(--line);
  }
  .sv-row:last-child { border-bottom: none; }
  .sv-row .sv-n { font-weight: 700; }
  .sv-row .sv-s { color: var(--text-dim); font-size: var(--fs-sub); }
  .sv-row .sv-b { display: flex; gap: var(--sp-1); }
  .sv-empty { opacity: .5; }
  .sv-imp { margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--line); }
  .sv-ta {
    width: 100%; height: 72px; margin-top: var(--sp-2); box-sizing: border-box;
    background: var(--surface-3); color: var(--text); font-size: var(--fs-cap);
    border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-2); resize: vertical;
  }

  /* ============================================================
     v77（老板）
     ------------------------------------------------------------
     ① 资源区：附属野地下拉框（原「本城 · 城名」表头退役）
     ② 客栈招募：表格版式（表头 + 单行数据，含月俸列）
     ③ 君主面板：左右分栏（左城池列表 / 右信息表）
     ④ 铁匠铺：百炼强化列表
     ============================================================ */
  .wild-pick-host { margin-bottom: var(--sp-1); }
  .wild-pick-host .res-line { display: flex; align-items: center; gap: var(--sp-2); }
  .wild-select { flex: 1 1 auto; min-width: 0; max-width: 168px; }

  /* v80（老板）：「表格行宽相对固定，根据字串长度搞个适合的固定表，在换人时框架不动，
     只有将领信息变动」——table-layout: fixed 只认声明过的宽度（colgroup，见 ui.openInn）；
     列宽按各列字串长度分配：将领最宽（头像+姓名）、四维最窄（2~3 位数字）。
     列宽和贴着容器实宽（实测 942px）：不足时浏览器会按比例压列，别随手改单列。 */
  .inn-tbl { margin: 0; table-layout: fixed; }
  .inn-tbl col.c-name { width: 188px; }
  .inn-tbl col.c-lv { width: 58px; }
  .inn-tbl col.c-rank { width: 168px; }
  .inn-tbl col.c-style { width: 66px; }
  .inn-tbl col.c-attr { width: 58px; }
  .inn-tbl col.c-salary { width: 88px; }
  .inn-tbl col.c-act { width: 140px; }
  .inn-tbl th, .inn-tbl td { padding: var(--sp-1) var(--sp-3); }
  .inn-tbl .inn-face-cell { display: flex; align-items: center; gap: var(--sp-3); white-space: nowrap; }
  .inn-tbl tr.off td { opacity: .55; }
  .inn-tbl .rank-badge { white-space: nowrap; }
  .inn-tbl .inn-act { display: flex; align-items: center; gap: var(--sp-2); justify-content: flex-end; white-space: nowrap; }

  .lord-split { display: grid; grid-template-columns: 5fr 6fr; gap: var(--sp-mid); align-items: start; }
  .lord-city { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-1) var(--sp-3);
    border: 1px solid var(--sep-gold); border-radius: var(--r-lg); margin-bottom: var(--sp-1); }
  .lord-city.cur { border-color: var(--gold-dark); background: rgba(var(--gold-rgb), .10); }
  .lord-city .ls-nm { color: var(--gold-light); font-weight: 700; white-space: nowrap; }
  .lord-city .ls-meta { color: var(--text-dim); flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lord-tbl td.k { width: 86px; color: var(--text-dim); white-space: nowrap; }

  .enh-list { display: flex; flex-direction: column; }
  .enh-row { display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--sep-gold); }
  .enh-row:last-child { border-bottom: none; }
  .enh-nm { flex: 1 1 auto; min-width: 0; }
  .enh-tag { color: var(--gold-light); font-weight: 700; margin-left: var(--sp-1); }
  .enh-cost { color: var(--text-dim); font-size: var(--fs-sub); }
  /* ---------- v89.1 全屏剧本视觉化（幕景横幅 / 幕题 / 徽章 / 结算卡） ---------- */
  .sxf-wrap { --sxf-art-sz: 118px; --sxf-act-sz: 40px; --sxf-emb-sz: 52px;
    max-width: 860px; margin: 0 auto; padding: var(--sp-6) var(--sp-5) 72px;
    animation: sxfIn .38s ease-out both; }
  .sxf-hero { position: relative; overflow: hidden; border: 1px solid var(--sep-gold);
    border-radius: var(--r-xl); padding: var(--sp-5) var(--sp-6) var(--sp-4); background: var(--panel-bg); }
  .sxf-hero-art { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    font-size: var(--sxf-art-sz); line-height: var(--lh-1); opacity: .10; pointer-events: none; }
  .sxf-hero-top { position: relative; display: flex; align-items: center; gap: var(--sp-4); }
  .sxf-act-ic { font-size: var(--sxf-act-sz); line-height: var(--lh-1); }
  .sxf-hero-name { font-size: var(--fs-h1); font-weight: 800; color: var(--gold-light); }
  .sxf-hero-kind { color: var(--text-dim); font-size: var(--fs-cap); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: var(--sp-hair) var(--sp-3); }
  .sxf-hero-alias { color: var(--gold); font-size: var(--fs-sub); opacity: .92; }
  .sxf-hero-lord { margin-left: auto; display: flex; align-items: center; gap: var(--sp-3); }
  .sxf-lord-meta { display: flex; flex-direction: column; align-items: flex-end; }
  .sxf-lord-meta b { color: var(--text-strong); }
  .sxf-lord-sub { color: var(--text-dim); font-size: var(--fs-cap); white-space: nowrap; }
  .sxf-hero-meta { position: relative; color: var(--text-dim); font-size: var(--fs-sub); margin-top: var(--sp-2); }
  .sxf-hero-foot { position: relative; display: flex; align-items: center; margin-top: var(--sp-4);
    border-top: 1px solid var(--line); padding-top: var(--sp-4); }
  .sxf-dots { letter-spacing: 5px; }
  .sxf-dot { color: var(--text-dim); }
  .sxf-dot.on { color: var(--gold); }
  .sxf-hero-foot .btn { margin-left: auto; }
  .sxf-timeline { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4);
    color: var(--text-dim); font-size: var(--fs-sub); }
  .sxf-tl-cap { color: var(--gold-light); }
  .sxf-tl-item { color: var(--text-strong); }
  .sxf-tl-l { color: var(--text-dim); margin-left: var(--sp-1); }
  .sxf-tl-sep { color: var(--text-dim); }
  .sxf-stage { margin-top: var(--sp-4); }
  .sxf-stage-tag { display: flex; align-items: baseline; gap: var(--sp-4); margin-bottom: var(--sp-3); }
  .sxf-stage-no { color: var(--gold-light); font-size: var(--fs-sub); letter-spacing: 1px; }
  .sxf-stage-tt { color: var(--text-strong); font-size: var(--fs-h3); font-weight: 700; }
  .sxf-narr { background: var(--panel-bg); border: 1px solid var(--sep-gold); border-radius: var(--r-lg);
    padding: var(--sp-5) var(--sp-6); font-size: var(--fs-lead); line-height: var(--lh-loose); color: var(--text); }
  .sxf-q { color: var(--gold-light); }
  .sxf-opts { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
  .btn.sxf-opt { display: flex; align-items: center; gap: var(--sp-4); text-align: left; padding: var(--sp-4) var(--sp-5);
    font-size: var(--fs-lead); }
  .sxf-opt-l { flex: 1 1 auto; min-width: 0; }
  .sxf-opt-l b { color: var(--gold-light); }
  .sxf-opt-d { color: var(--text-dim); font-weight: 400; margin-left: var(--sp-4); font-size: var(--fs-sub); }
  .sxf-opt-b { flex: 0 0 auto; display: inline-flex; gap: var(--sp-2); }
  .sxf-bdg { border: 1px solid; border-radius: 999px; padding: var(--sp-hair) var(--sp-2); font-size: var(--fs-cap);
    white-space: nowrap; line-height: var(--lh-body); }
  .sxf-note { margin-top: var(--sp-4); color: var(--text-dim); font-size: var(--fs-cap); }
  .sxf-result { text-align: center; margin-top: var(--sp-5); }
  .sxf-emblem { width: 96px; height: 96px; margin: 0 auto; display: flex; align-items: center;
    justify-content: center; font-size: var(--sxf-emb-sz); border: 1px solid; border-radius: 50%;
    background: var(--panel-bg); box-shadow: 0 0 26px rgba(var(--gold-rgb), .18);
    animation: sxfPop .5s cubic-bezier(.2,.9,.3,1.35) both; }
  .sxf-exit-t { font-size: var(--fs-h1); font-weight: 800; margin-top: var(--sp-4); }
  .sxf-exit-s { color: var(--text-dim); font-size: var(--fs-sub); margin-top: var(--sp-1); }
  .sxf-loot { background: var(--panel-bg); border: 1px solid var(--sep-gold); border-radius: var(--r-lg);
    padding: var(--sp-4) var(--sp-6); margin-top: var(--sp-5); text-align: left; }
  .sxf-loot-hd { color: var(--text-dim); font-size: var(--fs-body); margin-bottom: var(--sp-2); }
  .sxf-loot-row { font-size: var(--fs-lead); line-height: var(--lh-loose); color: var(--green-ok); }
  .sxf-loot-row.bad { color: var(--red-light); }
  .sxf-loot-row::before { content: '◆ '; font-size: var(--fs-cap); }
  .sxf-cost { color: var(--text-dim); font-size: var(--fs-cap); margin-top: var(--sp-4); }
  .sxf-exit-row { margin-top: var(--sp-6); }
  @keyframes sxfIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes sxfPop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

  /* ---------- v89.2 场景化（场景画布 / 热点点选 / 时机条） ---------- */
  .sxf-scene { position: relative; margin-top: var(--sp-4); border: 1px solid var(--sep-gold);
    border-radius: var(--r-xl); overflow: hidden; background: var(--slab-1);
    box-shadow: inset 0 0 44px rgba(var(--sh-rgb), .30); animation: sxfIn .4s ease-out both; }
  .sxf-canvas { display: block; width: 100%; height: auto; }
  .sxf-scene.is-done .sxf-canvas { opacity: .84; filter: saturate(.85); }
  .sxf-spots { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .btn.sxf-opt.sxf-spot { position: absolute; transform: translate(-50%, -50%);
    display: inline-flex; flex-direction: column; align-items: center; gap: var(--sp-1);
    width: auto; padding: 0; background: none; border: none; box-shadow: none; }
  .sxf-spot-hit { width: 22px; height: 22px; border-radius: 50%;
    background: rgba(var(--gold-rgb), .92); border: 2px solid rgba(var(--hl-rgb), .85);
    box-shadow: 0 0 0 0 rgba(var(--gold-rgb), .55), 0 2px 6px rgba(var(--sh-rgb), .5);
    animation: sxfPing 1.8s ease-out infinite; }
  .btn.sxf-opt.sxf-spot:hover .sxf-spot-hit { background: var(--gold); }
  .sxf-spot-lb { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap;
    background: rgba(var(--sh-rgb), .62); border: 1px solid var(--sep-gold);
    border-radius: 999px; padding: var(--sp-0) var(--sp-4); font-size: var(--fs-cap); color: var(--parchment); }
  .sxf-spot-lb b { color: var(--gold-light); }
  .sxf-sc-tip { position: absolute; left: var(--sp-4); bottom: var(--sp-3); z-index: 2;
    font-size: var(--fs-cap); color: var(--parchment); background: rgba(var(--sh-rgb), .55);
    border-radius: 999px; padding: var(--sp-0) var(--sp-4); letter-spacing: 1px; }
  .sxf-timing { margin-top: var(--sp-4); background: var(--panel-bg); border: 1px solid var(--sep-gold);
    border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); }
  .sxf-tk { position: relative; height: 26px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, rgba(var(--sh-rgb), .55), rgba(var(--sh-rgb), .30));
    border: 1px solid var(--line-strong); }
  .sxf-zone { position: absolute; top: 0; height: 100%; }
  .sxf-zone-g { left: 28%; width: 44%; background: rgba(var(--hl-rgb), .08); }
  .sxf-zone-p { left: 44%; width: 12%; background: rgba(var(--gold-rgb), .38); }
  .sxf-mark { position: absolute; top: 2px; left: 4%; width: 4px; height: 20px; border-radius: var(--r-sm);
    background: var(--gold-light); box-shadow: 0 0 8px rgba(var(--gold-rgb), .8); }
  .sxf-tm-row { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-3); }
  .sxf-tm-hint { flex: 1 1 auto; color: var(--text-dim); font-size: var(--fs-cap); }
  .sxf-opt-ic { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(var(--hl-rgb), .08); font-size: var(--fs-body); }
  @keyframes sxfPing {
    0% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), .55), 0 2px 6px rgba(var(--sh-rgb), .5); }
    70% { box-shadow: 0 0 0 14px rgba(var(--gold-rgb), 0), 0 2px 6px rgba(var(--sh-rgb), .5); }
    100% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb), 0), 0 2px 6px rgba(var(--sh-rgb), .5); }
  }

  /* ============================================================
   * v89.6（老板：「探索性和趣味性」）：奇遇 · 见闻录
   * ------------------------------------------------------------
   * .wnr-*  野地弹窗里的奇遇入口 / 探察提示（青莲紫 == --wonder）
   * .sxf-clue  剧本结算屏的线索行（紫框虚线）
   * .jnl-*  见闻录面板（三档图鉴 + 待探线索）
   * ============================================================ */
  .wnr-line { margin: var(--sp-2) 0; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); font-size: var(--fs-sub);
    color: var(--wonder); border: 1px solid rgba(var(--wonder-rgb),.42);
    background: rgba(var(--wonder-rgb),.10); }
  .wnr-line.wnr-new { color: var(--text); }
  .wnr-line.wnr-done { color: var(--text-dim); border-color: rgba(var(--wonder-rgb),.22);
    background: rgba(var(--wonder-rgb),.05); }
  .btn.sm.wnr-btn { color: var(--wonder); border-color: rgba(var(--wonder-rgb),.55); }
  .sxf-clue { margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); font-size: var(--fs-sub);
    color: var(--wonder); border: 1px dashed rgba(var(--wonder-rgb),.5);
    background: rgba(var(--wonder-rgb),.08); text-align: left; }
  .jnl-stat { text-align: center; color: var(--text-dim); font-size: var(--fs-sub); margin: var(--sp-0) 0 var(--sp-3); }
  .jnl-stat b { color: var(--gold-light); }
  .jnl-sec { color: var(--gold-light); font-size: var(--fs-h3); font-weight: 700; margin: var(--sp-4) 0 var(--sp-2); }
  .jnl-empty { color: var(--text-dim); font-size: var(--fs-sub); padding: var(--sp-1) 0 var(--sp-0); }
  .jnl-list { display: flex; flex-direction: column; gap: var(--sp-1); }
  .jnl-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-1) var(--sp-3); border-radius: var(--r-sm); background: var(--surface-3); }
  .jnl-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(148px,1fr)); gap: var(--sp-2); }
  .jnl-card { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); text-align: center;
    padding: var(--sp-3) var(--sp-2); border-radius: var(--r-md); background: var(--surface-3);
    border: 1px solid var(--line); }
  .jnl-card.has { border-color: rgba(var(--wonder-rgb),.45); background: rgba(var(--wonder-rgb),.07); }
  .jnl-ic { font-size: var(--fs-h1); line-height: var(--lh-1); }
  .jnl-nm { color: var(--text-strong); font-weight: 700; font-size: var(--fs-body); }
  .jnl-card.has .jnl-nm { color: var(--wonder); }
  .jnl-txt { color: var(--text-dim); font-size: var(--fs-cap); line-height: var(--lh-tight); }
  /* ================= 文字游戏 · 阅读器（story/） =================
     取色/字号全部走主题令牌；标题沿用共享规则内的既有类（.gold-heading / .side-title）。
     .sgr-text 用 pre-wrap 保留正文换行（数据里的换行即段落，不转 <br>）。 */
  #story-fx .sgr-wrap { max-width: 880px; margin: 0 auto; padding: var(--sp-6) var(--sp-5) 72px; }
  .sgr-banner { display: flex; align-items: center; gap: var(--sp-3);
    border-bottom: 1px solid var(--sep-gold); padding-bottom: var(--sp-3); margin-bottom: var(--sp-5); }
  .sgr-title { flex: 1 1 auto; }
  .sgr-text { font-size: var(--fs-lead); line-height: var(--lh-loose); white-space: pre-wrap; color: var(--text); }
  .sgr-ops { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-5); }
  .sgr-opt { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1);
    height: auto; text-align: left; padding: var(--sp-3) var(--sp-4); line-height: var(--lh-body); }
  .sgr-l { font-weight: 700; color: var(--text-strong); }
  .sgr-d { font-size: var(--fs-sub); color: var(--text-dim); font-weight: 400; }
  .sgr-end { border: 1px solid var(--sep-gold); border-radius: var(--r-lg);
    padding: var(--sp-5); background: var(--panel-bg); }
  .sgr-g-win { border-color: var(--gold); }
  .sgr-g-lose { border-color: var(--red); }
  .sgr-got { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4);
    margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--line); }
  .sgr-gv { color: var(--gold-light); font-weight: 700; }
  .sgr-gv i { font-style: normal; color: var(--text-dim); font-weight: 400; margin-right: var(--sp-1); }
  .sgr-note { color: var(--text-dim); font-size: var(--fs-cap); }
  /* v89.8（老板「背景壁画的变换」）：满幅壁画两层 + 交叉淡入 + 沙幕（保正文可读）。
     沙幕吃主题底色（明暗四主题都成立）；正文层 z=2 压在最上，点选不受遮挡。 */
  .sgr-bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
    opacity: 0; transition: opacity .55s ease; z-index: 0; }
  .sgr-bg svg { width: 100%; height: 100%; display: block; }
  .sgr-bg[data-on] { opacity: 1; }
  .sgr-scrim { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
    background: linear-gradient(180deg, var(--bg-dark) 0%, transparent 15%),
      linear-gradient(180deg, transparent 30%, var(--bg-2) 74%); }
  #story-fx .sgr-body { position: relative; z-index: 2; }
  /* 段入场动效（每段重放入场：正文层 innerHTML 每次替换，动画自然重放） */
  .sgr-wrap { animation: sgrIn .34s ease both; }
  @keyframes sgrIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sgr-prog { color: var(--text-dim); font-size: var(--fs-sub); white-space: nowrap; flex: none; }
  .sgr-dots { display: inline-flex; gap: var(--sp-1); align-items: center; margin-left: var(--sp-2); }
  .sgr-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  .sgr-dots i.on { background: var(--gold-light); }
  /* ============================================================
   * 战场界面（v89.87 · 老板需求 4）：实时观战 + 逐回合指挥
   * ------------------------------------------------------------
   * 距离轴：左我军 / 右敌军；单位卡绝对定位，`transition: left` 即位移演出。
   * 主题兼容：底色一律用 rgba(var(--sh-rgb),…) / 金色变量，浅深主题都不打架。
   * ============================================================ */
  /* v89.120（老板「三个大按钮缩小，放到读秒那行正中间」）：
     .bt-top 由 flex 改 grid 三列 —— 左=读数 / 中=三键 / 右=提示；
     "正中间"由列结构保证（不是绝对定位），两侧再挤也不会互相盖住。 */
  .bt-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: var(--sp-4); padding: var(--sp-1) var(--sp-0) var(--sp-3);
    font-size: var(--fs-sub); color: var(--text-dim); }
  .bt-top .bt-cd b { color: var(--gold-light); font-size: var(--fs-num); }
  .bt-top .bt-left { display: flex; align-items: center; gap: var(--sp-5); min-width: 0; flex-wrap: wrap; }
  .bt-top .bt-acts { display: flex; gap: var(--sp-2); justify-self: center; white-space: nowrap; }
  .bt-top .bt-hint { justify-self: end; text-align: right; opacity: .72; font-size: var(--fs-cap); }
  .bt-field { position: relative; min-height: 120px; margin: var(--sp-0) 0 var(--sp-3); border-radius: var(--r-xl);
    border: 1px solid rgba(var(--gold-soft-rgb), .18); overflow: hidden;
    background: linear-gradient(90deg, rgba(var(--gold-soft-rgb), .06), rgba(var(--sh-rgb), .42) 50%, rgba(190, 84, 74, .08)); }
  .bt-field::after { content: ''; position: absolute; left: 50%; top: 8%; bottom: 8%; width: 1px;
    background: var(--text-dim); opacity: .3; }
  /* v89.116（老板需求 8）：战场令牌**只画兵种图标**（名称与数量移到两侧列表） */
  .bt-unit { position: absolute; transform: translateX(-50%); display: flex; align-items: center;
    padding: var(--sp-0) var(--sp-1); border-radius: var(--r-lg); white-space: nowrap;
    transition: left .55s cubic-bezier(.4, .8, .4, 1); }
  .bt-unit .bt-ico svg, .bt-unit .bt-ico img { width: 26px; height: 26px; vertical-align: middle; }
  .bt-unit.atk { background: rgba(var(--gold-soft-rgb), .16); border: 1px solid rgba(var(--gold-soft-rgb), .5); }
  .bt-unit.def { background: rgba(var(--foe-rgb),.16); border: 1px solid rgba(var(--foe-rgb),.48); }
  .bt-unit.hit { animation: btHit .36s ease; }
  /* ---- 上部分三段：左我军（1/4）· 中战场（1/2）· 右敌军（1/4） ---- */
  /* v89.117（老板「左右分别六分之一作为兵种设置区域，让中间战斗界面尽量大」）：
     1fr : 4fr : 1fr = 1/6 : 2/3 : 1/6（原先 1:2:1 = 各 1/4、中间 1/2）。 */
  .bt-board { display: grid; grid-template-columns: 1fr 4fr 1fr; gap: var(--sp-2); align-items: start; }
  .bt-side { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
  .bt-side-h { font-size: var(--fs-cap); color: var(--text-dim); padding: 0 var(--sp-1) var(--sp-0); }
  .bt-rrow { display: flex; align-items: center; gap: var(--sp-1); padding: var(--sp-0) var(--sp-1);
    border-radius: var(--r-md); background: rgba(var(--sh-rgb), .26); border: 1px solid var(--line);
    min-width: 0; }
  .bt-side.mine .bt-rrow { border-color: rgba(var(--gold-soft-rgb), .38); }
  .bt-side.foe .bt-rrow { border-color: rgba(var(--foe-rgb), .34); }
  .bt-rrow.dead { opacity: .38; }
  .bt-ric { display: flex; flex-direction: column; align-items: center; flex: none; width: 40px;
    line-height: var(--lh-1); }
  .bt-ric .bt-ico svg, .bt-ric .bt-ico img { width: 20px; height: 20px; vertical-align: middle; }
  .bt-ric .bt-rn { font-size: var(--fs-cap); color: var(--gold-light); font-variant-numeric: tabular-nums; }
  .bt-side.foe .bt-ric .bt-rn { color: var(--red-light); }
  .bt-ric .bt-rnm { font-size: var(--fs-cap); color: var(--text-dim); font-style: normal;
    max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bt-side .bt-sel { flex: 1 1 0; min-width: 0; }
  .bt-side .bt-ro { flex: 1 1 0; min-width: 0; font-size: var(--fs-cap); color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes btHit { 0%, 100% { filter: none; } 40% { filter: brightness(1.9) saturate(1.6); } }
  /* v89.117：被歼灭的兵种在**战场上**变暗（与两侧列表的 .bt-rrow.dead 同一语义） */
  .bt-unit.dead { opacity: .26; filter: grayscale(.85); }
  .bt-unit.dead .bt-ico { filter: grayscale(1) brightness(.7); }
  .bt-castle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: var(--fs-sub); color: var(--gold-light); opacity: .92; }
  /* v89.116：播报窗 —— **一回合一行**（行动与战果同行），留 12 行的可视高度、
     超出滚动（.bt-ev.round 是新的回合行；旧的逐条事件样式保留给"静默闪烁"路径的兼容）。 */
  /* v89.117（老板需求 7）：播报窗改**逐兵种一行**（移动与战斗同行、按出手序错开），
     回合之间虚线间隔。高度 150 → 196px（每回合多行，得看得见两个回合）。 */
  .bt-log { max-height: 196px; overflow-y: auto; background: rgba(var(--sh-rgb), .3);
    border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-4); font-size: var(--fs-sub); line-height: var(--lh-body);
    margin-top: var(--sp-2); }
  .bt-ev.round { color: var(--parchment); }
  /* 回合之间的**虚线间隔**（老板原话「不同回合之间虚线间隔」） */
  .bt-ev.sep { height: 0; border-top: 1px dashed rgba(var(--gold-soft-rgb), .38); margin: var(--sp-2) 0; }
  .bt-ev.hdr { color: var(--gold-light); font-weight: 700; letter-spacing: .5px; }
  .bt-ev.atk { color: var(--parchment); font-variant-numeric: tabular-nums; }
  .bt-ev.def { color: var(--red-light); font-variant-numeric: tabular-nums; }
  /* 回合之间的**虚线间隔**（老板原话「不同回合之间虚线间隔」） */
  .bt-ev.sep { height: 0; border-top: 1px dashed rgba(var(--gold-soft-rgb), .38); margin: var(--sp-2) 0; }
  /* 回合头（第 N 回合 · 间距） */
  .bt-ev.hdr { color: var(--gold-light); font-weight: 700; letter-spacing: .5px; }
  /* 逐兵种行：我方暖白 / 敌方红 —— 与两侧列表的语义色一致 */
  .bt-ev.atk { color: var(--parchment); font-variant-numeric: tabular-nums; }
  .bt-ev.def { color: var(--red-light); font-variant-numeric: tabular-nums; }
  .bt-ev.round b { color: var(--gold-light); }
  .bt-ev.attack { color: var(--amber); }
  .bt-ev.counter { color: var(--blue-info); }
  .bt-ev.tower, .bt-ev.wall { color: var(--gold-light); }
  /* ⛔ v89.116：`.bt-cmd / .bt-cmdrow / .bt-btn` 整段退役 ——
     "逐兵种指令"从**下半页三个并排按钮**搬进了左上/右上的兵种行（下拉框），
     旧样式已无消费点（老板：「前进驻守撤退通过下拉框选择，不要直接列出，节省空间」）。 */
  .bt-sel { background: rgba(var(--sh-rgb), .5); color: var(--text); border-radius: var(--r-md);
    border: 1px solid rgba(var(--gold-soft-rgb), .32); padding: var(--sp-0) var(--sp-2); font-size: var(--fs-cap); }
  .bt-end { text-align: center; padding: var(--sp-6) var(--sp-3); }
  .bt-end-t { font-size: var(--fs-h2); color: var(--gold-light); margin-bottom: var(--sp-3); }
  .bt-end-s { font-size: var(--fs-sub); color: var(--text-dim); line-height: var(--lh-loose); }

  /* ============================================================
   * v89.102（老板需求 2）：战报**沙盘**（固定沙盘 · 逐兵种逐帧）
   * ------------------------------------------------------------
   * 格局：顶栏 / 三列（我 · 沙盘 · 敌）/ 底部操作条 / 帧流。
   * 「固定」= 每支部队一条**固定泳道**（`--lane` 高，由行数算出），
   *   令牌只在自己泳道上左右移动 —— 版式不随帧重排；
   *   `left` 走 CSS transition，与战场界面同一套位移演出。
   * 主题兼容：一律 rgba(var(--sh-rgb)/--gold-rgb) + 语义变量，深浅主题都不打架。
   * 尺寸：`size:max` 铺满视口；泳道高度自适应 → **不做弹窗内下拉**（硬规矩）。
   * ============================================================ */
  .sd-top { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap;
    font-size: var(--fs-sub); color: var(--text-dim); padding: var(--sp-0) var(--sp-0) var(--sp-3); }
  .sd-top b { color: var(--gold-light); }
  .sd-top .sd-hint { margin-left: auto; font-size: var(--fs-cap); opacity: .78; }
  .sd-board { display: grid; grid-template-columns: 306px 1fr 200px; gap: var(--sp-3); align-items: start; }
  .sd-col { display: flex; flex-direction: column; }
  .sd-row { display: flex; align-items: center; gap: var(--sp-1); height: var(--lane); min-height: 22px;
    padding: 0 var(--sp-0); border-bottom: 1px dashed rgba(var(--sh-rgb), .38); }
  .sd-row .sd-ico svg, .sd-row .sd-ico img { width: 18px; height: 18px; vertical-align: middle; }
  .sd-cnt { flex: none; min-width: 46px; text-align: right; font-size: var(--fs-cap);
    color: var(--gold-light); font-variant-numeric: tabular-nums; }
  .sd-foe .sd-cnt { color: var(--red-light); }
  .sd-chips { display: inline-flex; gap: var(--sp-1); flex: none; }
  .sd-chip { font-size: var(--fs-cap); line-height: 16px; padding: 0 var(--sp-1); border-radius: var(--r-md); cursor: pointer;
    border: 1px solid rgba(var(--gold-soft-rgb), .3); background: rgba(var(--sh-rgb), .42); color: var(--text-dim);
    white-space: nowrap; }
  .sd-chip.on { color: var(--ink-on-gold); background: var(--grad-gold);
    border-color: rgb(var(--gold-rgb)); }
  .sd-chip.ro { cursor: default; }
  .sd-sel { flex: 1; min-width: 0; background: rgba(var(--sh-rgb), .5); color: var(--text);
    border-radius: var(--r-md); border: 1px solid rgba(var(--gold-soft-rgb), .3);
    padding: var(--sp-hair) var(--sp-1); font-size: var(--fs-cap); max-width: 108px; }
  .sd-field { position: relative; border-radius: var(--r-xl); overflow: hidden;
    border: 1px solid rgba(var(--gold-soft-rgb), .22);
    background: linear-gradient(90deg, rgba(var(--gold-soft-rgb), .07), rgba(var(--sh-rgb), .44) 50%, rgba(190, 84, 74, .09)); }
  /* 地面贴图：AI 地形材质铺满（cover 只裁不缩，避免被拉伸成"没铺正"） */
  .sd-ground { position: absolute; inset: 0; background-repeat: no-repeat; background-size: cover;
    background-position: center; opacity: .3; pointer-events: none; }
  .sd-lane { position: absolute; left: 0; right: 0; height: 0;
    border-top: 1px dashed rgba(var(--sh-rgb), .3); }
  /* ============================================================
   * v89.103（老板「两方应该在同一片战场上战斗」）：泳道交错的侧栏 + 前线三线
   * ------------------------------------------------------------
   * 沙盘改用**共享距离轴**后，两军会在同一 x 上照面 —— 泳道因此交错
   * （我方偶数道 / 敌方奇数道，见 ui.sdLaneOf）。侧栏行随之改成"两条泳道一行"：
   *   我方行内容**贴上看**（对齐本方泳道）、敌方行内容**贴下看**，
   * 这样左中右三列的行永远对得上，而兵牌不会互相遮住。
   * ============================================================ */
  .sd-mine .sd-row { height: calc(var(--lane) * 2); align-items: flex-start; }
  .sd-foe .sd-row { height: calc(var(--lane) * 2); align-items: flex-end; }
  /* 前线（我方/敌方各一条，画在"最前部队前方"）；两军接触后合成一条接触线 */
  .sd-fl { position: absolute; top: 0; bottom: 0; width: 0; pointer-events: none;
    border-left: 2px dashed rgba(var(--gold-soft-rgb), .5);
    transition: left .5s cubic-bezier(.4, .8, .4, 1); }
  .sd-fl span { position: absolute; top: 2px; left: 4px; font-size: var(--fs-cap);
    white-space: nowrap; color: var(--gold-light); opacity: .8; }
  .sd-fl.def { border-left-color: rgba(var(--foe-rgb),.55); }
  .sd-fl.def span { left: auto; right: 4px; color: var(--red-light); }
  .sd-fl.hit { border-left-style: solid; border-left-color: var(--amber);
    box-shadow: 0 0 10px rgba(var(--contact-rgb),.45); }
  .sd-fl.hit span { color: var(--amber); font-weight: 700; opacity: 1; }
  .sd-fl.broke { border-left-color: var(--red-light); box-shadow: 0 0 12px rgba(var(--foe-rgb),.55); }
  .sd-fl.broke span { color: var(--red-light); opacity: 1; }
  .sd-fl.hide { display: none; }
  .sd-tok { position: absolute; transform: translateX(-50%); display: flex; align-items: center; gap: var(--sp-1);
    padding: var(--sp-hair) var(--sp-2); border-radius: var(--r-lg); font-size: var(--fs-cap); white-space: nowrap;
    transition: left .5s cubic-bezier(.4, .8, .4, 1); }
  .sd-tok .sd-tico svg, .sd-tok .sd-tico img { width: 18px; height: 18px; vertical-align: middle; }
  .sd-tok.big .sd-tico svg, .sd-tok.big .sd-tico img { width: 22px; height: 22px; }
  .sd-tok b { color: var(--gold-light); font-variant-numeric: tabular-nums; }
  .sd-tok.atk { background: rgba(var(--gold-soft-rgb), .18); border: 1px solid rgba(var(--gold-soft-rgb), .52); }
  .sd-tok.def { background: rgba(var(--foe-rgb),.18); border: 1px solid rgba(var(--foe-rgb),.5); }
  .sd-tok.def b { color: var(--red-light); }
  .sd-tok.hit { animation: btHit .36s ease; }
  .sd-tok.dead { opacity: .42; filter: grayscale(.7); }
  .sd-castle { position: absolute; right: 6px; top: 3px; font-size: var(--fs-cap); color: var(--gold-light); }
  /* 攻城时的城墙（右缘，纯画面）：竖着的窄条，压暗以免抢戏 */
  .sd-wall { position: absolute; right: 0; top: 0; bottom: 0; height: 100%; width: 34px;
    object-fit: cover; opacity: .38; pointer-events: none; }
  .sd-scale { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: space-between;
    padding: 0 var(--sp-2); font-size: var(--fs-cap); color: var(--text-dim); opacity: .5; pointer-events: none; }
  .sd-log { margin-top: var(--sp-2); height: 96px; overflow-y: auto; background: rgba(var(--sh-rgb), .3);
    border-radius: var(--r-lg); padding: var(--sp-1) var(--sp-3); font-size: var(--fs-sub); line-height: var(--lh-body); }
  .sd-line { color: var(--text-dim); }
  .sd-line:last-child { color: var(--gold-light); }
  .sd-fin { color: var(--amber); font-weight: 700; }
  .sd-foot { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-3);
    padding-top: var(--sp-3); border-top: 1px solid var(--line-strong); }
  .sd-foot .rp-range { flex: 1; min-width: 140px; }

  /* ============================================================
   * v89.88（老板需求 5）：界面手感统一 —— 焦点可见 / 弹窗入场 / 动效降级
   * ------------------------------------------------------------
   * 审计先行（只补真缺口，不动既有令牌体系）：
   *   · 全站只有 2 处自定义焦点样式 → 键盘走查时按钮/页签"看不出焦点在哪"；
   *   · 弹窗无入场反馈（瞬开瞬关，层级变化没有"出现感"）；
   *   · prefers-reduced-motion 只覆盖了公文徽标闪烁 —— 减少动态的用户
   *     不该被任何入场/过渡打扰。
   * ============================================================ */
  /* ① 键盘焦点：全站统一金色焦点环（鼠标点击不显示，键盘/读屏才显示） */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 1px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold-light); outline-offset: 0;
  }
  /* ② 弹窗入场：遮罩淡入 + 面板 7px 上浮（只动 opacity/transform，GPU 合成） */
  .modal-mask { animation: mModalIn .13s ease-out; }
  @keyframes mModalIn { from { opacity: 0; } }
  .modal-mask > * { animation: mModalRise .15s cubic-bezier(.16,1,.3,1); }
  @keyframes mModalRise { from { opacity: 0; transform: translateY(7px) scale(.985); } }
  /* v89.117（老板「点击操作时会闪烁」）：入场动画**只在开窗那一次**播。
     ui.openModal 现在同级重绘只换 inner-panel 内容（元素不重建 → 动画本就不会重播），
     这两条是**兜底**：万一路径上重建了 mask/弹窗体，也别再闪一次。 */
  .modal-mask.no-anim, .modal-mask.no-anim > * { animation: none !important; }
  /* 右上角 ×：有上级时是「返回」（ui._paintModalX 改 title），视觉上加一个"返回"意符 */
  .modal-x.has-up::after { content: '↩'; position: absolute; right: 30px; top: 4px;
    font-size: var(--fs-cap); color: var(--gold-light); pointer-events: none; }
  /* ③ 页签图标：透明度过渡（原来只有 hover/选中两态硬切） */
  .topnav .tab .nav-ico { transition: opacity .15s; }
  /* ④ 动效降级：系统偏好"减少动态效果"→ 全站过渡/动画归零 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

<!-- 创建角色界面 -->
<div class="create-screen" id="screen-create">
  <div class="create-box wood-frame">
    <div class="inner-panel">
      <div class="gold-heading">创建城池</div>
      <div class="create-inner">
        <div>
          <div class="avatar-select">
            <div class="ui-sub" style="margin-bottom:6px;">选择头像</div>
            <div class="avatar-big" id="create-avatar">🧔</div>
            <div class="avatar-nav">
              <div class="arrow" data-action="avatar-prev">◀</div>
              <div class="arrow" data-action="avatar-next">▶</div>
            </div>
            <div class="gender-toggle">
              <div class="guse active" data-gender="male" data-action="gender-set">男</div>
              <div class="guse" data-gender="female" data-action="gender-set">女</div>
            </div>
          </div>
        </div>
        <div class="create-form">
          <div class="field"><label>君主名字</label><input type="text" id="create-name" maxlength="12" placeholder="输入你的名字"></div>
          <div class="field"><label>城池归属</label>
            <!-- v22（需求 1）：下拉框改为点选按钮组；隐藏域保留原 id，读取端不用改 -->
            <input type="hidden" id="create-region" value="random">
            <!-- v70（老板需求 5）：「城池归属应归属到州城所辖范围内，目前几个选项不太 OK」——
                 旧的「北方/中原/江南」只是三句文案（从不影响落位）；现在给出**十三州**，
                 选哪个州，出生城就落在该州州治近旁（GAME.pickStartPos，就近归属同一判据）。 -->
            <span class="chips" style="flex:1;flex-wrap:wrap;">
              <span class="chip on" data-action="chip-set" data-v="random" data-target="create-region" data-after="region">随机</span>
              <span class="chip" data-action="chip-set" data-v="司隶" data-target="create-region" data-after="region">司隶</span>
              <span class="chip" data-action="chip-set" data-v="兖州" data-target="create-region" data-after="region">兖州</span>
              <span class="chip" data-action="chip-set" data-v="豫州" data-target="create-region" data-after="region">豫州</span>
              <span class="chip" data-action="chip-set" data-v="徐州" data-target="create-region" data-after="region">徐州</span>
              <span class="chip" data-action="chip-set" data-v="青州" data-target="create-region" data-after="region">青州</span>
              <span class="chip" data-action="chip-set" data-v="冀州" data-target="create-region" data-after="region">冀州</span>
              <span class="chip" data-action="chip-set" data-v="幽州" data-target="create-region" data-after="region">幽州</span>
              <span class="chip" data-action="chip-set" data-v="并州" data-target="create-region" data-after="region">并州</span>
              <span class="chip" data-action="chip-set" data-v="凉州" data-target="create-region" data-after="region">凉州</span>
              <span class="chip" data-action="chip-set" data-v="益州" data-target="create-region" data-after="region">益州</span>
              <span class="chip" data-action="chip-set" data-v="荆州" data-target="create-region" data-after="region">荆州</span>
              <span class="chip" data-action="chip-set" data-v="扬州" data-target="create-region" data-after="region">扬州</span>
              <span class="chip" data-action="chip-set" data-v="交州" data-target="create-region" data-after="region">交州</span>
            </span>
          </div>
          <div class="summary-box" id="create-summary">
            君主数：0 &nbsp; 城池数：0 &nbsp; 拥挤度：0%<br>
            <span id="create-map-preview">（选择归属后随机生成初始城池位置）</span>
          </div>
          <div class="create-actions">
            <button class="btn gold lg hidden" id="create-continue" data-action="create-continue">继续上次的游戏</button>
            <button class="btn lg" id="create-start" data-action="create-start">开始新的征程</button>
            <!-- v67：存档管理放**首页**，因为"换台机器要导入存档"正是从首页开始的 -->
            <button class="btn" id="create-saves" data-action="open-saves">💾 存档管理</button>
          </div>
          <div class="create-save-note" id="create-save-note"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 主游戏界面 -->
<div id="screen-game" class="hidden">
  <!-- 顶部导航 -->
  <!-- v19：菜单按**类型分组**，同类型相邻、不同类型以竖线分隔
       ① 场景：城池 / 地图   ② 军事：将领 / 行军
       ③ 成长：任务 / 商城 / 爵位   ④ 记录：史册 / 公文   ⑤ 系统：设置 / 存档 / 新游戏
       原「公告」菜单已取消，内容并入「公文」 -->
  <div class="topnav" id="topnav">
    <!-- v25（需求 10）：① 每个菜单加手绘线描图标（JS 填 <i class="ti">）
         ② 任务与统计相邻  ③「爵位」不再是独立菜单，并入「君主」
         ④ 商城 / 背包由弹窗改为**整页视图**，与其他菜单一致 -->
    <div class="tab active" data-view="city"><i class="ti" data-nav="city"></i>城池</div>
    <div class="tab" data-view="ext"><i class="ti" data-nav="ext"></i>城外</div>
    <div class="tab" data-view="map"><i class="ti" data-nav="map"></i>地图</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="generals"><i class="ti" data-nav="general"></i>将领</div>
    <!-- v41（需求 3）：行军菜单**不再挂数值徽标** —— 老板指出「不要给在行军这个
         菜单名上产生数值」。顶栏徽标的语义是"有事情等你处理"（如任务可领取）；
         行军只是"部队在外面"，属状态不属待办。队列数在行军菜单里本来就有。 -->
    <div class="tab" data-view="marches"><i class="ti" data-nav="march"></i>军务</div>
    <!-- v89.104（老板）：「将将领，军务，任务放一起」—— 三者之间**不再插分隔条**；
         同时删掉「统计」菜单（见 ui.js 的退役注释）。 -->
    <div class="tab" data-view="tasks"><i class="ti" data-nav="quest"></i>任务<span class="tab-badge hidden" id="tab-badge-task"></span></div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="shop"><i class="ti" data-nav="shop"></i>商城</div>
    <div class="tab" data-view="bag"><i class="ti" data-nav="bag"></i>背包</div>
    <span class="nav-sep"></span>
    <div class="tab" data-view="story"><i class="ti" data-nav="story"></i>史册<span class="tab-badge hidden" id="tab-badge-story"></span></div>
    <!-- v89.104（老板）：「故事集做成另一个单独界面与待阅逸闻这个界面并列」 -->
    <div class="tab" data-view="stories"><i class="ti" data-nav="story"></i>故事集</div>
    <div class="tab" data-view="reports"><i class="ti" data-nav="doc"></i>公文</div>
    <span class="nav-sep"></span>
    <!-- v29（需求 5）：①「自动」独立成菜单，就放在「设置」旁边 ——
         自动升级/研究/出征是**一类**东西（让系统替你干活），挤在设置里既不好找、
         也没空间放"将领 / 兵力 / 目标 / 等级 / 类型 / 频率"这些参数。
         ② 顶栏的「存档 / 新游戏」删掉 —— 设置面板里本来就有同一对按钮，
         顶栏再摆一份只是让右手边常年挂着两个危险按钮。 -->
    <div class="tab" data-view="auto"><i class="ti" data-nav="auto"></i>自动</div>
    <div class="tab" data-view="settings"><i class="ti" data-nav="settings"></i>设置</div>
    <!-- v26（需求 3）：天时是**全局**信息（季节/天候/年号影响所有城池），
         放在城池属性里不合逻辑；margin-left:auto 把它推到最右。 -->
    <div class="nav-sky" id="nav-sky" title="天时（季节 / 天候 / 年号）"></div>
  </div>

  <div class="main">
    <!-- 左侧：君主栏 + 城池属性栏 + 资源栏（原版三段式信息区） -->
    <div class="auth-side">
      <div class="lord-card">
        <!-- ① 君主栏 -->
        <!-- v25（需求 9）：头像换成程序化立绘（不再是 emoji）；「城池 N 城」这类统计从这一栏删掉。
             v81（老板）：「官职这行放玩家名称，现在的名称位置去掉」—— 游戏里没有官职体系，
             该行退役、君主名并入信息表首行；旧的头像旁名称列一并撤除。
             v89.7（老板「头像可更换」）：头像本身成为更换入口（点它进头像池点选）。 -->
        <div class="lord-head">
          <div class="lord-portrait" id="lord-avatar" data-action="open-avatar-pick" title="点击更换头像"></div>
          <div class="lord-meta">
            <div class="row mrow-name"><span class="name" id="lord-name">—</span></div>
            <div class="row"><span>声望</span><span id="lord-rep">0</span></div>
            <div class="row"><span>爵位</span><span id="lord-rank">0</span></div>
          </div>
        </div>
        <!-- v20（需求 6）：背包已移至顶栏；「任务」与顶栏重复，一并移除 -->
        <div class="side-btnrow">
          <div class="sbtn" data-action="open-lord">君主</div>
        </div>

        <!-- ② 城池属性栏 -->
        <div class="side-block">
          <div class="side-title">
            <span>城池属性</span>
            <!-- v77（老板）：「城池属性右边的 3 个按钮以及相应的计算链就不要了
                 （建筑信息，资源生产，附属野地）」——三个入口整条退役。
                 附属野地改从**资源区的下拉框**进（见 #wild-pick-host）。 -->
            <span class="side-quick"></span>
          </div>
          <!-- v53：城池清单**单独成一个静态节点**，不再拼进 #city-attrs 的 html ——
               主循环每秒重绘城池属性，若把这个下拉框一起换掉，展开的列表会立刻合上
               （老板："点出来列表马上收回去了"）。它只在城池清单/当前城池变化时才重建。 -->
          <div class="city-switch-host" id="city-switch-host"></div>
          <div class="side-body" id="city-attrs"></div>
        </div>

        <!-- v27（需求 1）：原「城池操作」板块已删除 ——
             征收在官府、显示比例在设置、岁贡在名城官府，这一栏只剩"切换城池"；
             而切城已经并进「城池属性」顶部（多城时才出现），
             单独占一个带标题的板块既浪费纵向空间、又让侧栏出现滚动条。 -->

        <!-- ③ 资源栏（每项带 + 快捷道具） -->
        <div class="side-block">
          <div class="side-title"><span>资源</span><span class="side-quick" id="res-prod-hint"></span></div>
          <!-- v77（老板）：「资源这里的备注：本城 新城池改成附属野地 下拉框」——
               独立静态节点（同 #city-switch-host 的做法）：主循环每秒重绘资源栏，
               若把下拉框拼进 #res-bar，展开的列表会每秒被合上。 -->
          <div class="wild-pick-host" id="wild-pick-host"></div>
          <div class="side-body" id="res-bar"></div>
          <!-- v16：资源下方固定驻军栏 -->
          <div class="garrison-bar" id="garrison-bar"></div>
        </div>
      </div>
    </div>

    <!-- 中央 -->
    <div class="central">
      <!-- v26（需求 5）：城内 / 城外 已提升为顶栏菜单（城池=城内），
           中央不再需要子页签那一行 —— 它正是把棋盘往下挤的那 30px。 -->
      <div class="view-box" id="view-container"></div>
    </div>
  </div>

  <!-- v29（需求 3/4）：底部固定导航条 —— 所有「首页/上页/页码/下页/末页」
       统一在这里渲染（见 ui.pagerHTML / ui.paintBottom）。
       它挂在 .main 之外，所以不会被内容滚动带着走；高度固定，翻页时页面不抖。 -->
  <div class="bottombar" id="bottom-bar"></div>

  <!-- v16：底部消息栏与功能按钮已移除：
       消息 → 整合进「公文」菜单；商城/公告 → 移入顶栏；排行 → 取消；设置 → 顶栏已有 -->
</div>

<div class="toast" id="toast"></div>
<!-- v37（需求 2）：悬停浮层挂载点。放在 body 末尾 + position:fixed + z-index 9000 ——
     它是全站最高的一层，且不受任何容器 overflow/transform 影响（父级 transform
     会把它变成局部层叠上下文并裁切，这正是旧浮层被压住/被裁的原因）。 -->
<div id="tip-layer" class="tip-layer" aria-hidden="true"></div>
<div id="modal-root"></div>
