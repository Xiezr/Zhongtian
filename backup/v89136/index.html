  .eq-name.none { color: var(--text-dim); font-weight: 400; }
  .eq-slotname { color: var(--text-dim); }
  /* v46（需求 3）：槽位改**正方形**（60px 宽 → 54×54），比原来小一圈。
     边长是算出来的：2×(边框 1 + 内边距 2) + 部位名 11 + 间隙 1 + 图标 22 + 间隙 1 + 装备名 11.6 ≈ 50.6，
     取 54 留 3px 余量。改这串里任何一个数（字号 / 图标 / 内边距）都要回来核对总高 ——
     槽位装不下会**静默变形**（flex 项被压缩到 0 高，不是报错，是看不见）。
     注意选择器必须写成 `.doll-slot.eq-cell`：后面有一条共享卡片几何
     `.q-card, .item-row, .eq-cell, … { padding: var(--sp-4) 即 10px; border-radius: var(--r-lg) }`，
     它与 `.doll-slot` **同权重 (0,1,0) 且更靠后** —— 只写 `.doll-slot` 时 padding 会被盖成 10px，
     槽内三行只剩 32px 可用（实测 clientH 52 / scrollH 57，装备名被压成 0 高）。
     `.eq-inv` 角标同理：全站只有一条 `right/bottom` 规则却从来没有 `position: absolute`，
     于是它一直当作普通流内元素占掉一整行（实测给 chest 多撑出 18px）。 */
  .doll-slot.eq-cell { padding: var(--sp-0); border-radius: var(--r-md); }
  /* v89.131：方槽 54→62、图标 22→28（跟随人形框放大；排版预算见下方
     "槽位内三行装得下" 的实算：2+4+11+1+28+1+11 = 58 ≤ 62，余 4px）。 */
  .doll-slot { position: absolute; width: 62px; height: 62px; margin-left: -31px;
    min-height: 0; gap: var(--sp-hair); z-index: 3; }
  /* ⚠ 这里**不能**加 overflow: hidden —— 背包存货角标（.eq-inv，right/bottom −3px）
     本来就设计成压在边框外，裁了就看不出"这件还有几件可换"。 */
  .doll-slot .eq-ico { width: 28px; height: 28px; margin-top: 0; }
  .doll-slot .eq-slotname { position: static; font-size: var(--fs-cap); line-height: var(--lh-1); letter-spacing: 0; }
  /* 字号一律走令牌（七档），不写裸像素 —— 槽位窄，用最小档 + 省略号 */
  .doll-slot .eq-name { font-size: var(--fs-cap); line-height: var(--lh-1); max-width: 100%; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .doll-slot.empty { background: rgba(var(--slab-0-rgb),.55); border-style: dashed; border-color: rgba(var(--gold-soft-rgb),.30); }
  .doll-slot.empty .eq-ico { opacity: .34; }
  .doll-slot:hover { z-index: 3; }
  /* v46 修正：这里以前只有 right/bottom，**没有 position: absolute** ——
     角标于是当普通元素参与流内布局，每多一件背包存货就多占 18px 把槽位撑破。
     实测：给 chest 撑到 scrollH 75（clientH 52）。 */
  .doll-slot .eq-inv { position: absolute; right: -3px; bottom: -3px; line-height: var(--lh-body);
    font-size: var(--fs-cap); padding: 0 var(--sp-1); border-radius: var(--r-md);
    background: rgba(var(--gold-rgb),.22); border: 1px solid rgba(var(--gold-rgb),.45); opacity: 1; }
  .eq-gain { text-align: center; font-size: var(--fs-cap); color: var(--text-dim); margin-bottom: var(--sp-3); }
  .eq-gain i { font-style: normal; color: var(--green-ok); margin: 0 var(--sp-1); }
  .eq-gain .none { opacity: .7; }
  /* v60（需求 2）：装备提供的属性**逐行**显示（统帅 +775.5 / 勇武 +752.5 …）
     —— 老板原话「右侧把装备提供的属性分行显示即可」。
     数值一律右对齐，好一眼比出"哪一项是这件装备给的大头"。 */
  .eq-grows { display: flex; flex-direction: column; gap: var(--sp-0); margin-bottom: var(--sp-3); }
  .eq-grow { display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-cap); padding: var(--sp-hair) var(--sp-2); border-radius: var(--r-sm); background: var(--slab-1); }
  .eq-grow .k { color: var(--text-dim); }
  .eq-grow .v { color: var(--green-ok); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 套装进度 */
  .doll-set { border-top: 1px solid var(--sep-gold); padding-top: var(--sp-3); }
  .ds-empty { font-size: var(--fs-sub); color: var(--text-dim); }
  .ds-empty b { color: var(--gold-light); }
  .ds-block { margin-bottom: var(--sp-3); }
  .ds-head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-1); }
  .ds-name { font-size: var(--fs-body); font-weight: 800; color: var(--hero-tag); }
  .ds-n { font-size: var(--fs-cap); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .ds-next { font-size: var(--fs-cap); color: var(--amber); margin-left: auto; }
  .ds-next.done { color: var(--green-ok); }
  .ds-tiers { display: flex; flex-direction: column; gap: var(--sp-0); }
  .ds-tiers i { font-style: normal; font-size: var(--fs-cap); color: var(--text-dim); line-height: var(--lh-body); opacity: .62; }
  .ds-tiers i b { color: inherit; font-weight: 700; margin-right: var(--sp-1); }
  .ds-tiers i.on { color: var(--green-ok); opacity: 1; }
  /* v52：`.ds-list` / `.ds-chip` 随「其余套装」那段备注一起删（老板不要它）。
     删渲染必须带走样式，否则就是"样式还在、结构早没了"的死样式。 */
  /* v74：视口断点已撤（@media (max-width: 820px) .eq-doll-wrap） */

  /* ---- 打造界面筛选条（v38 · 需求 3/4）---- */
  /* v51：铁匠铺打造列表**独立列数（3 列）**，不再复用 `.shop-rows`。
     理由：那是"整页视图"的 4 列（内容宽 1000+，每格 317~375px）；
     打造面板是**弹窗**（内容宽 ~922px），4 列会把每格压到 198px，
     卡片的部位/造价/材料三行全部折行 → 卡片反被撑到 265px 高，越挤越高。
     3 列 → 每格约 300px，接近商城整页的舒适宽度，卡片更矮，一屏反而放得下更多。 */
  .forge-rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
  .forge-filter { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-1); }
  .forge-filter .ff-k { font-size: var(--fs-cap); color: var(--text-dim); letter-spacing: 1px; }
  .forge-filter .shop-cats { margin: 0; }
  .forge-set-note { margin-top: var(--sp-mid); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-lg);
    background: rgba(var(--sh-rgb),.24); border: 1px solid var(--line); }
  .fsn-t { color: var(--gold-light); margin-bottom: var(--sp-2); }   /* v82：字号/字重走分区标题共享 */
  .fsn-row { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-1); }
  .fsn-name { font-size: var(--fs-sub); font-weight: 700; color: var(--hero-tag); min-width: 62px; }
  .fsn-n { font-size: var(--fs-cap); color: var(--text-dim); }
  .fsn-tiers { font-size: var(--fs-cap); color: var(--text-dim); line-height: var(--lh-body); }
  .fsn-tiers i { font-style: normal; margin-right: var(--sp-3); }
  .fsn-tiers i::before { content: '·'; margin-right: var(--sp-1); color: var(--gold-dark); }

  /* ============ 背包（v13 分类 / 排序 / 拆解） ============ */
  .bag-sortbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    padding: var(--sp-2) var(--sp-4); margin-bottom: var(--sp-3); background: rgba(var(--sh-rgb),.24);
    border: 1px solid var(--gold-dark); border-radius: var(--r-md); }
  .bag-sortbar .lb { font-size: var(--fs-sub); color: var(--text-dim); margin-right: var(--sp-0); }
  .bag-sortbar .chip { font-size: var(--fs-sub); padding: var(--sp-1) var(--sp-4); border-radius: var(--r-xl); cursor: pointer;
    color: var(--text-dim); background: rgba(var(--sh-rgb),.3); border: 1px solid var(--sep-gold);
    transition: all .14s; }
  .bag-sortbar .chip:hover { color: var(--gold-light); border-color: rgba(var(--gold-soft-rgb),.6); }
  .bag-sortbar .chip.on { color: var(--ink-on-gold); background: var(--grad-gold);
    border-color: var(--gold-light); font-weight: 700; }
  .bag-sortbar .bag-total { margin-left: auto; font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700; }
  /* v29（需求 4）：背包内容交给 .view-box 统一滚动 ——
     旧版在这里又套了一层 52vh 的内部滚动条，翻页条还被推到内容最末尾，
     于是"背包得先滚到底才能翻页"。现在翻页条已移到屏幕下方固定条，
     内容区只需要一层滚动，也就不会再出现双滚动条。 */
  .bag-body { padding-right: var(--sp-1); }
  /* v39（需求 6）：图标 44 → 68px，与商城的 64px 靠拢；格子加宽后撑得住 */
  .bag-cell .bag-ico { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
  .bag-cell .bag-ico .ico { width: 100%; height: 100%; }
  /* v89.117：角标从"首字"改**将领全名** —— 放宽 + 省略号（格宽有限，长名不撑破） */
  .bag-cell .bag-worn { position: absolute; left: 4px; bottom: 3px; min-width: 15px; height: 15px; line-height: 15px;
    max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center; border-radius: var(--r-lg); background: rgba(var(--rank-liang-rgb),.85); color: var(--ink-on-gold);
    font-size: var(--fs-cap); font-weight: 800; padding: 0 var(--sp-1); }
  /* v89.117 铁匠铺：整卡点选（打造键收敛到底部后的选中提示） */
  .item-row .ir-pick { font-size: var(--fs-cap); color: var(--text-dim); border: 1px dashed var(--line-strong);
    border-radius: var(--r-md); padding: 1px var(--sp-3); }
  .item-row.on { border-color: rgba(var(--gold-soft-rgb), .85);
    box-shadow: 0 0 0 1px rgba(var(--gold-soft-rgb), .45), 0 0 14px rgba(var(--gold-soft-rgb), .22); }
  .item-row.on .ir-pick { color: var(--gold-light); border-color: rgba(var(--gold-soft-rgb), .8); border-style: solid; }
  .pick-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: center; margin: var(--sp-2) 0 var(--sp-1); }
  .pick-row .btn.sm { font-size: var(--fs-sub); padding: var(--sp-1) var(--sp-4); }

  /* 会话日志（保留至本次退出，可滚动） */
  .bb-log { flex: 1; min-width: 0; max-height: 76px; overflow-y: auto; font-size: var(--fs-sub); line-height: var(--lh-loose);
    padding-right: var(--sp-2); scrollbar-width: thin; }
  .bb-log .bb-line { white-space: pre-wrap; word-break: break-all; }
  .bb-log .bb-line.war { color: var(--red-light); }
  .bb-log .bb-line.task { color: var(--tag-govern); }
  .bb-log::-webkit-scrollbar { width: 7px; }
  .bb-log::-webkit-scrollbar-thumb { background: rgba(var(--gold-rgb),.35); border-radius: var(--r-sm); }
  .bb-log::-webkit-scrollbar-track { background: rgba(var(--sh-rgb),.25); }

  /* ============ 将领资质徽章 / 打造 ============ */
  .rank-badge { display: inline-block; font-size: var(--fs-cap); font-weight: 700; padding: var(--sp-hair) var(--sp-2); border-radius: var(--r-sm);
    border: 1px solid currentColor; opacity: .95; letter-spacing: .3px; white-space: nowrap; }
  .rank-badge.r-fan    { color: var(--rank-fan); background: rgba(var(--rank-fan-rgb),.12); }
  .rank-badge.r-liang  { color: var(--rank-liang); background: rgba(var(--rank-liang-rgb),.13); }
  .rank-badge.r-ying   { color: var(--rank-ying); background: rgba(var(--rank-ying-rgb),.14); }
  .rank-badge.r-ming   { color: var(--rank-ming); background: rgba(var(--rank-ming-rgb),.15); box-shadow: 0 0 8px rgba(var(--rank-ming-rgb),.25); }
  .rank-badge.r-tian   { color: var(--amber); background: rgba(var(--amber-rgb),.16); box-shadow: 0 0 10px rgba(var(--amber-rgb),.35);
    animation: rankPulse 2.4s ease-in-out infinite; }
  @keyframes rankPulse { 0%,100% { box-shadow: 0 0 8px rgba(var(--amber-rgb),.25); } 50% { box-shadow: 0 0 16px rgba(var(--amber-rgb),.6); } }
  /* v75（老板）：「地下的各资质四维，成长和概率也不显示」——
     资质一览（.rk-box / .rk-row）随 rankTable 一并退役。 */
  .forge-q { font-size: var(--fs-h3); font-weight: 700; color: var(--gold-light); margin: var(--sp-4) 0 var(--sp-1); padding-bottom: var(--sp-1);
    border-bottom: 1px dashed var(--sep-gold); }
  /* 野地资源合计 */
  .wild-total { display: flex; flex-wrap: wrap; gap: var(--sp-mid); align-items: center; justify-content: center; margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4); background: rgba(var(--sh-rgb),.22); border: 1px solid var(--gold-dark); border-radius: var(--r-md); }
  .wild-res { font-size: var(--fs-body); color: var(--text-dim); }
  .wild-res b { color: var(--green-ok); font-weight: 700; }
  /* v74：视口断点已撤（@media (max-width: 900px) .story-grid） */

  /* ============ 中央视图 ============ */
  .view-box {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: var(--r-lg);
    /* v19：高度由上方「固定界面尺寸」规则统一给出（含小屏降档）。
       此处**不得**再设 min-height —— 否则小屏降档到 436px 会被 560px 顶回去，
       「固定尺寸」失效、整页又开始忽长忽短。 */
    min-height: 0;
    position: relative;
    box-shadow: inset 0 0 40px rgba(var(--sh-rgb),.5);
  }

  /* ============ 城内建设 grid ============ */
  .city-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--sp-4);
    padding: var(--sp-6);
  }
  /* v20：旧 .build-cell 方块样式已删除（该标记自 v16 起不再渲染） */
  /* 资源小图标（侧栏/资源行） */
  .rico { display: inline-block; width: 17px; height: 17px; vertical-align: -3px; margin-right: var(--sp-0); }
  .rico .ico { width: 17px; height: 17px; display: block; filter: drop-shadow(0 1px 1px rgba(var(--sh-rgb),.5)); }
  /* 兵种卡图标 */
  /* v37（需求 1）：成本行移到悬停后，图标从 52px 放大到 84px */
  .troop-card .ticon .ico { width: 100%; height: 100%; max-width: 84px; max-height: 84px; }
  .build-cell .pbar i {
    display: block; height: 100%; width: 0;
    background: var(--grad-kbar);
    transition: width .5s linear;
  }

  /* ============ 地图 canvas 容器 ============ */
  /* ---- 地图（v24 · 需求 2/3）：版面只留棋盘，导航与坐标收进右下角浮标 ---- */
  /* v26（需求 4）：观察框改 12×8，画布变矮，浮标让位也随之收窄 */
  /* v76（老板）：导航迁入底部条后，这里不再需要为右下浮标让位（78px 撤） */
  .map-wrap { position: relative; padding: var(--sp-5); }
  /* v76（老板）：「把地图的导航栏（上下左右，坐标之类）放到这个导航范围内」——
     地图导航迁入**底部固定导航条**（.bottombar，由 ui.mapHTML 登记、paintBottom 落画），
     改为静态排布、融入条内（条高 46px，v44 的"一行"布局原样保留）。
     历史：v24 收进右下浮标 → v45 浮标内水平居中 → v76 移入底部条。 */
  .map-dock {
    display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-0) var(--sp-1);
    max-width: 100%;
  }
  .map-pad { display: grid; grid-template-columns: repeat(4, 28px); grid-template-rows: 26px; gap: var(--sp-1); }
  .map-btn { background: linear-gradient(180deg,var(--btn-face-1),var(--btn-face-2)); color: var(--gold-light); border: 1px solid var(--gold-dark);
    border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-body); font-weight: 700; line-height: var(--lh-1);
    box-shadow: 0 2px 4px rgba(var(--sh-rgb),.4), inset 0 1px 0 rgba(var(--hl-rgb),.1); }
  .map-btn:hover { background: linear-gradient(180deg,var(--btn-hi-1),var(--btn-hi-2)); }
  .map-btn:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(var(--sh-rgb),.5); }
  /* v44：四个方向键改**单行**（◀ ▲ ▼ ▶），不再摆成十字占两行 */
  .map-btn.left { grid-column: 1; }
  .map-btn.up { grid-column: 2; }
  .map-btn.down { grid-column: 3; }
  .map-btn.right { grid-column: 4; }
  .mk-sep { width: 1px; height: 20px; background: var(--line-strong); flex: none; }
  #map-gx, #map-gy { width: 58px; padding: var(--sp-1) var(--sp-2); background: var(--slab-1); color: var(--text);
    border: 1px solid var(--gold-dark); border-radius: var(--r-sm); text-align: center;
    font-size: var(--fs-sub); font-variant-numeric: tabular-nums; }
  .mk-lbl { color: var(--text-dim); font-size: var(--fs-sub); }
  .map-info { font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 点选坐标用信息蓝，和"视野区间"（金）区分开 */
  .map-info.mk-pick { color: var(--blue-info); }
  #mapCanvas { display: block; margin: 0 auto; max-width: 100%; border: 3px solid var(--gold-dark); border-radius: var(--r-lg);
    background: var(--map-ground); box-shadow: 0 6px 18px rgba(var(--sh-rgb),.5), inset 0 0 0 1px rgba(var(--sh-rgb),.45);
    /* v89.88：大地图整块可点（点城池/据点/野地都会出面板）——
       原来用的是默认箭头光标，"能不能点"全靠猜。 */
    cursor: pointer; }
  /* ============ v85（老板）：底部缩略地图 + 天下大势面板 ============ */
  /* 为条尾缩略图提供定位上下文（单独成条，不动原 .bottombar 块的 46px 高度） */
  .bottombar { position: relative; padding-right: 56px; }
  .bb-mini {
    position: absolute; right: 10px; top: 3px; width: 40px; height: 40px; padding: 0;
    background: var(--slab-0); border: 1px solid var(--gold-dark); border-radius: var(--r-md);
    cursor: pointer; overflow: hidden; line-height: 0;
    box-shadow: 0 2px 6px rgba(var(--sh-rgb), .45);
  }
  .bb-mini:hover { border-color: var(--gold-light); }
  .bb-mini canvas { width: 38px; height: 38px; display: block; }
  /* 天下大势：方形缩略图（内部 1000×1000 高清背衬，显示 ≤500px） */
  .mini-wrap { display: flex; justify-content: center; margin: var(--sp-3) 0 var(--sp-1);
    position: relative; }   /* v89.132：波纹层（.mini-pulse）的定位上下文 */
  .mini-wrap canvas {
    width: min(500px, 68vw); height: auto; aspect-ratio: 1 / 1;
    border: 2px solid var(--gold-dark); border-radius: var(--r-md); background: var(--slab-0);
  }
  .mini-legend {
    text-align: center; font-size: var(--fs-sub); color: var(--text-dim);
    margin: var(--sp-2) 0 var(--sp-0); letter-spacing: .04em;
  }
  .mini-legend { --lg-state: #f0d060; --lg-jun: #cfcfc0; --lg-cap: #ff5a40;
                 --lg-zhou: #ffd76a; --lg-jun-c: #f2ead0; --lg-cty: #9fe08a;
                 --lg-me: #ff3a2a; }   /* v89.132：我城点金→红（与 miniMeDot 同色） */
  .mini-legend b { font-weight: 700; }
  .mini-legend .lg-state { color: var(--lg-state); }
  .mini-legend .lg-jun { color: var(--lg-jun); }
  .mini-legend .lg-cap { color: var(--lg-cap); }
  .mini-legend .lg-zhou { color: var(--lg-zhou); }
  .mini-legend .lg-jun-c { color: var(--lg-jun-c); }
  .mini-legend .lg-cty { color: var(--lg-cty); }
  .mini-legend .lg-me { color: var(--lg-me); }

  /* v89.68（老板：缩略图加筛选按钮，三级下钻 州城/郡城/县城）——
     筛选行放在标题与地图之间：层级永远在，州/郡下拉**按层级级联出现**（不占空位）。 */
  .mini-filter { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4);
    justify-content: center; margin: var(--sp-1) 0 var(--sp-2); font-size: var(--fs-sub); }
  .mini-filter > label { color: var(--text-dim); }
  .mini-filter > select { padding: var(--sp-0) var(--sp-2); background: var(--slab-1); color: var(--text);
    border: 1px solid var(--gold-dark); border-radius: var(--r-sm); font-size: var(--fs-sub); max-width: 240px; }
  .mini-filter .mf-hint { color: var(--gold-light); }

  /* ============ v89.47（老板三条）：天下大势 —— 满界面 / 大字城名 / 点选跳转 ============
     ① 满界面：新增 modal-max 档（铺满视口，只留 8px 呼吸）。
        画布是正方形、世界也是正方形 —— **高是瓶颈**，所以边长按可用高度反推，
        不去撑宽度（撑了也会留白，还挤出滚动条）。
     ② 城名与示意点：尺寸由 JS 按画布边长的比例给（ui.MINI_LABEL），CSS 不管字号 ——
        一处口径，38px 小图与满界面档共用。
     ③ 点选：cursor: crosshair + 图例尾的提示。
     `:has(> .mini-full)` 是让内容区变成 flex 列、画布才能吃掉剩余高度
     （与文件里 .bldg-foot / .bldg-bottom 同一套写法）。
     ⚠ modal-max 档位规则在下方「弹窗尺寸档位」处（必须排在 .modal 之后才不会被打回 660×620）。 */
  .modal .inner-panel:has(> .mini-full) { display: flex; flex-direction: column; }
  .modal .inner-panel:has(> .mini-full) > .gold-heading,
  .modal .inner-panel:has(> .mini-full) > .m-foot { flex: none; }
  .mini-full { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mini-full .mini-wrap { flex: 1; min-height: 0; margin: var(--sp-0) 0; }
  /* 画布边长 = min(容器宽, 视口高 − 弹窗上下件高度 190px)。190 = 框 10 + 内边距 24
     + 标题 56 + 图例 20 + 页脚 50 + 间隙 30（见 ui.fitMini 的同款反推，JS 才是准的，
     这里只是首帧/无 JS 时的兜底）。 */
  .mini-full .mini-wrap canvas {
    width: min(100%, calc(100vh - 190px)); height: auto; aspect-ratio: 1 / 1;
    cursor: crosshair; border-width: 3px;
  }
  /* v89.132（老板）：波纹层 —— 盖在底图上、居中对称；border/背景一概去掉，
     否则会继承上方两条 canvas 规则的金框（同特异性时本条后定义者胜）。 */
  .mini-wrap canvas.mini-pulse {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    pointer-events: none; border: none; background: transparent;
  }
  .mini-full .mini-legend { margin: var(--sp-0) 0 0; }
  .mini-hit { color: var(--gold-light); margin-left: var(--sp-4); }

  /* v27（需求 6）：数字输入框的原生上下箭头也去掉 —— 它同样是个"小下拉"，
     在暗色界面里尤其突兀；数量增减交给面板上的「最大」「+/-」按钮，
     或直接键盘输入。 */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  /* ============================================================
   * 战斗场景（v27 · 需求 5）：文字战场条带
   * ------------------------------------------------------------
   * 一行就是一个回合：左端是我军、右端是敌军，中间的点是两军之间的
   * 间距。字体用等宽字（monospace）—— 条带的对齐全靠它，
   * 换成正文字体后每行长短会错开，战场就不成"网格"了。
   * ============================================================ */
  .bt-scene { background: rgba(var(--sh-rgb),.34); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin: var(--sp-1) 0 var(--sp-0); overflow-x: auto; }
  .bt-scene .bt-head { display: flex; justify-content: space-between; align-items: center;
    font-size: var(--fs-cap); color: var(--text-dim); letter-spacing: 1px;
    padding-bottom: var(--sp-1); margin-bottom: var(--sp-2); border-bottom: 1px dashed rgba(var(--gold-rgb),.22); }
  .bt-scene .bt-head .bt-scale { color: var(--gold-light); }
  .bt-row { display: flex; align-items: center; gap: var(--sp-3); line-height: var(--lh-body); }
  .bt-row .bt-r { flex: none; width: 20px; text-align: right; color: var(--text-dim);
    font-size: var(--fs-cap); font-variant-numeric: tabular-nums; }
  .bt-row .bt-strip { flex: none; font-family: ui-monospace, Consolas, 'Courier New', monospace;
    font-size: var(--fs-cap); letter-spacing: 0; white-space: nowrap; }
  .bt-row .bt-strip i { color: var(--strip-troop); font-style: normal; text-shadow: 0 0 5px rgba(var(--strip-troop-rgb),.45); }
  .bt-row .bt-strip u { color: var(--strip-gap); text-decoration: none; }
  .bt-row .bt-n { flex: none; color: var(--parchment); font-size: var(--fs-cap);
    font-variant-numeric: tabular-nums; }
  .bt-row .bt-g { flex: none; color: var(--text-dim); font-size: var(--fs-cap);
    font-variant-numeric: tabular-nums; }
  .bt-gap { color: var(--text-dim); font-size: var(--fs-cap); padding-left: var(--sp-7); }
  /* ============================================================
   * v89.94（B2 · E3/E1）：战报分回合回放 + 围攻/以少胜多标记 + 战法三选
   * ------------------------------------------------------------
   * 帧内容复用上面 .bt-row 的一套（条带/兵力/间距），避免第二套战场样式。
   * ============================================================ */
  .rp-ev { color: var(--text-dim); font-size: var(--fs-cap); line-height: var(--lh-body);
    padding: var(--sp-0) 0 var(--sp-2) var(--sp-7); border-bottom: 1px dotted rgba(var(--gold-rgb),.12); }
  .rp-ctl { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-2) 0 var(--sp-1); }
  .rp-range { flex: 1; min-width: 120px; accent-color: var(--gold-dark); }
  .rp-pos { flex: none; color: var(--text-dim); font-size: var(--fs-cap);
    font-variant-numeric: tabular-nums; }
  .rp-keys { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center;
    color: var(--text-dim); font-size: var(--fs-cap); margin-bottom: var(--sp-1); }
  .rp-key { cursor: pointer; }
  .rp-under { color: var(--gold-light); font-size: var(--fs-sub); text-align: center;
    padding: var(--sp-1) 0 var(--sp-0); }
  .exp-ops-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-1) 0 0; }
  .exp-ops-lab { flex: none; color: var(--gold-light); font-size: var(--fs-sub); }
  .exp-ops-row .ch.off { opacity: .38; cursor: not-allowed; }
  .bt-log { max-height: 168px; overflow-y: auto; }
  /* v89.112：战报详情 · 回合纪要专用容器。
     ⚠️ 与上面 .bt-log（沙盘"战斗中实时日志"小窗）**不是一回事**：那是地图上浮窗，
     168px 是设计；这里是弹窗详情页，配 ui.modalPage 翻页，无中间高度。 */
  .rp-log { display: flex; flex-direction: column; gap: var(--sp-hair); }
  .bt-log .bt-line { font-size: var(--fs-sub); color: var(--text-dim); line-height: var(--lh-loose);
    padding: var(--sp-0) 0; border-bottom: 1px dotted rgba(var(--gold-rgb),.12); }

  /* ============ 表格 ============ */
  .tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
  .tbl th {
    background: linear-gradient(180deg, var(--surface-2b), var(--btn-face-2));
    color: var(--gold-light); padding: var(--sp-3); font-weight: 700; letter-spacing: 1px;
    border: 1px solid var(--line); text-align: left;
  }
  .tbl td { padding: var(--sp-3); border: 1px solid var(--line); background: rgba(var(--sh-rgb),.15); vertical-align: middle; }
  .tbl tr:nth-child(even) td { background: rgba(var(--sh-rgb),.05); }
  .tbl .ctr { text-align: center; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ============ 操作分区（v16） ============
     正向操作与「拆毁/取消」类操作分区展示，避免误点与误操作 */
  .op-zone { margin-top: var(--sp-mid); padding: var(--sp-4) var(--sp-mid); border: 1px solid var(--line-strong);
    border-radius: var(--r-lg); background: rgba(var(--hl-rgb),.02); }
  .op-zone-t { margin-bottom: var(--sp-3); }   /* v82：字色/字号/字距走分区标题共享（原 12px 灰字） */
  .op-row { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
  .op-zone.danger { border-color: rgba(var(--red-light-rgb),.5); background: rgba(var(--red-light-rgb),.07); }
  .op-zone.danger .op-zone-t { color: var(--red-light); }
  .op-hint { color: var(--text-dim); font-size: var(--fs-sub); }
  /* v76（老板）：「升级，拆除，移动/交换放在同一行上，并进行你的设计小巧思」——
     三键同排、等宽；每键下方一行小字说明后果（费用 / 降级去向 / 用途）。
     （v28 的"拆毁左、移动右分居两端"随 v76 的三键同排一并退役 —— 老板点名要同行。） */
  .bldg-acts { display: flex; gap: var(--sp-3); margin-top: var(--sp-4); }
  .bldg-acts .bldg-act { flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
    gap: var(--sp-hair); padding: var(--sp-2) var(--sp-1); line-height: var(--lh-tight); }
  .bldg-acts .bldg-act .ba-sub { font-size: var(--fs-cap); font-weight: 400; opacity: .72; }
  /* v68（弹窗统一）：与 m-foot 同规格（实线）—— 改前是 dashed，四套页脚里唯一的例外。
     三格摆位保留 v28 的设计：危险（左）· 关闭（中，天然误点缓冲）· 管理（右）。 */
  /* v73（老板）：「取消升级和关闭按钮要固定在底部，对不同建筑来说位置都要固定」——
      **吸底**：正文再长，底栏也钉在弹窗下沿（sticky），六处建筑弹窗同一位置。
      几何校准（真机实测）：左右负边距 = .inner-panel 的 padding(12px) → 出血到面板边缘；
      `bottom: -12px` + 底部垫 22px → 钉在**面板下沿**（实测底沿差 13px → 1px，三档滚动全对齐）。 */
  /* v76（老板）：「建筑界面的关闭按钮在弹窗界面的最底部」—— 操作三键上移后，
     底栏只剩「关闭」一枚，居中摆放（原 space-between 三格摆位随三键同排退役）。 */
  .bldg-foot { display: flex; justify-content: center; align-items: center; gap: var(--sp-3);
    position: sticky; bottom: -12px; z-index: 3;
    margin: var(--sp-mid) -12px -12px; padding: var(--sp-3) var(--sp-mid) var(--sp-7);
    border-top: 1px solid var(--line-strong);
    background: var(--panel-bg);
    box-shadow: 0 -6px 12px rgba(var(--sh-rgb),.28); }
  .bldg-foot .btn.sm { font-size: var(--fs-cap); padding: var(--sp-1) var(--sp-3); }
  /* v76（老板）：「建筑界面的关闭按钮在弹窗界面的最底部」——
     内容短时关闭浮在中间（实测离弹窗底 284px），这里把带 .bldg-foot 的面板
     改纵向 flex，关闭用 margin-top:auto 吃空档、钉死在面板最下沿；
     内容超长时 sticky（v73）照旧接管。 */
  .modal .inner-panel:has(> .bldg-foot) { display: flex; flex-direction: column; }
  .modal .inner-panel:has(> .bldg-foot) > .bldg-foot { margin-top: auto; }
  /* v80（老板）：「升级，拆除（拆1级），移动/交换固定放在底部，关闭的上方」——
     三键与关闭合成一块**吸底操作区**（.bldg-bottom）：几何沿用 v73 校准值
     （出血到面板边缘 + 钉面板下沿），内容短时 margin-top:auto 贴底、长时 sticky 接管。 */
  .bldg-bottom { position: sticky; bottom: -12px; z-index: 3;
    margin: var(--sp-mid) -12px -12px; padding: var(--sp-3) var(--sp-mid) var(--sp-7);
    border-top: 1px solid var(--line-strong);
    background: var(--panel-bg);
    box-shadow: 0 -6px 12px rgba(var(--sh-rgb),.28); }
  .bldg-bottom .bldg-acts { margin-top: 0; }
  .bldg-bottom .bldg-foot { position: static; margin: var(--sp-3) 0 0; padding: 0;
    border-top: 0; background: transparent; box-shadow: none; }
  .modal .inner-panel:has(> .bldg-bottom) { display: flex; flex-direction: column; }
  .modal .inner-panel:has(> .bldg-bottom) > .bldg-bottom { margin-top: auto; }
  .op-done { color: var(--text-dim); font-size: var(--fs-sub); }
  /* v68（弹窗统一）：升级行专用 —— 费用靠左、按钮靠右（同一行对齐） */
  .op-row-between { justify-content: space-between; }
  .op-kv { color: var(--text-dim); font-size: var(--fs-sub); }
  .op-kv b { color: var(--text-strong); font-weight: 700; }
  /* 弹窗内进度条（沿用格子的 .pbar 结构） */
  .modal .pbar { height: 6px; border-radius: var(--r-sm); background: rgba(var(--sh-rgb),.6); overflow: hidden; }
  .modal .pbar i { display: block; height: 100%; border-radius: var(--r-sm);
    background: var(--grad-progress); transition: width .4s linear; }

  /* ============ 侧栏驻军栏（v16）============
     固定高度、固定位置；折叠状态默认展开 */
  .garrison-bar { margin: var(--sp-3) var(--sp-4) var(--sp-4); border: 1px solid var(--line-strong); border-radius: var(--r-md);
    background: rgba(var(--sh-rgb),.24); overflow: hidden; }
  .gb-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); cursor: pointer;
    font-size: var(--fs-sub); color: var(--gold-light); font-weight: 700; }
  .gb-head .gb-arrow { margin-left: auto; color: var(--text-dim); }
  /* v76（老板）：「左侧统计框没有到底」——驻军列表从固定 132px 改**撑满剩余高度**
     （左栏"铺满到底"的主力；兵多时列表内部照旧滚动）。 */
  /* v89.53（老板 09-19）：侧栏仅 283px 宽，原单列滚动「不够显示」。
     改为 2 列紧凑网格（每格 = 兵种名 + 数量），同高可见兵种数翻倍、名字完整可读。
     4 列会把「重装步兵 12,345」挤压/截断，故取 2 列；要更密把下方 repeat(2,…) 改 3/4。 */
  .gb-list { flex: 1 1 auto; min-height: 132px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-1) var(--sp-4);
    align-content: start; padding: var(--sp-0) var(--sp-3) var(--sp-3); }
  .gb-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2);
    font-size: var(--fs-sub); padding: var(--sp-0) 0; border-bottom: 1px dashed var(--line); }
  .gb-row .gb-n { color: var(--text); min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .gb-row .gb-c { color: var(--gold-light); font-variant-numeric: tabular-nums;
    text-align: right; flex: none; }
  .gb-empty { height: 132px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: var(--fs-sub); }

  /* ============ v20：布局 / 队列 / 对齐 / 浮层 ============ */

  /* 全局 hidden（JS 用 classList.toggle 控制显隐） */
  .hidden { display: none !important; }

  /* 侧栏隐藏时主区独占整宽（需求 7：只有城池视图显示左侧统计栏） */
  .main { transition: none; }
  .main.solo { grid-template-columns: 1fr; }
  .main.solo .auth-side { display: none; }

  /* 建造/募兵队列：迷你进度条 + 百分比（v24 起用于「公文 · 队列」与募兵面板） */
  .qbar {
    display: inline-block; width: 42px; height: 4px; border-radius: var(--r-xs);
    background: rgba(var(--sh-rgb),.5); overflow: hidden; vertical-align: middle;
  }
  .qbar i { display: block; height: 100%; border-radius: var(--r-xs);
    background: var(--grad-progress); transition: width .4s linear; }

  /* 资源行三列对齐（需求 10）：名称 / 存量 / 产量 各自固定列，数字右对齐 */
  .res-bar .res-line, #res-bar .res-line {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: var(--sp-3);
    column-gap: var(--sp-4);
  }
  #res-bar .res-line .lbl { text-align: left; white-space: nowrap; }
  /* v65（老板）：「规划一下显示得齐整一点」——
     flex 布局下各行"金额"的右缘取决于它右边还有什么（增速 / 加号 / 宝物徽标），
     于是**金额对不齐**（实测右缘 148 vs 169）。改成 grid：
     金额独占第一格（定宽右对齐）→ 五行金额右缘必然一致。
     宝物徽标改为绝对定位，免得它一出现又把金额挤左。 */
  #res-bar .res-line .val {
    /* v67（老板）：「总数和生产速度挨太近，分一下列」——
       存量 | 增速 各自成列：列宽定死 + 列间距 8px + 增速列左侧一条发丝竖线。
       实测（1440×900）：两列之间从 6px 拉到 8px + 8px 内边距 + 1px 竖线。 */
    display: grid; grid-template-columns: 74px 72px 1.1em;
    align-items: center; justify-content: end; column-gap: var(--sp-3);
    min-width: 0; position: relative;
  }
  #res-bar .res-line .amt {
    font-variant-numeric: tabular-nums; text-align: right; justify-self: end;
    /* v65（老板）：「规划一下显示得齐整一点」——
       定宽 + 右对齐，各行的数字右缘对齐（小数点在视觉上成一列）。
       v67：列宽 78 → 74（与增速列一起重排，见上面 .val 的注释）。 */
    min-width: 74px;
  }
  #res-bar .res-line .amt .amt-u {
    font-style: normal; font-size: var(--fs-cap); font-weight: 700;
    color: var(--text-dim); margin-left: var(--sp-hair);
  }
  #res-bar .res-line .rate-wrap {
    flex: none;
    /* v67（老板）：「分一下列」—— 增速列与存量列之间走一条发丝竖线 */
    border-left: 1px solid var(--line);
    padding-left: var(--sp-3);
  }
  /* v67：增速列自成一体 —— 左侧发丝竖线 + 内边距，宽度 62 → 72（容「+1,234.5/秒」） */
#res-bar .num-rate { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; display: inline-block; }

  /* ============================================================
   * v89.124（老板「人口增速也按小时显示。界面规划参考资源」）：
   * 人口行（城池属性区）与资源行**同款三列对齐** —— 名称 | 存量·上限 | 增速。
   * 列模板与资源行一致（56px 首列 + 增速列 72px 右对齐 + 1.1em 徽标空位），
   * 两行的增速列右缘因此逐像素对齐；增速列同样带发丝竖线分隔。 */
  #city-attrs .pop-line {
    /* 标签列 44px（比资源行的 56px 窄，给 .val 让出空间）——
       人口存量文本「2,880 / 7,200」比资源存量（「679.5万」）宽约 25px，
       56px 首列下 .val 只有 167px，装不下「存量 + 72px 增速列 + 1.1em 徽标位」
       → auto 列被压到 min-content、内容外溢（实测 rate 右缘 439 vs 359）。
       两行的标签都靠左（左缘一致，实测 140=140），列宽差 12px 不影响观感。 */
    display: grid; grid-template-columns: 44px 1fr auto;
    align-items: center; gap: var(--sp-3); column-gap: var(--sp-4);
  }
  #city-attrs .pop-line .val {
    /* 与资源行**同款内部模板**（auto 存量列 + 72px 增速列 + 1.1em 徽标位）——
       增速列右缘因此与资源行一致。第一列必须按内容宽（auto）：
       `1fr` 会吸收剩余宽、把 72px 列挤出行外（实测差 70px）。 */
    display: grid; grid-template-columns: auto 72px 1.1em;
    align-items: center; justify-content: end; column-gap: var(--sp-3);
    min-width: 0;
  }
  #city-attrs .pop-line .cap { text-align: right; }
  #city-attrs .pop-line .rate-wrap {
    border-left: 1px solid var(--line);
    padding-left: var(--sp-3);
  }
  #city-attrs .pop-line .num-rate {
    font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; display: inline-block;
  }

  /* ============================================================
   * v25（需求 12/13）：说明从"常驻一行"改为「触发式」
   *   · 悬停 → 浮层（桌面）
   *   · 点一下 → 小弹窗（平板没有 hover，光有浮层等于没给）
   * 用法：ui.help('说明文字')，直接拼在分区标题后面。
   * ============================================================ */
  .help-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: var(--sp-1); border-radius: 50%;
    border: 1px solid rgba(var(--gold-soft-rgb),.42); color: var(--gold-light);
    font-size: var(--fs-cap); font-weight: 700; line-height: var(--lh-1);
    cursor: help; opacity: .72; vertical-align: 1px;
  }
  .help-chip:hover { opacity: 1; border-color: var(--gold-light); background: rgba(var(--gold-soft-rgb),.12); }
  /* v37（需求 2）：悬停显示统一交给 .tip-layer（原先这里是 CSS ::after 浮层）。
     data-tip 保留为**内容源**，由 ui.tipFor / ui.tipShow 读取。 */
  /* 说明小弹窗 */
  .help-body { font-size: var(--fs-body); line-height: var(--lh-loose); color: var(--text); white-space: pre-line; }

  /* 产量构成明细（需求 11）：悬停显示，v37 起走统一的 .tip-layer */
  .rate-wrap { cursor: help; }

  /* ============================================================
   * 底部固定导航条（v29 · 需求 3 / 4）
   * ------------------------------------------------------------
   * 「首页 / 上页 / 页码 / 下页 / 末页」这类翻页控件不再跟着内容跑：
   *   · 固定高度 46px —— 有没有分页都不改变高度，页面不会因为翻页而抖一下；
   *   · 没有分页时**留空**（只显示一行极淡的占位），位置照留；
   *   · 内容区因此永远不必为了够到翻页按钮而滚动（旧版分页条在内容末尾，
   *     一屏装不下就得先滚到底）。
   * ============================================================ */
  .bottombar {
    flex: none; height: 46px; display: flex; align-items: center; justify-content: center;
    /* v89.52：左留白给最左的「🏷 名称」按钮（绝对定位），避免与居中分页/导航重叠 */
    padding: 0 var(--sp-mid) 0 92px; border-top: 1px solid var(--line-strong);
    background: linear-gradient(180deg, rgba(var(--sh-rgb),.28), rgba(var(--sh-rgb),.55));
  }
  /* v89.52：底部导航栏最左 · 一键显示建筑/野地名称与等级 */
  .bb-label-toggle {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    padding: var(--sp-1) var(--sp-4); font-size: var(--fs-sub); font-weight: 800; letter-spacing: 1px;
    color: var(--text-dim); cursor: pointer; border-radius: var(--r-md);
    background: linear-gradient(180deg, var(--btn-face-1), var(--btn-face-2));
    border: 1px solid var(--gold-dark); box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.1);
  }
  .bb-label-toggle:hover { filter: brightness(1.2); }
  .bb-label-toggle.on { color: var(--gold-light); border-color: var(--gold);
    background: var(--grad-bb-toggle); box-shadow: 0 0 10px rgba(var(--gold-soft-rgb),.3); }
  /* v89.61（老板「名称按钮应同时控制 城池内 / 城外建筑 / 地图地块 3 大部分」）
     —— 「🏷 名称」关掉时，城内视图与城外视图的建筑名（.tile-label）与等级角标
     （.tile-badge）一并隐藏。用 display:none 而**不删节点**：DOM 结构与点击目标
     保留，既有按类名取节点的断言/交互零影响；一处类名，任何视图立即跟随。
     地图 canvas 那三类（地块/城池/据点）由 map.render(showLabels) 控制，
     两边共用 ui._mapShowLabels 同一个状态（切换出口 ui.applyLabelSwitch）。 */
  body.labels-off .tile-label,
  body.labels-off .tile-badge { display: none !important; }
  .bottombar .pager {
    margin: 0; padding: var(--sp-1) var(--sp-4); background: transparent; border: none;
  }
  .bottombar .bb-hint {
    color: var(--text-dim); font-size: var(--fs-sub); opacity: .45; letter-spacing: .06em;
  }

  /* ============ 分页条（v14.1：长列表不再无限下拉） ============ */
  .pager {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: var(--sp-1); margin: var(--sp-mid) 0 var(--sp-1); padding: var(--sp-3) var(--sp-4);
    background: rgba(var(--sh-rgb), .22); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  }
  .pager .btn.sm { min-width: 32px; }
  .pager .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .pager .pg-info { color: var(--text-dim); font-size: var(--fs-sub); margin-left: var(--sp-3); }

  /* ============ 弹窗统一规范（v14.1） ============
     统一尺寸档位 + 底部关闭 + 内部滚动，避免超屏与无限下拉 */
  .modal { display: flex; flex-direction: column; }
  .modal .inner-panel { flex: 1; min-height: 0; overflow-y: auto; }
  /* v89.105（基调统一）：`.modal-foot` 与 `.m-foot` 是**同一个东西的两个历史名字**
     （都大量在用：前者散在各弹窗，后者走 modalShell 的 foot 槽）。
     两套定义只差一条 flex-wrap —— 典型的"看起来一样、改一处漏一处"。
     合并成一条**群组选择器**：两边调用点一行都不用改，样式从此不可能分叉。 */
  /* ============================================================
     * v89.105（基调统一）：**弹窗操作栏只有一条定义**。
     * ------------------------------------------------------------
     * 改前：`.m-foot` / `.modal-foot` / `.panel-foot` 是同一个东西的三个历史名字，
     * 却分两条规则写（一处 border .15 / 一处 .09），靠"后出现"取胜 ——
     * 调一处、另一处不动，看着一样、改起来漏。
     * 现在三类名共用这一条：边框取 --line-strong，与 .m-head 上下对称。
     * ============================================================ */
  .m-foot, .modal-foot, .panel-foot {
    flex: none; display: flex; justify-content: center; align-items: center;
    gap: var(--sp-3); flex-wrap: wrap;
    padding-top: var(--sp-4); margin-top: var(--sp-4);
    border-top: 1px solid var(--line-strong);
  }


  /* ============ 将领属性详情（v14.1） ============ */
  /* v26（需求 2）：将领详情改「左头像 · 右五维」两栏，原先的居中标题块不再使用 */
  .gd-name { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); }
  .gd-sub { color: var(--text-dim); font-size: var(--fs-sub); margin-top: var(--sp-1); }
  .gd-lore { color: var(--gd-lore-ink); font-size: var(--fs-sub); margin-top: var(--sp-1); font-style: italic; }
  .gd-sec {
    color: var(--gold-light);
    margin: var(--sp-mid) 0 var(--sp-2); padding-bottom: var(--sp-1); border-bottom: 1px dashed var(--line-strong);
  }
  .gd-line { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-body); margin: var(--sp-1) 0; }
  .gd-bar {
    flex: 1; min-width: 90px; height: 7px; border-radius: var(--r-sm);
    background: rgba(var(--sh-rgb), .45); overflow: hidden; border: 1px solid var(--gd-bar-line);
  }
  .gd-bar i { display: block; height: 100%; border-radius: var(--r-sm); transition: width .3s; }
  .gd-hint { color: var(--text-dim); font-size: var(--fs-sub); }
  .gd-warn { color: var(--red-light, #e08a7a); font-size: var(--fs-sub); }
  .gd-chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
  .gd-chip {
    font-size: var(--fs-sub); padding: var(--sp-1) var(--sp-3); border-radius: var(--r-sm);
    background: var(--slab-3); border: 1px solid var(--line-strong); color: var(--text-dim);
  }
  .gd-chip.on { color: var(--text); }
  .gd-chip.on.q3 { border-color: rgba(var(--rank-ming-rgb), .6); color: var(--gd-chip-ink); }
  .gd-chip.on.q4 { border-color: rgba(var(--amber-rgb), .7); color: var(--gold-light); }
  /* 将领姓名可点进详情 */
  .tbl td .gen-link { color: var(--gold-light); cursor: pointer; text-decoration: underline dotted; }
  .tbl td .gen-link:hover { color: #fff3cf; }

  /* ============ 军队 / 兵种卡 ============ */
  /* v80（老板）：「页面分成步兵，骑兵两个界面，翻页」—— 两页切换（选中页走 .btn.gold） */
  .train-tabs { display: flex; justify-content: center; gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .train-tabs .btn { min-width: 118px; }
  .troop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-4); }
  .troop-card {
    background: linear-gradient(180deg, var(--surface-2), var(--surface-3b));
    border: 1px solid var(--gold-dark);
    border-radius: var(--r-lg);
    padding: var(--sp-3);
    text-align: center;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .troop-card:hover { transform: translateY(-3px); }
  .troop-card.disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
  .troop-card.selected { border-color: var(--green-ok); box-shadow: 0 0 0 2px rgba(var(--green-ok-rgb),.4); }
  .troop-card .ticon { font-size: var(--isz-lg); line-height: var(--lh-1); }
  /* v63（老板）：「在城内空地上选择建造的建筑类型时，把相应建筑的图标同步进去。
     不用写消耗的资源，悬停显示即可」——
     图标改成与棋盘同一套（位图/矢量两条路径），所以给图标一个**固定高度**，
     否则两条路径的高度不同、卡片高矮不一。费用挪进 title，卡片只剩"图标 + 名称"。 */
  .troop-card.bldg-pick .ticon {
    height: 84px; display: flex; align-items: center; justify-content: center;
  }
  /* 图标按高度定尺、宽度自适应 —— 位图长宽比不一致时不会被拉变形 */
  .troop-card.bldg-pick .ticon .ico { width: auto; height: 84px; max-width: 100%; object-fit: contain; }
  .troop-card .tname { font-size: var(--fs-body); font-weight: 700; color: var(--parchment); margin-top: var(--sp-1); }
  .troop-card .tstat { font-size: var(--fs-cap); color: var(--text-dim); margin-top: var(--sp-1); line-height: var(--lh-body); }

  /* ============ 将领卡片（v20 · 需求 3：分次呈现）============
     旧版 .gen-card（.gavatar/.ginfo 结构，v11 遗留）已废弃并删除 ——
     它与新结构同名不同形，残留会把新卡片样式顶掉。
     v41（需求 2）：新结构（卡片墙）也已被「左清单 + 右档案」取代，见 .gen-split。 */
  /* ============================================================
     将领一览（v28 · 需求 2）：一屏 12 个栏位，**细条式**
     ------------------------------------------------------------
     旧的 .gen-grid 是 3 列卡片墙、每页 9 个：一屏装不下要看翻页，
     每张卡片竖排五行、信息密度极低。现在一条将领只占一行。
     v41 后 .gen-card 已彻底无引用（仅 .gcard-tag 仍用于名字旁的名将/美人标）——
     但列表页不再引用它，避免两套样式互相顶掉（本项目踩过这个坑）。
     ============================================================ */
  /* ---- 下方档案 ---- */
  .gdet { border: 1px solid var(--gold-dark); border-radius: var(--r-lg); padding: var(--sp-mid);
    background: rgba(var(--sh-rgb),.2); }
  .gdet-head { display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-4); flex-wrap: wrap; padding-bottom: var(--sp-3); margin-bottom: var(--sp-4);
    border-bottom: 1px solid var(--sep-gold); }
  .gdet-name { font-size: var(--fs-lead); font-weight: 700; }
  .gdet-sub { margin-left: var(--sp-4); font-size: var(--fs-sub); font-weight: 400; color: var(--text-dim); }
  .gdet-ops { display: flex; gap: var(--sp-2); }
  .gdet-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-5); }
  /* v74：视口断点已撤（@media (max-width: 860px) .gdet-grid） */
  .gdet-side { display: flex; flex-direction: column; gap: var(--sp-2); }
  .gdet-row { display: flex; gap: var(--sp-3); font-size: var(--fs-sub); align-items: baseline; }
  .gdet-row .k { flex: none; width: 62px; color: var(--text-dim); }
  .gdet-row .v { flex: 1; min-width: 0; }
  .gd-expbar.sm { display: inline-block; width: 72px; height: 5px; border-radius: var(--r-sm);
    background: rgba(var(--sh-rgb),.45); border: 1px solid var(--line-strong); overflow: hidden;
    vertical-align: middle; margin-right: var(--sp-2); }
  .gd-expbar.sm i { display: block; height: 100%; background: var(--grad-progress); }
  /* ============================================================
   * 将领界面（v41 · 需求 2）—— 左姓名清单 / 右完整档案
   * ------------------------------------------------------------
   * 老板原话：「将领左侧显示姓名清单，右侧显示详细属性和装备图（不需要再整一个
   * 装备图的弹窗），把完整档案的全部信息也整合过来，不需要再整个单独弹窗」。
   * 所以只有**一套**布局：左列清单 + 右列（档案 + 人形装备栏）。
   * 原先的 .gen-wall / .gen-card 卡片墙、以及 v11 遗留的第二族 .gen-card
   * 至此全部无人引用，一并删除（否则就是"样式还在、结构早没了"的死样式）。
   * ============================================================ */
  /* v52：`align-items: start` → `stretch` —— 让左清单能吃到"整行高度"（右栏档案通常更高），
     这样清单一列内容少时不再被写死的高度撑空。右栏自己 `align-self: start`，
     免得 `.gen-pane` 被拉伸后内部两栏也跟着变形。 */
  .gen-split { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: var(--sp-mid); align-items: stretch; }
  .gen-split > .gen-pane { align-self: start; }
  /* 断点按**视口宽**定，不是按内容区宽 —— 视图区实际宽度 = 视口 − 侧栏(~300px)。
     1300px 视口 ≈ 内容区 1000px：再窄装备栏就放不下"人形 | 属性"两列，
     属性挪到人形下方（人形能吃满整栏，方槽才不挤）。 */
  /* v74：将领档案的 1300/1100/900 三档视口断点全部撤除 ——
     画布固定后，这些"窄窗重排"永不触发（留着反而是随窗口移动的隐患）。 */
  /* v89.131：这里原有一条 `.gp-body { grid-template-columns: 1fr 1fr }` ——
     与 2250 行的定义同权重且更早，**永远是死规则**（后者胜），一并删除。
     当前分栏口径写在 2250 行（1/4 : 3/4）。 */
  /* ============================================================
   * 左清单（v45 · 需求 1）：**整段可滚、不分页**
   * ------------------------------------------------------------
   * 老板要求：① 去掉「装 0/12」；② 只显示姓名与资质；③ 不再限制每页人数
   *          —— 这里允许滚动（分页会把"我到底有几个将"切碎）。
   * v46（需求 1）追加：资质**另起一行**。并排会因姓名长短不一让资质章左右跳动，
   * 逐行扫的时候很晃眼；两行后每行 ~47px，12 席仍一屏放得下。
   * ============================================================ */
  .gen-list {
    display: flex; flex-direction: column; gap: var(--sp-1);
    /* v52（老板：「左边空间都没排满整什么下拉」）：
       改前写死 `max-height: 68vh` + 常驻滚动开关 —— 于是**将领少的时候清单也被撑到 68vh**，
       下面一大片空席位/空白，滚动条却还挂在那儿（实测 12 席恰好 = 596px = 68vh）。
       "没排满"和"下拉"是同一个病根：**高度写死，而不是按内容走**。
       改成 `max-height: 100%`（吃满可用高度、内容少就矮）+ 只在真超出时才出现滚动。
       `scrollbar-gutter: stable` 保留 —— 否则内容增减会让清单宽度跳一下。 */
    max-height: 100%; overflow-y: auto; scrollbar-gutter: stable; padding-right: var(--sp-0);
  }
  /* v76（老板）：「12个空格每页，平分空间吧」——12 行平分清单高度（行随面板伸缩，
     高度不足时才退回滚动 + 最小行高兜底）。 */
  .gen-list > .gen-row { flex: 1 1 0; min-height: 40px; }
  .gen-row {
    display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-1) var(--sp-3); cursor: pointer;
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line);
    border-radius: var(--r-lg); transition: border-color .14s, background .14s;
  }
  .gen-row:hover { background: rgba(var(--hl-rgb),.07); border-color: rgba(var(--gold-soft-rgb),.45); }
  .gen-row.sel { border-color: var(--gold); background: rgba(var(--hl-rgb),.10);
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06); }
  .gen-row.empty { border-style: dashed; background: rgba(var(--sh-rgb),.14); cursor: default; }
  .gen-row.empty:hover { background: rgba(var(--sh-rgb),.14); border-color: var(--line); }
  .grow-face { flex: none; width: 30px; height: 30px; display: flex; align-items: center;
    justify-content: center; color: var(--text-dim); font-size: var(--fs-h3); }
  .grow-face svg, .grow-face img { width: 30px; height: 30px; border-radius: var(--r-md); }
  /* 两行布局（v46 需求 1）：**姓名一行、资质一行**。
     上一版把二者并排，老板判为"太拥挤" —— 名单是逐行扫的，
     并排会让姓名长短不一时资质章左右跳动，反而更难扫。 */
  .grow-main { flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: flex-start; gap: var(--sp-0); }
  .grow-name { font-size: var(--fs-sub); font-weight: 700; display: flex; align-items: center;
    gap: var(--sp-1); white-space: nowrap; overflow: hidden; color: var(--text-strong); max-width: 100%; }
  .grow-sub { display: flex; align-items: center; gap: var(--sp-1);
    font-size: var(--fs-cap); color: var(--text-dim); }
  .grow-sub .grow-loy { font-style: normal; color: var(--warn); font-weight: 700; }
  /* v89.80（老板）：「将领名称后增加 Lv.x 的等级标识」——
     金色小徽标，跟在姓名后；弹性收缩（姓名过长时让位），不换行。 */
  .grow-lv { flex: none; font-size: var(--fs-cap); font-weight: 800; color: var(--gold-light);
    border: 1px solid rgba(var(--gold-soft-rgb),.45); border-radius: var(--r-sm); padding: 0 var(--sp-1);
    margin-left: var(--sp-1); font-variant-numeric: tabular-nums; }
  .grow-st { flex: none; margin-left: auto; font-size: var(--fs-cap); color: var(--text-dim);
    padding: var(--sp-hair) var(--sp-2); border-radius: var(--r-sm); border: 1px solid var(--line-strong); }
  .grow-st.st-guard { color: var(--blue-info); border-color: rgba(var(--rank-ying-rgb),.5); }
  .grow-st.st-busy { color: var(--green-ok); border-color: rgba(var(--rank-liang-rgb),.5); }
  /* ---- 右侧：完整档案 ---- */
  .gen-pane { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1);
    background: rgba(var(--sh-rgb),.18); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: var(--sp-mid); }
  .gp-head { display: flex; align-items: center; gap: var(--sp-mid); padding-bottom: var(--sp-4);
    border-bottom: 1px solid var(--sep-gold); }
  /* ============================================================
   * 右侧档案 = 三块（v46 · 需求 2）
   * ------------------------------------------------------------
   * 上＝汇总身份行（横贯全宽）；左下＝六维 / 经验 / 状态；右＝装备栏。
   * 分栏比例：左栏全是文字（表格自己会折行），右栏要放人形 + 放大的将领抠图，
   * 所以右栏给得多一点。窄屏（<900px）退回单列，否则两边都会被挤到不能用。
   * ============================================================ */
  /* v89.131（老板）：「六维/状态占左四分之一；装备栏占四分之三，稍微放大一点。
     其中的四分之二为装备图，另四分之一为装备属性汇总」——
     列宽三段合起来 = 4 份：.gp-body 给 1:3，.gp-doll 内部再给 2:1。 */
  .gp-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
    gap: var(--sp-5); align-items: start; }
  .gp-col-l, .gp-col-r { min-width: 0; display: flex; flex-direction: column; }
  /* 每栏的第一个分区标题不再上留白 —— 上方的 gp-head 已经给了分隔线 */
  .gp-col-l > .gp-sec:first-child, .gp-col-r > .gp-sec:first-child { margin-top: 6px; }
  .gp-face { flex: none; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .gp-face svg, .gp-face img { width: 84px; height: 84px; border-radius: var(--r-md); }
  .gp-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
  .gp-name { font-size: var(--fs-h3); font-weight: 800; color: var(--gold-light);
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .gp-sub { font-size: var(--fs-sub); color: var(--text-dim); }
  /* v58（老板："守将和解雇可以放头像所在内容的右边"）：竖排两枚短按钮，
     放在身份行内部右侧（不横排，否则会把经验条与数字挤窄）。 */
  .gp-ops { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-1); }
  /* v54（老板："任命守将左边点"）：操作从身份行右侧移到**下方一行、左对齐**。
     它不再在 .gp-head 里，所以这里要自己给上下间距。 */
  /* v58：操作已移回 .gp-head 内部，这条"上一行是 gp-head 时"的间距不再需要 */
  .gp-ops .btn { min-width: 92px; }
  /* v89.131（老板）：「解雇放在人名所在行右侧，稍带点距离」——
     margin-left:auto 把按钮推到人名行的右缘（flex 行内“右侧”的标准解法），
     padding-left 留出与姓名/标签的间距（"稍带点距离"）。 */
  .gp-nameops { margin-left: auto; padding-left: var(--sp-5); flex: none; }
  /* v54（老板："将领经验条放在顶上…整个加号"）：经验条进身份行，
     右端一个「＋」开经验道具选择窗。 */
  .gp-exprow { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-1); }
  /* v58（老板："经验条不要那么长"）：原来 flex:1 会撑满身份行右侧、像一条贯穿横线；
     改成**固定宽度**，右侧留给"经验数字 / 还差多少 / ＋"。 */
  .gp-exprow .gd-expbar { flex: none; width: 150px; }
  .gp-exprow .gd-expleft { flex: none; color: var(--text-dim); font-size: var(--fs-sub);
    font-variant-numeric: tabular-nums; }
  /* 守将身份时，六维"作用"里那截实际加成的颜色（与普通说明区分开） */
  .gd-u .gd-guard { color: var(--gold-light); }
  /* v59：出征战术弹窗 —— 每个兵种一块（上一行动作、下一行目标） */
  .tac-block { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--line); border-radius: var(--r-lg); background: rgba(var(--sh-rgb),.16); }
  .tac-block + .tac-block { margin-top: var(--sp-2); }
  .tac-row { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; }
  .tac-name { flex: none; min-width: 76px; font-size: var(--fs-sub); color: var(--parchment); }
  .tac-k { flex: none; font-size: var(--fs-cap); color: var(--text-dim); line-height: 22px; }
  .tac-row .chips { flex: 1; }
  /* 出征弹窗里"调整战术"的小链接 */
  .exp-tac-link { color: var(--gold-light); cursor: pointer; text-decoration: underline; margin-left: var(--sp-2); }
  .gp-exprow .gd-exptext { flex: none; }
  .gp-expadd { flex: none; min-width: 30px; padding: var(--sp-hair) var(--sp-2); line-height: var(--lh-body); }
  .gp-sec { margin-top: var(--sp-mid); padding-bottom: var(--sp-1);
    color: var(--gold-light); border-bottom: 1px solid var(--sep-gold); }
  /* v46（需求 2）：装备栏独占右栏。内部仍是「人形 | 属性与套装」并排 ——
     堆叠会让人形（380px）把整个档案顶到 870px，整页多出一条滚动条；
     并排后高度由人形单独决定（≈400px），余量充足。 */
  /* v89.131（老板）：「装备图占四分之二、装备属性汇总占四分之一」——
     装备栏（3/4）内部再分 2:1；同时 `align-items: stretch` 让汇总列**撑满人形框高度**
     （老板报的「装备的界面没有占满，底下有留空的一块」就是它：汇总列内容只到 186px，
     而人形框 358px —— 下缘一大片空）。按钮组改 `margin-top:auto` 钉到列底，
     于是汇总列目视从顶到底都排满。 */
  .gp-doll { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp-4);
    align-items: stretch; margin-top: var(--sp-3); }
  .gp-dollops { display: flex; gap: var(--sp-2); margin-top: auto; padding-top: var(--sp-3); }
  .gp-dollops .btn { flex: 1; }
  /* 仍在使用：名字旁的「名将 / 美人」小标 */
  .gcard-tag { flex: none; font-size: var(--fs-cap); font-weight: 400; padding: 0 var(--sp-1); border-radius: var(--r-sm);
    border: 1px solid currentColor; }
  .gcard-tag.hero { color: var(--hero-tag); }
  .gcard-tag.beauty { color: var(--beauty-tag); }
  .gcard-tag.lord { color: var(--lord-tag); }

  /* ============ 属性条 ============ */
  .attr { display: flex; justify-content: space-between; padding: var(--sp-1) 0; border-bottom: 1px dashed rgba(var(--gold-rgb),.15); font-size: var(--fs-body); }
  .attr .k { color: var(--text-dim); }
  .attr .v { font-weight: 700; }
  .attr .v.good { color: var(--green-ok); }
  .attr .v.bad { color: var(--red-light); }   /* v89.104：珠宝/材料不足标红 */

  /* ============ 模态框 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(var(--sh-rgb),.65);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(2px);
  }
  /* v19：附属窗口**尺寸规范化** —— 固定尺寸档位（v75 起五档：+xxl），不随内容多少伸缩。
     内容少则留白、内容多则内部滚动，连续打开多个面板时视觉稳定。
     所有档位都受 vw/vh 上限约束，保证任何视口下都不会超出边界。 */
  /* v74（老板需求 2）：弹窗尺寸**改成固定像素**（不再随视口 vw/vh 缩放）——
     画布是死的，弹窗在画布里就应该是死的。
     仅保留一道**极小窗口兜底**（100vw/vh − 20px）：窗口比画布还小时不至于被裁到够不着。
     原先的"视口不足自动降档"（h≤860 的媒体查询）一并撤除。 */
  .modal {
    width: 660px; height: 620px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
    position: relative; overflow: hidden;
  }
  /* ============ 弹窗关闭键（v89.114 · 老板令）============
     「所有弹窗型窗口（比如建筑）的关闭按钮不再在底部显示，
      改为弹窗右上角的关闭按钮（圆形套个叉叉）」
     —— 由 ui.openModal 统一注入 .modal-x（html 里的关闭键就地剥离）。
     挂 .modal 直属（.inner-panel 是滚动容器，放里面会随内容滚走）。
     视觉：圆形描边 + 金叉；悬停转红（与危险/否定色一致）。 */
  .modal .modal-x {
    position: absolute; top: var(--sp-2); right: var(--sp-2); z-index: 60;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: var(--lh-1);
    font-size: var(--fs-body); font-weight: 700;
    color: var(--gold-light);
    background: rgba(var(--sh-rgb), .55);
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, transform .1s;
  }
  .modal .modal-x:hover {
    color: var(--red-light); border-color: var(--red-light);
    background: rgba(var(--sh-rgb), .85);
  }
  .modal .modal-x:active { transform: scale(.9); }
  .modal-sm { width: 440px; height: 420px; }
  .modal-lg { width: 860px; height: 600px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }
  /* xl（打造面板等）：960×700 定死 —— 卡片实测高 170px，2 行 340 + 筛选/分页/间隙 434，
     700 高的弹窗正文约 530，两行稳装。
     v51 曾按"矮屏 min(700px, 88vh)"折衷；v74 画布固定后不再随视口缩（兜底同 md/lg）。 */
  .modal-xl { width: 960px; height: 700px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }
  /* xxl（v75 客栈招募；v89.112 再扩）：**1200×850** —— 老板「充分利用界面版面。
     画布 1440×900：左右各留 120px、上下各留 25px —— 相比旧 1020×840（左右各 210px）
     多出 18% 面积。坐在这一档的是"内容确实多"的面板（市场/客栈/见闻/君主/出征/
     全境营造/战报详情…），加宽后原本靠滚动条苟着的段（出兵表/候选表）多数能一屏站直。
     兜底规则同其余档位。 */
  .modal-xxl { width: 1200px; height: 850px;
    max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); }
  /* v89.105（基调统一 · 弹窗整备）：xxl 数值在上一处（v89.112 起 1200×850）。
     ⚠️ 再改这一档要**重新量**：
        node .workbuddy/tools/audit/audit_v891112_pressure.js（载荷体检）
      —— 它用真实试玩存档压出"哪些面板还会冒滚动条"。
     ⚠️ 本档的规则体只在**上一处**（本注释上方那条 .modal-xxl）；v89.119 清掉了
        此处原先的重复定义（两处一字不差，后者空转、只添乱）。 */
  /* v89.119：**战报正文页**（信息流页：回放 + 回合纪要 + 兵种损耗表）专属加高 ——
     该页在"13 回合 / 7 兵种"的真实载荷下 850px 仍溢 41px（实机量），
     放开到 min(920px, calc(100vh - 40px))：1000 高视口 → 920px（零溢出并留余量）。
     ⚠️ 只对这一页生效（modal-tall 由 ui.openModal 的 opts.tall 注入）——**不动 xxl 本体**。 */
  .modal.modal-xxl.modal-tall { height: min(920px, calc(100vh - 40px)); }
  /* v89.47（老板①「缩略图放大到满界面」）：第六档 max —— 铺满视口，只留 8px 呼吸。
     ⚠ 必须排在本节（.modal / .modal-sm… 之后）：同为单类选择器，
     靠"后出现"取胜；写在别处会被 .modal 的 660×620 打回。 */
  .modal-max { width: calc(100vw - 16px); height: calc(100vh - 16px);
    max-width: none; max-height: none; }

  /* ============ 弹窗统一格局（v19）============
     .m-head 标题栏（固定）· .m-body 内容区（滚动）· .m-foot 操作栏（固定）
     以往各弹窗自行拼装标题与关闭按钮，风格参差；现在一律走 ui.modalShell()。 */
  .modal .inner-shell { display: flex; flex-direction: column; overflow: hidden; }
  .m-head { flex: none; padding: 0 0 var(--sp-4); margin-bottom: var(--sp-4); border-bottom: 1px solid var(--line-strong); }
  .m-title { display: block; text-align: center;
    padding: var(--sp-1) 0;
    /* v89.105：渐变底色与旧式标题**同一令牌**（改前一处 .28、一处 .25 —— 同物两名） */
    background: linear-gradient(90deg, transparent, var(--sep-gold), transparent); }
  .m-sub { display: block; text-align: center; color: var(--text-dim); font-size: var(--fs-sub);
    margin-top: var(--sp-1); }
  .m-body { flex: 1; min-height: 0; overflow-y: auto; padding-right: var(--sp-0); }
  /* .m-foot 的版式已并入上面的群组选择器（唯一来源） */
  /* 统一的分区小标题（各弹窗共用） */
  .m-sec { color: var(--gold-light); margin: var(--sp-mid) 0 var(--sp-2); }   /* v82：字号/字重走分区标题共享 */
  .m-sec:first-child { margin-top: 0; }
  /* 弹窗内表格统一外框（避免贴边） */
  .m-body .tbl { margin-top: var(--sp-1); }
  /* ============ 种田秘境（v73 · 老板需求 3） ============
     「背景是个人种田空间」：整页暖土渐变（金色三元组低透明 → 四主题自动适配），
     六格灵田；生长中是进度条 + 倒计时（每秒由 ui.updateProgress 刷新）。
     （v72 的 .dlg-ico 尺寸盒随「顶部图标块撤除」一起退役 —— 没有图标，就没有 1024px。） */
  .farm-space {
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(var(--gold-rgb),.10), transparent 62%),
      linear-gradient(180deg, rgba(var(--gold-rgb),.06), rgba(var(--sh-rgb),.10));
    border: 1px solid var(--line-strong); border-radius: var(--r-lg);
  }
  .farm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); margin: var(--sp-4) 0; }
  .farm-cell {
    display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; text-align: center;
    background: linear-gradient(180deg, rgba(var(--gold-rgb),.10), rgba(var(--gold-rgb),.02));
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    padding: var(--sp-4) var(--sp-3);
  }
  .farm-cell .pbar { width: 100%; }
  .farm-cell.ripe { border-color: var(--gold); box-shadow: 0 0 10px rgba(var(--gold-rgb),.30); }
  .farm-ic { font-size: var(--isz-em-lg); line-height: var(--lh-tight); }
  .farm-crop { color: var(--gold-light); font-weight: 700; font-size: var(--fs-lead); }
  .farm-sub { color: var(--text-dim); font-size: var(--fs-sub); }
  .farm-seed {
    display: flex; align-items: center; gap: var(--sp-4);
    background: rgba(var(--sh-rgb),.22); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: var(--sp-4); margin-bottom: var(--sp-3);
  }
  .farm-seed .farm-ic { font-size: var(--isz-em-md); }
  .farm-seed-main { flex: 1; min-width: 0; }

  /* ============ 提示条 toast ============ */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    background: var(--toast-bg); color: var(--gold-light); border: 1px solid var(--gold-dark);
    padding: var(--sp-4) var(--sp-7); border-radius: var(--r-lg); font-size: var(--fs-lead); font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 2000;
    box-shadow: 0 10px 30px rgba(var(--sh-rgb),.5);
    /* v89.93（整改 E4）：反馈分层 —— 多条提示纵向堆叠 + 左侧类型色条 */
    display: flex; flex-direction: column; gap: var(--sp-1); max-width: min(560px, 86vw);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* v89.93（E4）：四型反馈 —— success 绿 / info 金（默认）/ warn 琥珀 / danger 朱 */
  .toast-line { border-left: 3px solid var(--gold-dark); padding-left: var(--sp-4); white-space: pre-line; }
  .toast-line.t-success { border-left-color: var(--green-ok); }
  .toast-line.t-info { border-left-color: var(--gold-dark); }
  .toast-line.t-warn { border-left-color: var(--warn); }
  .toast-line.t-danger { border-left-color: var(--cinnabar); }
  /* v89.93（E4）：数值浮字（资源/属性变动时上浮） */
  .float-gain {
    position: fixed; z-index: 2100; pointer-events: none; font-size: var(--fs-lead); font-weight: 800;
    color: var(--green-ok); text-shadow: 0 1px 4px rgba(var(--sh-rgb),.6);
    animation: floatGain 900ms ease-out forwards;
  }
  .float-gain.neg { color: var(--cinnabar); }
  @keyframes floatGain {
    0% { opacity: 0; transform: translateY(6px); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-26px); }
  }
  /* v89.93（E5）：里程碑演出层（三档：inline 横幅 / card 居中卡 / full 全屏） */
  #moment-fx { position: fixed; inset: 0; z-index: 1400; pointer-events: none; display: none; }
  #moment-fx.mo { display: block; }
  #moment-fx.mo-inline { inset: auto 0 auto 0; top: 74px; display: flex; justify-content: center; }
  #moment-fx.mo-card, #moment-fx.mo-full { background: rgba(var(--sh-rgb),.45); pointer-events: auto;
    display: flex; align-items: center; justify-content: center; }
  .mo-box { background: var(--mo-bg); border: 1px solid var(--gold-dark); border-radius: var(--r-xl);
    padding: var(--sp-5) 22px; color: var(--gold-light); box-shadow: 0 12px 40px rgba(var(--sh-rgb),.55); }
  .mo-box-inline { padding: var(--sp-3) 18px; animation: moIn .25s ease-out; }
  .mo-box-card { min-width: 320px; max-width: 520px; animation: moIn .3s ease-out; }
  .mo-box-full { min-width: 420px; max-width: 620px; text-align: center; animation: moIn .35s ease-out; }
  @keyframes moIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .mo-head { display: flex; align-items: baseline; gap: var(--sp-4); }
  .mo-ico { font-size: var(--fs-h1); }
  .mo-title { font-size: var(--fs-h2); font-weight: 800; color: var(--gold-light); letter-spacing: .04em; }
  .mo-sub { margin-top: var(--sp-2); font-size: var(--fs-sub); color: var(--gold); }
  .mo-lines { margin-top: var(--sp-4); font-size: var(--fs-sub); line-height: var(--lh-loose); color: var(--text-strong); }
  .mo-foot { margin-top: var(--sp-5); text-align: right; }
  @media (prefers-reduced-motion: reduce) { .mo-box { animation: none !important; } }

  /* ============ 创建角色界面 ============ */
  /* v74（老板需求 2）：创建界面同走**固定像素画布**（窗口怎么推都不动）；
     内容超高时画布内部滚动（不裁、不重排）。
     v70 的 `margin: auto` 居中法保留（内容高过画布时不会裁顶）。 */
  .create-screen {
    width: var(--app-w); height: var(--app-h); margin: 0 auto;
    display: flex; justify-content: center; padding: var(--sp-6); overflow: auto;
  }
  .create-box {
    width: 680px; max-width: 100%; padding: var(--sp-7); margin: auto;
  }
  .create-inner { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }
  .avatar-select { text-align: center; }
  .avatar-big {
    width: 130px; height: 130px; margin: var(--sp-5) auto; border: 3px solid var(--gold);
    border-radius: var(--r-xl); background: var(--grad-avatar);
    display: flex; align-items: center; justify-content: center; font-size: var(--isz-av-lg);
    box-shadow: 0 8px 24px rgba(var(--sh-rgb),.5);
  }
  /* v70（老板需求 5）：头像改用画像（与将领同一套池子），不再用 emoji */
  .avatar-big img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--r-md); display: block; }
  .avatar-nav { display: flex; align-items: center; justify-content: center; gap: var(--sp-5); }
  .avatar-nav .arrow { font-size: var(--isz-md); color: var(--teal-light); cursor: pointer; padding: var(--sp-2) var(--sp-5); user-select: none; }
  .avatar-nav .arrow:hover { color: var(--gold-light); }
  .gender-toggle { display: flex; gap: var(--sp-4); justify-content: center; margin-top: var(--sp-4); }
  .gender-toggle .guse { padding: var(--sp-1) var(--sp-6); border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-body); border: 1px solid var(--teal); }
  .gender-toggle .guse.active { background: var(--teal); color: var(--on-accent); }

  .create-form { display: flex; flex-direction: column; gap: var(--sp-mid); }
  .field { display: flex; align-items: center; gap: var(--sp-4); }
  .field label { width: 70px; color: var(--gold-light); font-weight: 700; font-size: var(--fs-lead); white-space: nowrap; }
  .field input[type=text] {
    flex: 1; padding: var(--sp-3) var(--sp-4); font-size: var(--fs-lead); color: var(--text);
    background: var(--slab-1); border: 1px solid var(--gold-dark); border-radius: var(--r-sm);
  }
  .field select { flex: 1; padding: var(--sp-3); background: var(--slab-1); color: var(--text); border: 1px solid var(--gold-dark); border-radius: var(--r-sm); }
  .summary-box { font-size: var(--fs-body); color: var(--text-dim); background: rgba(var(--sh-rgb),.25); border-radius: var(--r-md); padding: var(--sp-4); line-height: var(--lh-loose); }
  .agree { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-body); color: var(--text-dim); }
  .agree input { accent-color: var(--teal); }
  .create-actions { text-align: center; margin-top: var(--sp-3); display: flex; gap: var(--sp-4); justify-content: center; flex-wrap: wrap; }
  .create-save-note { text-align: center; font-size: var(--fs-sub); color: var(--text-dim); margin-top: var(--sp-4); }
  .create-save-note .good { color: var(--green-ok); }
  .chron-item.tag-offline { border-left-color: var(--blue-info); opacity: .9; }

  /* ============ 聊天/信息流底部 ============ */
  /* ============ 底部：左信息流 + 右功能入口（原版双栏）============ */
  .bottom-bar {
    margin: 0 var(--sp-mid) var(--sp-mid);
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    border-radius: var(--r-lg);
    padding: var(--sp-3) var(--sp-mid);
    display: flex; gap: var(--sp-mid); align-items: stretch;
    font-size: var(--fs-sub); color: var(--text-dim);
  }
  .bb-left { flex: 1; display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
  .bb-channels { display: flex; gap: var(--sp-2); }
  .bb-channels .ch {
    cursor: pointer; color: var(--text-dim); padding: var(--sp-hair) var(--sp-2);
    border-radius: var(--r-sm); border: 1px solid transparent; font-size: var(--fs-cap);
  }
  .bb-channels .ch.active { color: var(--gold-light); background: rgba(var(--gold-rgb),.18); border-color: rgba(var(--gold-rgb),.4); }
  .bb-log { color: var(--green-ok); font-size: var(--fs-sub); line-height: var(--lh-body); overflow: hidden; }
  .bb-right { display: flex; gap: var(--sp-2); align-items: center; flex-shrink: 0; }
  .bb-btn {
    font-size: var(--fs-sub); font-weight: 700; color: var(--gold-light); white-space: nowrap;
    padding: var(--sp-1) var(--sp-4); cursor: pointer; border-radius: var(--r-sm);
    background: linear-gradient(180deg,var(--btn-face-1),var(--btn-face-2));
    border: 1px solid var(--gold-dark);
    box-shadow: inset 0 1px 0 rgba(var(--hl-rgb),.06);
  }
  .bb-btn:hover { filter: brightness(1.25); }
  .bottom-bar .sys { color: var(--green-ok); }

  /* ============ 公文页消息流（v16：由底部栏整合而来）============ */
  .msg-channels { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .msg-channels .ch {
    cursor: pointer; color: var(--text-dim); padding: var(--sp-0) var(--sp-4); font-size: var(--fs-sub);
    border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: rgba(var(--sh-rgb),.2);
  }
  .msg-channels .ch.active { color: var(--gold-light); background: rgba(var(--gold-rgb),.16); border-color: rgba(var(--gold-rgb),.45); }
  /* v39（需求 4）：消息流去底色与边框 —— 原来是一个深色带边框的滚动框，
     在"一堆框"里最显眼。现在只是一段可滚的文本流（仍保留滚动能力与全部消息），
     高度 240 → 380：一屏看得更多，需要滚的时候也更少。 */
  /* v43（老板要求）：**去掉 max-height 滚动**，改分页 ——
     "下拉框"（滚动条）在项目里是明确要避免的交互。
     之前靠 max-height 380px + overflow 装下几百条，现在每页 15 条、
     页脚翻页，一屏看得完，也就不需要滚动条了。 */
  .msg-log {
    padding: var(--sp-0) var(--sp-1) var(--sp-0) 0;
    background: none; border: 0; border-radius: 0;
    font-size: var(--fs-sub); line-height: var(--lh-loose);
  }
  .bb-line { color: var(--green-ok); }
  .bb-line.war { color: var(--amber); }
  .bb-line.task { color: var(--blue-info); }
  /* v89.107：公文五类页签 + 每条消息的时刻列。
     类别配色沿用 .bb-line；scout / beacon 两支本轮补齐
     （scout 无消息发射点 —— 它的正文是结构化的「回报」，这里留着是为了
      将来有侦查流水时不用再改样式）。 */
  .bb-line.scout { color: var(--blue-info); }
  .bb-line.beacon { color: var(--red-light); }
  .bb-line .bl-t { color: var(--text-dim); margin-right: var(--sp-2);
    font-variant-numeric: tabular-nums; letter-spacing: 0; }
  /* 页签上的条数徽标（战报 12 · 烽火 3 …）—— 让"哪一类有新东西"一眼可见 */
  .doc-tabs .mt-n { margin-left: var(--sp-1); font-size: var(--fs-cap); opacity: .72;
    font-variant-numeric: tabular-nums; }
  .doc-tabs .mt.on .mt-n { opacity: 1; }

  /* v24（需求 9）：屏幕下方的队列播报条（.queue-bar / .queue-item）已整体删除 ——
     队列状态改在「公文 · 队列」一节呈现，相关样式只保留上面那条 .qbar。 */

  /* 滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--slab-1); }
  ::-webkit-scrollbar-thumb { background: var(--wood-light); border-radius: var(--r-md); }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

  /* v74：主布局的 900px 断点已撤（.main 1fr / .auth-side static / 各网格降列）——
     画布固定 1440 宽，这些"窄窗降列"规则不再需要，留着只会随窗口挪动内容。 */

  /* ============================================================
   * v21 统一层
   * ------------------------------------------------------------
   * 三层界面（大界面 .view-box / 弹窗 .modal / 地图 .map-wrap）
   * 共用同一套骨架与同一套文字层级：
   *   层级：--fs-h2 界面标题 · --fs-h3 分区标题 · --fs-body 正文
   *         --fs-lead 强调与按钮 · --fs-sub 次要 · --fs-cap 角标
   *   用色：金色 = 标题与强调；浅灰 = 正文与数据；暗灰 = 次要信息
   *         状态色 = 成功(绿)/危险(红)/提醒(琥珀)/信息(蓝)，仅表状态
   *   边界：发丝描边 + 背景亮度表达层级（暗色界面不用投影）
   * ============================================================ */

  /* ---- 信息条：只承载事实与数据，不再写玩法说明（需求 5）---- */
  .note {
    /* v82：行高走备注族共享（1.65） */
    font-size: var(--fs-sub);
    color: var(--text-dim);
    background: rgba(var(--sh-rgb), .20);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4);
    margin-top: var(--sp-3);
  }
  .note b { color: var(--parchment); font-weight: 700; }
  /* v82（老板「统一各级标题，文字，备注」）：
     备注族一处定义 —— 说明 / 空态 / 提示类文字统一 12px · 常规字重 · 次要色 · 行高 1.65。 */
  .note, .ui-sub, .nt-info, .op-hint, .m-sub, .gb-empty, .q-empty,
  .gd-hint, .farm-sub, .auto-note, .create-save-note, .q-det-tip, .ds-empty {
    font-size: var(--fs-sub);
    color: var(--text-dim);
    line-height: var(--lh-body);
  }
  .ui-sub { font-size: var(--fs-sub); color: var(--text-dim); }
  .nt-info { font-size: var(--fs-sub); color: var(--text-dim); }

  /* ---- 伤兵营（校场与行军共用，v21 需求 1）---- */
  .wounded-box {
    margin-top: var(--sp-4);
    padding: var(--sp-4);
    border: 1px solid rgba(var(--gold-rgb), .30);
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, rgba(var(--gold-rgb), .10), rgba(var(--sh-rgb), .18));
  }
  .wounded-box .wb-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: var(--sp-2);
  }
  .wounded-box .wb-t { color: var(--gold-light); }   /* v82：字号/字重/字距走分区标题共享 */
  .wounded-box .wb-n {
    font-size: var(--fs-lead); font-weight: 800; color: var(--parchment);
    font-variant-numeric: tabular-nums;
  }
  .wounded-box .attr { border-bottom: 0; padding: var(--sp-0) 0; }
  .wounded-box .wb-act { margin-top: var(--sp-3); text-align: center; }

  /* ============ v89.132（老板）：军务处两营左右分列 ============
     ⚠️ 此前 .camp-card / .camp-rule 两个类名**从未定义**（v89.117 起就是裸 div）——
     本轮补齐，并把两营收成 .camp-cards 两列网格。 */
  /* ⚠️ 必须是 minmax(0,1fr) 而不是 1fr：1fr = minmax(auto,1fr)，列的 min-content
     会把另一列挤扁（实测 1098:272）。实测根因见下条「行内图标定尺寸」。 */
  .camp-cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  .camp-card {
    background: linear-gradient(180deg, rgba(var(--gold-rgb), .10), rgba(var(--sh-rgb), .18));
    border: 1px solid rgba(var(--gold-rgb), .30);
    border-radius: var(--r-lg);
    padding: var(--sp-4);
    min-width: 0;
  }
  /* v89.132（实测坑）：camp-card 行内兵种图标 svg.ico 无尺寸约束 → 按固有尺寸渲染，
     把 res-line 撑到 1072px（两列被带成 1098:272）。与本仓既有教训同族
     （index.html「`.eq-ico .ico{width/height:100%}` 尤其关键：少了它，位图会按固有尺寸」）。 */
  .camp-card .res-line .lbl .ico { width: 1.15em; height: 1.15em; vertical-align: -0.18em; }
  .camp-card .res-line .lbl { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .camp-card .res-line .val { flex: none; }
  .camp-card .wb-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-2); }
  .camp-card .wb-t { color: var(--gold-light); }
  .camp-card .wb-n { font-size: var(--fs-lead); font-weight: 800; color: var(--parchment); font-variant-numeric: tabular-nums; }
  .camp-card .camp-rule {
    margin-top: var(--sp-3); padding-top: var(--sp-2);
    border-top: 1px dashed rgba(var(--gold-rgb), .20);
    font-size: var(--fs-sub); color: var(--text-dim); line-height: var(--lh-body);
  }
  .camp-cards .auto-line { margin: var(--sp-3) 0 0; }

  /* ---- 页脚规格已收进上文「弹窗操作栏只有一条定义」（v89.105） ---- */

  /* ---- 门派六派：两列卡片（v89.105）----
     卡片内是"名称 + 被动 + 入派键"三段，纵向排；grid 让六派三行铺满。 */
  .sect-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .sect-grid .sect-card { display: block; padding: var(--sp-3) var(--sp-4); }
  .sect-grid .sect-card .op-hint { margin: var(--sp-1) 0 var(--sp-3); }
  .sect-grid .sect-card .btn { width: 100%; }

  /* ---- 设置项卡片（5 处重复的 inline 写法抽成一处）---- */
  .set-card {
    background: rgba(var(--sh-rgb), .20);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-5);
    margin-bottom: var(--sp-4);
  }

  /* ---- 卡片基线：同屏所有卡片同一几何（圆角/内边距）---- */
  /* v41（需求 2）：.gen-card 已随将领卡片墙删除；将领行改用 .gen-row 自己的一组几何 */
  .q-card, .item-row, .eq-cell, .bag-cell, .inn-card, .story-card, .xc-row {
    border-radius: var(--r-lg);
    padding: var(--sp-4);
  }
  /* 描边统一为发丝级；金色描边只保留给「可交互的兵种卡」等有语义处 */
  .q-card, .item-row, .bag-cell, .eq-cell, .inn-card, .story-card, .xc-row {
    border-color: var(--line);
  }
  /* v75（老板）：「尽量所有候选都能在同一页」——客栈候选行**紧凑几何**：
     共用基线给的 10px 内衬对"一页装下"太厚，这里就地收窄
     （同权重、写在基线之后者胜）；配 28px 头像 → 行高实测 36px。 */
  .inn-card { padding: var(--sp-1) var(--sp-4); margin-bottom: var(--sp-1); }

  /* ---- v89.117 数值族共享：**所有要竖着对齐的数字**一处定义 ----
     语义：表格数字列 / 资源读数 / 兵力数 / 倒计时 —— 等宽数字 + 700 字重。
     （原先各自写 `font-variant-numeric: tabular-nums` 的散在 20 余处；
     这条给它们一个共同基线，新增数字列直接挂 .num 或加这条选择器。） */
  .num, .tbl .num, .res-line .val, .bt-castle, .sd-cnt, .bt-ric .bt-rn {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  /* ---- 标题外观共享：三层界面的标题字重/字色/字距只有一处定义 ---- */
  .gold-heading, .m-title, .q-det-title {
    font-size: var(--fs-h2);
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(var(--sh-rgb), .6);
  }
  /* 三层界面的分区小标题同样只有一处定义；
     v82（老板「统一各级标题」）：把漏网的六处收进来 —— 任务详情 .q-det-sec /
     将领档案 .gp-sec / 时装 .fsn-t / 操作分区 .op-zone-t（原 12px 灰字）/
     史册 .ledger-sec / 简牍 .seal-h —— 全站分区标题同规格（13px / 800 / 金色 / 字距 .5px）。 */
  .q-sec-t, .q-det-sec, .bag-sec, .gd-sec, .forge-q, .m-sec, .side-title, .wb-t,
  .gp-sec, .fsn-t, .op-zone-t, .seal-h {          /* v89.105：.ledger-sec 随统计页退役（永不匹配） */
    font-size: var(--fs-h3);
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: .5px;
  }

  /* ---- 等级角标（v23 · 需求 2/3）：格内右上，只显示数字 ---- */
  .tile-badge {
    position: absolute; right: 4px; top: 3px;
    min-width: 17px; height: 17px; line-height: 17px; padding: 0 var(--sp-1);
    border-radius: var(--r-lg); text-align: center;
    font-size: var(--fs-cap); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--ink-on-gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow: 0 1px 3px rgba(var(--sh-rgb), .55);
  }
  .tile-badge.max { color: var(--ink-on-gold); background: linear-gradient(180deg, #a8e59a, var(--green-ok)); }
  /* 名字留在底部（等级不再挤在这一行） */
  .tile-label .lv { display: none; }

  /* ---- 官府宫殿（v23 · 需求 4）：4 格融合成一座建筑 ---- */
  .gov-palace { position: absolute; z-index: 3; cursor: pointer; transition: z-index 0s; }
  .gov-palace .tile-face { inset: 2px; border-radius: var(--r-xl); }
  .gov-palace .gov-art {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: var(--sp-5); pointer-events: none; z-index: 4;
  }
  .gov-palace .gov-svg { width: 86%; height: 86%; display: block; filter: none; }
  /* v36：官府位图（AI 汉代宫殿）。2×2 格的外框是正方形，与 1024×1024 方图同比例，
     contain 既不裁也不变形；底对齐 + 接地投影，让它"落"在台基上而非浮着。 */
  .gov-palace .gov-img {
    width: 100%; height: 100%; display: block;
    object-fit: contain; object-position: center bottom;
    filter: drop-shadow(0 3px 4px rgba(var(--sh-rgb),.42));
  }
  .gov-palace:hover .tile-face { filter: brightness(1.16); border-color: rgba(var(--gold-soft-rgb), .55); }
  .gov-palace:hover { z-index: 6; }
  .gov-palace.busy .tile-face { background: var(--grad-palace-busy); border-color: rgba(var(--gold-soft-rgb), .34); }

  /* ---- 统计页概览卡（v23 · 需求 5）---- */
  /* ============================================================
   * 竹简卷轴（v25 · 需求 14）：统计 / 公文 的美术底
   * ------------------------------------------------------------
   * 明确不用"数据座舱"式看板：那种一屏彩色卡片 + 圆角阴影，
   * 放在三国题材里是两张皮。这里改用**竹简 + 朱印**：
   *   · 竖向简纹（repeating-linear-gradient 画出片片竹简的缝）
   *   · 上下两根卷轴木轴（伪元素，带两端轴头）
   *   · 朱印作为标题标点，数值用朱笔/金笔大字
   * ============================================================ */
  /* ============================================================
   * 官府黄册（v27 · 需求 7）：统计页的信息呈现
   * ------------------------------------------------------------
   * 原先是一排 8 个「卡片 + 竖排标签 + 大字数值」，本质还是数据座舱：
   * 卡片之间有 8 处边框、8 处底色、8 处间距，眼睛没有落点，
   * 竖排标签还要转头去读。改成一册账本：
   *   · 分「甲 · 疆域 / 乙 · 军民 / 丙 · 在外」三段，每段内是
   *     「项目 …… 数值」的引线行，数值右对齐、等宽数字；
   *   · 只有墨线与朱点，没有卡片；信息密度提高，落点清晰。
   * ============================================================ */
  /* ============ 自动化（v29 · 需求 5） ============ */
  .auto-switches { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin: var(--sp-4) 0; }
  .auto-switches .btn { flex: 1 1 150px; }
  .auto-switches .btn.auto-on {
    background: var(--grad-auto-on);
    border-color: var(--green-ok); color: var(--text-strong);
    box-shadow: 0 2px 6px rgba(var(--sh-rgb),.4), inset 0 1px 0 rgba(var(--hl-rgb),.12);
  }
  .auto-card { border: 1px solid var(--gold-dark); border-radius: var(--r-lg); padding: var(--sp-mid);
    margin-bottom: var(--sp-mid); background: rgba(var(--sh-rgb),.2); }
  .auto-card > .ac-title { color: var(--gold-light); font-weight: 700; margin-bottom: var(--sp-3);
    display: flex; align-items: center; gap: var(--sp-3); }
  .auto-line { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; margin: var(--sp-3) 0; }
  .auto-line > .al-k { flex: none; width: 72px; color: var(--text-dim); font-size: var(--fs-sub); }
  .auto-note { color: var(--text-dim); font-size: var(--fs-sub); margin-top: var(--sp-3); }
  .auto-state { margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md);
    background: rgba(var(--sh-rgb),.28); border: 1px solid var(--line-strong);
    font-size: var(--fs-sub); color: var(--text-dim); }
  /* ============ 自动化 · 左右分栏（v89.115 · 老板令） ============
     「左三分之一为自动功能列表（简洁），右侧三分之二为介绍展示和详细设置面板
      （类似将领界面），通过切换左侧自动化功能浏览和设置」 */
  .auto-grid { display: grid; grid-template-columns: 1fr 2fr; gap: var(--sp-mid); align-items: start; }
  .auto-side { display: flex; flex-direction: column; gap: var(--sp-1); }
  .auto-item { display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line-strong); border-radius: var(--r-md);
    background: rgba(var(--sh-rgb),.22); cursor: pointer; transition: border-color .15s, background .15s; }
  .auto-item:hover { border-color: var(--gold-dark); }
  .auto-item.sel { border-color: var(--gold-light); background: rgba(var(--gold-rgb),.10); }
  .auto-item .ai-dot { flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(var(--sh-rgb),.9); border: 1px solid var(--line-strong); }
  .auto-item.on .ai-dot { background: var(--green-ok); border-color: var(--green-ok);
    box-shadow: 0 0 6px rgba(var(--green-ok-rgb), .55); }
  .auto-item .ai-ico { flex: none; }
  .auto-item .ai-main { display: flex; flex-direction: column; min-width: 0; }
  .auto-item .ai-name { color: var(--text); font-size: var(--fs-sub); }
  .auto-item .ai-sub { color: var(--text-dim); font-size: var(--fs-cap);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .auto-pane { border: 1px solid var(--gold-dark); border-radius: var(--r-lg);
    padding: var(--sp-mid); background: rgba(var(--sh-rgb),.2); min-height: 260px; }
  .auto-pane .ap-head { display: flex; align-items: center; gap: var(--sp-2);
    padding-bottom: var(--sp-2); margin-bottom: var(--sp-2); border-bottom: 1px solid var(--line-strong); }
  .auto-pane .ap-ico { font-size: var(--fs-h1); }
  .auto-pane .ap-name { flex: 1; color: var(--gold-light); font-weight: 700; }
  .auto-pane .ap-state { font-size: var(--fs-sub); color: var(--text-dim); }

  /* v29（需求 7）：全境汇总左右分列 —— 同类同侧 */
  /* v29（需求 9）：城池名后的等级标注 [都城] / [州城] … */
